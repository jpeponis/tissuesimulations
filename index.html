<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tissue Weather</title>
<meta name="description" content="A 3D interactive for teaching dynamic reciprocity: cells and extracellular matrix remodelling each other under growth factor, load and protease dials.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Tissue Weather — single deliberate dark-field treatment. The 3D viewport is a
   dark-field micrograph; the panel is an instrument console beside it. Every
   colour is painted explicitly so the page holds on any host ground.
   Contrast (WCAG 2.2 AA, checked against --panel / --surface):
     --text  15.4 / 14.2   --muted 6.4 / 5.9   --faint 5.4 / 5.0 (informational text)
     --deco  3.4 / 3.2     decoration only (stripes, rules), never text. */
:root {
  color-scheme: dark;
  --ground: #0b0f14;        /* viewport */
  --panel: #10161e;         /* console */
  --surface: #161e28;       /* cards, inputs */
  --surface-2: #1c2632;
  --rule: #243040;
  --text: #e6edf3;
  --muted: #8b9bb0;
  --faint: #7d8ea6;         /* quiet but readable: ≥ 4.5:1 on every surface */
  --deco: #5d6d82;          /* decoration only */
  --amber: #e0a24a;         /* mature collagen: the one accent */
  --amber-ink: #f2c47a;
  --cool: #7fc4ff;          /* new matrix */
  --cell-q: #4ea3ff;        /* quiescent cell */
  --cell-a: #ff7a3d;        /* activated cell */
  --gf: #3fd6c4;            /* growth-factor haze */
  --mmp: #e05bd0;           /* protease haze */
  --focus: #ffd27a;
  --font-ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --panel-w: 392px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--text);
  font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: var(--amber-ink); }
kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface-2); color: var(--text); }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

#app { display: grid; grid-template-columns: 1fr var(--panel-w); height: 100vh; height: 100dvh; }
#stage { position: relative; min-width: 0; min-height: 0; background: var(--ground); }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#view:focus-visible { outline-offset: -3px; }

/* HUD over the viewport */
.hud { position: absolute; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-top { left: 20px; top: 16px; right: 20px; display: grid; gap: 6px; max-width: 560px; }
.brand { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1; letter-spacing: -0.01em; }
.brand em { font-style: italic; color: var(--amber-ink); }
.brand small { font-family: var(--font-ui); font-size: 12px; color: var(--muted); margin-left: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
.clock { font-family: var(--font-mono); font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.clock b { color: var(--text); font-weight: 500; }
.equilibrium { margin: 4px 0 0; font-size: 15px; max-width: 46ch; color: var(--text); text-wrap: pretty; text-shadow: 0 1px 8px rgba(0,0,0,0.7); min-height: 1.4em; }
.equilibrium[data-state]::before {
  content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; background: var(--muted);
}
.equilibrium[data-state="condensing"]::before { background: var(--amber); }
.equilibrium[data-state="evaporating"]::before { background: var(--cool); }
.equilibrium[data-state="flash"]::before { background: var(--focus); }

/* legend: a collapsible so it stays reachable on small screens */
.hud-legend { left: 20px; bottom: 16px; font-size: 12px; color: var(--muted); max-width: min(48%, 420px); pointer-events: auto; }
.hud-legend summary { cursor: pointer; display: inline-block; min-height: 24px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--rule); background: rgba(16,22,30,0.85); color: var(--text); font-size: 12px; }
.hud-legend summary::-webkit-details-marker { display: none; }
.hud-legend summary::before { content: "▸ "; color: var(--muted); }
.hud-legend[open] summary::before { content: "▾ "; }
#legend { margin-top: 8px; display: grid; gap: 6px; background: rgba(16,22,30,0.72); border-radius: 8px; padding: 8px 10px; }
.legend-swatches { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.legend-row { display: flex; align-items: center; gap: 8px; }
.swatch { width: 34px; height: 8px; border-radius: 4px; flex: none; }
.legend-guide summary { display: inline-block; min-height: 24px; line-height: 24px; border: 0; background: none; padding: 0; color: var(--muted); }
.legend-guide summary::before { content: "▸ "; }
.legend-guide[open] summary::before { content: "▾ "; }
.legend-guide ul { margin: 6px 0 0; padding-left: 16px; display: grid; gap: 4px; max-width: 46ch; }

.hud-layers { right: 16px; bottom: 16px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 48%; }
.chip { border: 1px solid var(--rule); background: rgba(16,22,30,0.85); color: var(--muted); border-radius: 999px; padding: 4px 11px; min-height: 28px; font-size: 12px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--text); border-color: var(--muted); background: var(--surface-2); }
.chip:hover { color: var(--text); }

/* notices: CDN / WebGL failures */
#notice { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92%, 520px); background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--amber); border-radius: 10px; padding: 16px 18px; color: var(--text); box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
#notice h2 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
#notice p { margin: 6px 0; color: var(--muted); font-size: 13px; }
#notice code { font-family: var(--font-mono); font-size: 12px; color: var(--text); }
#notice[hidden] { display: none; }

/* Console */
#panel { background: var(--panel); border-left: 1px solid var(--rule); overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 18px; padding: 16px 18px 28px; }
section h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.segmented { display: flex; margin: 0; padding: 0; min-width: 0; min-inline-size: 0; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--surface); }
.segmented .seg { flex: 1; position: relative; min-width: 0; }
.segmented .seg + .seg { border-left: 1px solid var(--rule); }
.segmented input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.segmented span { display: block; text-align: center; padding: 7px 8px; min-height: 34px; color: var(--muted); font-size: 13px; line-height: 1.3; }
.segmented input:checked + span { background: var(--surface-2); color: var(--text); box-shadow: inset 0 -2px 0 var(--amber); }
.segmented input:hover + span { color: var(--text); }
.segmented input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: -3px; border-radius: 6px; }
.tissue-short { margin: 6px 0 0; font-size: 12px; color: var(--faint); }

.hint-card { display: flex; gap: 10px; align-items: center; background: var(--surface); border-left: 3px solid var(--amber); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.hint-card p { margin: 0; flex: 1; }
.hint-card b { color: var(--amber-ink); font-weight: 500; }
.hint-card button { border: 1px solid var(--rule); background: var(--surface-2); border-radius: 6px; padding: 5px 10px; min-height: 28px; cursor: pointer; font-size: 12px; color: var(--text); }

.scenarios { display: flex; flex-wrap: wrap; gap: 6px; }
.scenario-btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 6px 10px; min-height: 32px; cursor: pointer; color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
.scenario-btn kbd { font-size: 10px; padding: 0 4px; color: var(--muted); border-bottom-width: 1px; }
.scenario-btn[aria-pressed="true"] { color: var(--text); border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.scenario-btn[aria-pressed="true"] kbd { color: var(--text); }
.scenario-btn:hover { color: var(--text); }
.scenario-card { background: var(--surface); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; }
.scenario-card h3 { margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 400; letter-spacing: -0.005em; text-wrap: balance; }
.scenario-card p { margin: 0; color: var(--text); }
.scenario-card .goal { color: var(--muted); }
.scenario-card ol { margin: 0; padding-left: 20px; display: grid; gap: 3px; }
.scenario-card .question { border-left: 2px solid var(--amber); padding-left: 10px; color: var(--amber-ink); }
.scenario-card details { color: var(--muted); font-size: 13px; }
.scenario-card summary { cursor: pointer; color: var(--muted); min-height: 24px; }
.scenario-card .note { color: var(--faint); }

.dial { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "label value" "slider slider" "hint hint"; gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--rule); }
.dial:first-of-type { border-top: 0; }
.dial label { grid-area: label; font-weight: 500; display: flex; align-items: baseline; gap: 8px; }
.dial .metaphor { font-family: var(--font-display); font-style: italic; color: var(--amber-ink); font-size: 15px; font-weight: 400; }
.dial output { grid-area: value; font-family: var(--font-mono); font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; align-self: baseline; }
.dial input[type=range] { grid-area: slider; width: 100%; margin: 4px 0 2px; accent-color: var(--amber); height: 28px; cursor: pointer; }
.dial .hint { grid-area: hint; font-size: 12px; color: var(--muted); }
.dial .hint b { color: var(--text); font-weight: 500; }
.dial .metaphor-note { color: var(--faint); font-style: italic; }

.transport { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.transport button { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 8px 6px; min-height: 36px; cursor: pointer; font-weight: 500; font-size: 13px; }
.transport button:hover { background: var(--surface-2); }
.transport button.primary { background: var(--amber); color: #1a1206; border-color: var(--amber); }
.transport button.primary:hover { background: var(--amber-ink); }
.transport button.danger { color: var(--cell-a); }
.transport button[hidden] { display: none; }
.speed { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
.speed input { accent-color: var(--amber); height: 28px; margin: 0; }
.speed output { font-family: var(--font-mono); color: var(--text); font-variant-numeric: tabular-nums; }
.speed .speed-hint { grid-column: 2 / -1; color: var(--faint); font-variant-numeric: tabular-nums; }
.share { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.share button, .tools-row button { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 5px 10px; min-height: 28px; cursor: pointer; font-size: 12px; color: var(--text); }
.share button:hover, .tools-row button:hover { background: var(--surface-2); }
.share .link-out { flex: 1 1 100%; min-height: 28px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--text); font-family: var(--font-mono); font-size: 11px; padding: 4px 8px; }
.share .link-out[hidden] { display: none; }

.readout { display: grid; gap: 2px; margin-bottom: 12px; }
.readout .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.readout h3 { margin: 0; font-size: 13px; font-weight: 500; color: var(--text); }
.readout .meaning .unit { color: var(--text); }
.readout .val { font-family: var(--font-mono); font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; text-align: right; flex: none; }
.readout .meaning { margin: 0 0 2px; font-size: 12px; color: var(--muted); }
.readout canvas { width: 100%; height: 84px; display: block; background: var(--surface); border-radius: 6px; }
.readout .keys { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); min-height: 14px; }
.readout .keys i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.readout .keys i.dash { width: 14px; height: 0; border-top: 2px dashed var(--muted); vertical-align: 3px; border-radius: 0; }
.readout .keys [hidden] { display: none; }
.gauge canvas { width: 100%; height: 62px; display: block; background: var(--surface); border-radius: 6px; }
.tools-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tools-row button[aria-pressed="true"] { border-color: var(--amber); color: var(--amber-ink); }
.tools-row button[hidden] { display: none; }
#stats-table { margin-top: 8px; overflow-x: auto; }
#stats-table[hidden] { display: none; }
#stats-table table { width: 100%; border-collapse: collapse; font-size: 12px; }
#stats-table caption { text-align: left; color: var(--muted); padding: 0 0 6px; font-family: var(--font-mono); }
#stats-table th, #stats-table td { text-align: left; padding: 4px 6px; border-top: 1px solid var(--rule); vertical-align: top; }
#stats-table thead th { color: var(--muted); font-weight: 500; border-top: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
#stats-table tbody th { font-weight: 500; }
#stats-table td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

.about { color: var(--muted); font-size: 13px; }
.about summary { cursor: pointer; color: var(--text); font-weight: 500; min-height: 24px; }
.about p { margin: 8px 0; max-width: 60ch; }
.about .tagline { color: var(--text); font-family: var(--font-display); font-size: 16px; font-style: italic; }
.about h3 { margin: 14px 0 6px; font-size: 13px; color: var(--text); font-weight: 600; }
.about dl { margin: 8px 0; display: grid; gap: 8px; }
.about dt { color: var(--text); font-style: italic; font-family: var(--font-display); font-size: 16px; }
.about dd { margin: 0; }
.about .keys-list { margin: 6px 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.about .tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.about .tools button, .about .tools a { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 6px 10px; min-height: 28px; cursor: pointer; font-size: 12px; color: var(--text); text-decoration: none; display: inline-flex; align-items: center; }
.note { font-size: 12px; color: var(--faint); }

#busy { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(11,15,20,0.6); color: var(--text); font-family: var(--font-mono); font-size: 13px; }
#busy[hidden] { display: none; }
[hidden] { display: none !important; }

@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 58vh auto; height: auto; }
  #panel { border-left: 0; border-top: 1px solid var(--rule); }
  .hud-top { max-width: 70%; }
  .brand { font-size: 24px; }
  .equilibrium { font-size: 13px; }
  .hud-legend { max-width: calc(50% - 30px); }
  .hud-layers { max-width: calc(50% - 22px); }
  #legend { max-height: 45vh; overflow-y: auto; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <main id="stage" aria-label="3D tissue view">
    <canvas id="view" role="img" tabindex="0" aria-label="3D tissue view, loading"></canvas>
    <div class="hud hud-top">
      <h1 class="brand"><em>Tissue Weather</em><small>dynamic reciprocity</small></h1>
      <div class="clock"><span>day <b id="day">0.0</b></span><span id="tissue-name"></span><span id="scenario-name"></span><span id="fps" class="note"></span></div>
      <p class="equilibrium" id="equilibrium" data-state="steady" role="status" aria-live="polite" aria-atomic="true"></p>
    </div>
    <details class="hud hud-legend" id="legend-box" open>
      <summary>Legend</summary>
      <div id="legend"></div>
    </details>
    <div class="hud hud-layers" id="layers" role="group" aria-label="Layers shown in the 3D view"></div>
    <div id="notice" role="alert" hidden></div>
    <div id="busy" hidden>preparing tissue…</div>
  </main>
  <aside id="panel" aria-label="Controls and readouts">
    <section>
      <h2 id="h-tissue">Tissue</h2>
      <fieldset class="segmented" id="tissue-picker" aria-labelledby="h-tissue"></fieldset>
      <p class="tissue-short" id="tissue-short"></p>
    </section>
    <div class="hint-card" id="hint" role="note">
      <p><b>First time here?</b> Pick a scenario, press Play, then move a dial.</p>
      <button type="button" id="hint-dismiss" aria-label="Dismiss this hint">Got it</button>
    </div>
    <section>
      <h2 id="h-scenario">Scenario</h2>
      <div class="scenarios" id="scenarios" role="group" aria-labelledby="h-scenario"></div>
    </section>
    <section class="scenario-card" id="scenario-card" aria-label="Scenario details"></section>
    <section>
      <h2>Weather</h2>
      <div id="dials"></div>
    </section>
    <section>
      <h2>Run</h2>
      <div class="transport">
        <button id="btn-play" class="primary" type="button" aria-keyshortcuts="Space" title="Run the simulation (Space)">Play</button>
        <button id="btn-step" type="button" title="Advance one simulated day">+1 day</button>
        <button id="btn-injure" class="danger" type="button" title="Wound the tissue at a random spot" aria-keyshortcuts="i" hidden>Injure</button>
        <button id="btn-reset" type="button" title="Restart this scenario from day 0; the current run stays as dashed lines" aria-keyshortcuts="r">Reset</button>
      </div>
      <div class="speed">
        <label for="speed">speed</label>
        <input id="speed" type="range" min="0.25" max="20" step="0.25" value="2" aria-describedby="speed-hint">
        <output id="speed-out" for="speed">2 d/s</output>
        <span class="speed-hint" id="speed-hint">1 week ≈ 3.5 s</span>
      </div>
      <div class="share">
        <button type="button" id="btn-copy-link" title="Copy a link that restores this tissue, scenario, dials and speed">Copy link</button>
        <input class="link-out" id="link-out" type="text" readonly aria-label="Link to this view" hidden>
      </div>
    </section>
    <section>
      <h2>Readouts</h2>
      <div id="readouts"></div>
      <div class="tools-row">
        <button type="button" id="btn-table" aria-pressed="false" aria-controls="stats-table" title="Show the latest values as a text table">Table</button>
        <button type="button" id="btn-clear-ref" hidden title="Remove the dashed previous-run lines from the charts">Clear comparison</button>
      </div>
      <div id="stats-table" hidden></div>
    </section>
    <section>
      <h2>About</h2>
      <details class="about" id="about">
        <summary>What am I looking at?</summary>
        <div id="about-body"></div>
      </details>
    </section>
  </aside>
</div>
<script type="module" src="./src/app.js"></script>
<script>
// Fallback for the case the app module itself (or Three.js, which it imports)
// fails to load: the module never runs, so a classic script explains why.
(function () {
  var shown = false;
  function show(title, body) {
    if (shown || window.tissueApp) return;
    shown = true;
    var n = document.getElementById('notice');
    if (!n) return;
    n.innerHTML = '<h2></h2><p></p><p>To use this page offline: reload once with an internet connection so the browser caches the library, or download <code>three@0.160.0</code> (<code>build/three.module.js</code> and <code>examples/jsm/controls/OrbitControls.js</code>) next to this page and point the import map at those files. If you opened the file directly (file://), serve the folder over HTTP instead, e.g. <code>python3 -m http.server</code>.</p>';
    n.firstChild.textContent = title;
    n.children[1].textContent = body;
    n.hidden = false;
  }
  var mods = document.querySelectorAll('script[type="module"]');
  for (var i = 0; i < mods.length; i++) {
    mods[i].addEventListener('error', function () {
      show('Tissue Weather could not start', 'The app or the 3D library (Three.js, loaded from cdn.jsdelivr.net) failed to load. Check the connection and reload.');
    });
  }
  window.setTimeout(function () {
    if (!window.tissueApp) show('Still loading…', 'The app has not started after 20 seconds. The 3D library (Three.js) is fetched from cdn.jsdelivr.net; a slow or blocked connection is the usual cause. Check the connection and reload.');
  }, 20000);
})();
</script>
</body>
</html>
