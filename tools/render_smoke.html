<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tissue Weather — render smoke</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f14; color: #cfd8e3; font: 12px/1.4 system-ui, sans-serif; }
  #viewport { position: fixed; inset: 0; }
  #viewport canvas { display: block; }
  #hud { position: fixed; left: 12px; top: 12px; background: rgba(11,15,20,0.72); border: 1px solid #253040;
         border-radius: 8px; padding: 10px 12px; min-width: 260px; backdrop-filter: blur(4px); }
  #hud h1 { font-size: 13px; margin: 0 0 6px; color: #e6eef8; font-weight: 600; }
  #hud label { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; }
  #hud .row { margin: 6px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #hud input[type=range] { width: 160px; }
  #hud button { background: #1a2433; color: #e6eef8; border: 1px solid #2f3d52; border-radius: 5px; padding: 2px 8px; cursor: pointer; }
  #stats { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #9fb3c8; white-space: pre; }
  #err { position: fixed; left: 12px; bottom: 12px; color: #ff8a80; font-family: ui-monospace, monospace; font-size: 11px; white-space: pre-wrap; max-width: 60vw; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="viewport"><canvas id="c"></canvas></div>
<div id="hud">
  <h1>Tissue Weather — render smoke</h1>
  <div class="row"><span>t = <b id="tval">0.0</b> d</span>
    <input id="t" type="range" min="0" max="60" step="0.1" value="0">
    <button id="play">Play</button></div>
  <div class="row">
    <label><input id="fibers" type="checkbox" checked> fibers</label>
    <label><input id="cells" type="checkbox" checked> cells</label>
    <label><input id="g" type="checkbox"> g (teal)</label>
    <label><input id="m" type="checkbox"> m (magenta)</label>
    <label><input id="auto" type="checkbox" checked> auto-rotate</label>
  </div>
  <div class="row"><span>strain</span><input id="strain" type="range" min="0" max="1" step="0.01" value="0.6">
    <span id="strainval">0.60</span></div>
  <div id="stats"></div>
</div>
<div id="err"></div>

<script type="module">
import { TissueRenderer } from '../src/render.js';

// ---------------------------------------------------------------------------
// Fake state generator — exact layout of SPEC 1.1–1.2 / model.js contract.
// Deterministic (seeded), animated in t (days): density rises, fibers align
// to z, matrix matures, cells activate and align; a wound at day 4 heals.
// ---------------------------------------------------------------------------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const ramp = (t, tau) => 1 - Math.exp(-Math.max(0, t) / tau);
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);

let fakeCache = null;
function buildFakeBase(N, nCells) {
  const V = N * N * N, rand = mulberry32(1234567 + N * 1000 + nCells);
  const rvec = new Float32Array(3 * V), spat = new Float32Array(V), jit = new Float32Array(V), wound = new Float32Array(V);
  const wc = [0.72, 0.32, 0.5], wr = 0.24;
  for (let v = 0; v < V; v++) {
    const i = (v / (N * N)) | 0, j = ((v / N) | 0) % N, k = v % N;
    const x = (i + 0.5) / N, y = (j + 0.5) / N, z = (k + 0.5) / N;
    spat[v] = 0.55 + 0.45 * Math.sin(3.1 * x + 1.7) * Math.cos(2.3 * y - 0.4) * Math.cos(2.9 * z + 0.8);
    jit[v] = rand();
    const zz = rand() * 2 - 1, ph = rand() * Math.PI * 2, s = Math.sqrt(1 - zz * zz);
    rvec[3 * v] = s * Math.cos(ph); rvec[3 * v + 1] = s * Math.sin(ph); rvec[3 * v + 2] = zz;
    const d = Math.hypot(x - wc[0], y - wc[1], z - wc[2]);
    wound[v] = clamp01(1 - (d - wr * 0.6) / (wr * 0.6));
  }
  const cx0 = new Float32Array(3 * nCells), cph = new Float32Array(3 * nCells), cr = new Float32Array(3 * nCells), cu = new Float32Array(nCells);
  for (let c = 0; c < nCells; c++) {
    for (let d = 0; d < 3; d++) { cx0[3 * c + d] = 0.05 + 0.9 * rand(); cph[3 * c + d] = rand() * Math.PI * 2; }
    const zz = rand() * 2 - 1, ph = rand() * Math.PI * 2, s = Math.sqrt(1 - zz * zz);
    cr[3 * c] = s * Math.cos(ph); cr[3 * c + 1] = s * Math.sin(ph); cr[3 * c + 2] = zz;
    cu[c] = rand();
  }
  const F = () => new Float32Array(V);
  const state = {
    N, rho: F(), rhoMat: F(), fa: F(), fx: F(), fy: F(), fz: F(), g: F(), m: F(), E: F(),
    nCells, cx: new Float32Array(3 * nCells), cp: new Float32Array(3 * nCells), alpha: new Float32Array(nCells),
    dials: { Gext: 0.5, strain: 0.6, protease: 0.4, nCells },
  };
  return { N, nCells, V, rvec, spat, jit, wound, cx0, cph, cr, cu, wc, wr, state };
}

function makeFakeState(N, nCells, t, dials = {}) {
  if (!fakeCache || fakeCache.N !== N || fakeCache.nCells !== nCells) fakeCache = buildFakeBase(N, nCells);
  const B = fakeCache, S = B.state, V = B.V;
  const Gext = dials.Gext ?? 0.5, strain = dials.strain ?? 0.6, protease = dials.protease ?? 0.4;
  S.dials.Gext = Gext; S.dials.strain = strain; S.dials.protease = protease; S.dials.nCells = nCells;
  const dens = 0.06 + 1.05 * ramp(t, 22);          // mean density trajectory
  const align = ramp(t, 18) * (0.35 + 0.65 * strain); // alignment toward z
  const matur = ramp(t, 28);                        // maturity fraction
  const ws = t < 4 ? 0 : 0.9 * Math.exp(-(t - 4) / 18); // wound strength (injury at day 4)
  for (let v = 0; v < V; v++) {
    const sp = B.spat[v], jt = B.jit[v], w = B.wound[v] * ws;
    let rho = dens * (0.6 + 0.6 * sp) * (0.9 + 0.2 * jt);
    rho *= 1 - 0.85 * w;
    rho = Math.min(2, rho);
    let fa = clamp01((0.06 + 0.04 * jt + 0.85 * align * (0.7 + 0.3 * sp)) * (1 - w));
    const bz = align * (1 - w);
    let fx = (1 - bz) * B.rvec[3 * v], fy = (1 - bz) * B.rvec[3 * v + 1], fz = (1 - bz) * B.rvec[3 * v + 2] + bz * (B.rvec[3 * v + 2] < 0 ? -1 : 1);
    const fl = Math.hypot(fx, fy, fz) || 1; fx /= fl; fy /= fl; fz /= fl;
    const phi = clamp01(matur * (0.75 + 0.25 * sp) * (1 - w));
    const rhoMat = phi * rho;
    const x = B.rvec[3 * v]; // reuse as cheap pseudo-coordinate noise
    const g = clamp01(Gext * (0.75 + 0.35 * sp) + 0.5 * w + 0.05 * x);
    const m = clamp01(protease * (0.6 + 0.5 * (1 - sp)) * (1 - 0.6 * ramp(t, 25)) + 0.8 * w);
    S.rho[v] = rho; S.rhoMat[v] = rhoMat; S.fa[v] = fa; S.fx[v] = fx; S.fy[v] = fy; S.fz[v] = fz;
    S.g[v] = g; S.m[v] = m;
    S.E[v] = 0.3 + 20 * rho * rho * (1 + 3 * phi) * (1 + strain);
  }
  const act = ramp(t, 9), pal = 0.9 * ramp(t, 14) * (0.4 + 0.6 * strain);
  for (let c = 0; c < nCells; c++) {
    for (let d = 0; d < 3; d++) {
      const x = B.cx0[3 * c + d] + 0.035 * Math.sin(0.35 * t + B.cph[3 * c + d]);
      S.cx[3 * c + d] = Math.min(0.97, Math.max(0.03, x));
    }
    const dw = Math.hypot(S.cx[3 * c] - B.wc[0], S.cx[3 * c + 1] - B.wc[1], S.cx[3 * c + 2] - B.wc[2]);
    const inW = dw < B.wr ? ws : 0;
    let px = (1 - pal) * B.cr[3 * c], py = (1 - pal) * B.cr[3 * c + 1], pz = (1 - pal) * B.cr[3 * c + 2] + pal * (B.cr[3 * c + 2] < 0 ? -1 : 1);
    const pl = Math.hypot(px, py, pz) || 1;
    S.cp[3 * c] = px / pl; S.cp[3 * c + 1] = py / pl; S.cp[3 * c + 2] = pz / pl;
    S.alpha[c] = clamp01(act * (0.35 + 0.65 * B.cu[c]) * (0.6 + 0.8 * Gext) + 0.6 * inW);
  }
  return S;
}

// ---------------------------------------------------------------------------
// Page wiring: URL params → t, N, n, layers, strain; HUD; stats; test hooks.
// ---------------------------------------------------------------------------
const q = new URLSearchParams(location.search);
const num = (k, d) => (q.has(k) && !Number.isNaN(+q.get(k)) ? +q.get(k) : d);
const flag = (k, d) => (q.has(k) ? q.get(k) !== '0' && q.get(k) !== 'false' : d);
const N = num('N', 12), nCells = num('n', 160), K = num('K', 3);
let t = num('t', 0), speed = num('speed', 4), playing = flag('play', false);
const layers = { fibers: flag('fibers', true), cells: flag('cells', true), g: flag('g', false), m: flag('m', false) };
const dials = { Gext: num('Gext', 0.5), strain: num('strain', 0.6), protease: num('protease', 0.4) };
const errBox = document.getElementById('err');
const errors = [];
const logErr = (msg) => { errors.push(msg); errBox.textContent = errors.slice(-6).join('\n'); };
window.addEventListener('error', (e) => logErr('error: ' + e.message));
window.addEventListener('unhandledrejection', (e) => logErr('rejection: ' + (e.reason && e.reason.message || e.reason)));
if (!flag('hud', true)) document.getElementById('hud').hidden = true;

// Any `opt.<name>=<value>` URL parameter is passed straight into TissueRenderer opts (tuning).
const rendererOpts = { K, autoRotate: flag('auto', true), toneMapping: q.get('tm') || 'aces', exposure: num('exposure', 1.08) };
for (const [k, v] of q) if (k.startsWith('opt.')) rendererOpts[k.slice(4)] = v === 'true' ? true : v === 'false' ? false : (v !== '' && !Number.isNaN(+v)) ? +v : v;
const canvas = document.getElementById('c');
const renderer = new TissueRenderer(canvas, rendererOpts);

// HUD
const $ = (id) => document.getElementById(id);
$('t').value = t; $('tval').textContent = t.toFixed(1);
$('strain').value = dials.strain; $('strainval').textContent = dials.strain.toFixed(2);
for (const k of ['fibers', 'cells', 'g', 'm']) { $(k).checked = layers[k]; $(k).onchange = () => { layers[k] = $(k).checked; }; }
$('auto').checked = flag('auto', true);
$('auto').onchange = () => renderer.setAutoRotate($('auto').checked);
$('t').oninput = () => { t = +$('t').value; playing = false; $('play').textContent = 'Play'; };
$('strain').oninput = () => { dials.strain = +$('strain').value; $('strainval').textContent = dials.strain.toFixed(2); };
$('play').textContent = playing ? 'Pause' : 'Play';
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; };

// stats
let frames = 0, statFrames = 0, sumUpd = 0, sumRen = 0, fps = 0, winStart = performance.now(), winFrames = 0;
const upd = [], ren = [];
function resetStats() { statFrames = 0; sumUpd = 0; sumRen = 0; upd.length = 0; ren.length = 0; winStart = performance.now(); winFrames = 0; fps = 0; }
function stats() {
  const mean = (a) => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
  const sorted = [...upd].sort((a, b) => a - b);
  return { frames: statFrames, fps: +fps.toFixed(2), updateMs: +mean(upd).toFixed(3), updateMsP95: +(sorted[Math.floor(sorted.length * 0.95)] || 0).toFixed(3),
           renderCpuMs: +mean(ren).toFixed(3), fibersVisible: renderer.stats.fibersVisible, cells: renderer.stats.cells, N, nCells, K, t: +t.toFixed(2) };
}
let readyResolve; const ready = new Promise((r) => { readyResolve = r; });
const frameWaiters = [];
let lastNow = performance.now(), state = null;
function loop(now) {
  const dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  if (playing) { t = Math.min(60, t + speed * dt); $('t').value = t; if (t >= 60) { playing = false; $('play').textContent = 'Play'; } }
  $('tval').textContent = t.toFixed(1);
  state = makeFakeState(N, nCells, t, dials);
  const a = performance.now();
  renderer.update(state, layers);
  const b = performance.now();
  renderer.render();
  const c = performance.now();
  upd.push(b - a); ren.push(c - b); if (upd.length > 240) { upd.shift(); ren.shift(); }
  frames++; statFrames++; winFrames++;
  if (now - winStart >= 1000) { fps = winFrames * 1000 / (now - winStart); winStart = now; winFrames = 0; }
  if (frames % 15 === 0) { const s = stats(); $('stats').textContent = `fps ${s.fps}  update ${s.updateMs} ms  render(cpu) ${s.renderCpuMs} ms\nfibers ${s.fibersVisible}/${N * N * N * K}  cells ${s.cells}  N=${N} K=${K}`; }
  if (frames === 1) readyResolve(true);
  for (let i = frameWaiters.length - 1; i >= 0; i--) { if (--frameWaiters[i].n <= 0) { frameWaiters[i].r(); frameWaiters.splice(i, 1); } }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Reads back the rendered frame to check it is not blank (for the harness).
function probePixels() {
  const url = renderer.screenshot();
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const w = 160, h = Math.max(1, Math.round(160 * img.height / img.width));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
      const d = ctx.getImageData(0, 0, w, h).data;
      let lum = 0, lit = 0, hist = { blue: 0, amber: 0 };
      for (let i = 0; i < d.length; i += 4) {
        const l = 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
        lum += l; if (l > 40) lit++;
        if (d[i + 2] > d[i] + 25) hist.blue++; else if (d[i] > d[i + 2] + 25) hist.amber++;
      }
      const n = d.length / 4;
      resolve({ dataUrlLength: url.length, meanLum: +(lum / n).toFixed(1), litFrac: +(lit / n).toFixed(3), blueFrac: +(hist.blue / n).toFixed(3), amberFrac: +(hist.amber / n).toFixed(3) });
    };
    img.src = url;
  });
}
function glInfo() {
  const gl = renderer.renderer.getContext();
  const ext = gl.getExtension('WEBGL_debug_renderer_info');
  return { version: gl.getParameter(gl.VERSION), renderer: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
           dpr: renderer.renderer.getPixelRatio(), width: canvas.width, height: canvas.height, triangles: renderer.renderer.info.render.triangles, calls: renderer.renderer.info.render.calls };
}
window.__smoke = {
  ready, renderer, makeFakeState, errors,
  setTime: (v) => { t = v; playing = false; },
  setLayers: (L) => { Object.assign(layers, L); for (const k of ['fibers', 'cells', 'g', 'm']) $(k).checked = layers[k]; },
  setDials: (D) => Object.assign(dials, D),
  setPlaying: (p) => { playing = !!p; },
  waitFrames: (n) => new Promise((r) => frameWaiters.push({ n, r })),
  stats, resetStats, probePixels, glInfo,
  get state() { return state; },
};
</script>
</body>
</html>
