# CI for Tissue Weather. The repository has no runtime and no build dependencies:
# `npm test` is `node --test`, the build is one Node script, and Three.js comes from a CDN at
# run time. So there is nothing to `npm ci` and no lockfile to cache.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- tests, build, dist freshness
  node:
    name: tests and single-file build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # conformance for every registered tissue, the two golden regressions, the engine API, the
      # build constraints of docs/EXTENDING.md §0, the developer tools, the export contract
      # (blender/import_tissue.py --dry-run, python3 is on the runner) and the teaching claims
      - name: npm test
        run: npm test

      # check-dist runs BEFORE build on purpose: it judges the COMMITTED dist/*.html against a
      # fresh build in a temp dir. Run it after `npm run build` and it can only ever pass.
      - name: npm run check-dist (is the committed dist/ up to date?)
        run: npm run check-dist

      - name: npm run build
        run: npm run build

      # `git diff` only sees TRACKED files, so check for new untracked ones too: a build output
      # that nobody committed is just as stale as one that changed.
      - name: dist/ is unchanged by a rebuild
        run: |
          git diff --exit-code -- dist
          test -z "$(git status --porcelain -- dist)" || { git status --porcelain -- dist; exit 1; }

  # ---------------------------------------------------------------- the offline classroom page
  # ADVISORY (continue-on-error), and a job of its own on purpose: `--vendor` downloads Three.js
  # from jsdelivr on a fresh runner (dist/cdn-cache/ is git-ignored and there is nothing to
  # `npm ci`), so a CDN outage must not red the deterministic, network-free `node` job above.
  # The page itself (docs/REVIEW.md C9) is Three.js inlined, no import map, no network at run time.
  # It is NOT committed — 1.1 MB of vendored library — so this is where an instructor gets it:
  # the `offline-page` artifact of the latest run.
  offline:
    name: vendored offline page (optional, needs the CDN)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: build the vendored offline page
        run: |
          node tools/build_single.mjs --vendor
          test -s dist/tissue-weather.offline.html
          ! grep -q '<script type="importmap">' dist/tissue-weather.offline.html
          # The builder's own `inMarkup` guard is what proves no CDN URL survives in markup; this
          # only re-reads the <head>, where a stylesheet or a preload would have to appear. Scoping
          # it matters: an outbound <a href="https://doi.org/…"> in the page's own copy is harmless
          # on an offline page (nothing fetches it) and used to fail the build.
          ! sed -n '/<head>/,/<\/head>/p' dist/tissue-weather.offline.html | grep -qE '(src|href)="https?:'

      - name: upload the offline page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-page
          path: dist/tissue-weather.offline.html
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------- headless scenario run + plots
  headless:
    name: headless scenarios and matplotlib panel (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matplotlib
        run: python3 -m pip install --upgrade pip matplotlib

      # 20 days is enough to prove the tissue runs and writes well-formed CSV/JSON without
      # spending CI minutes on the 90-day default.
      - name: Run the fibrous scenarios headless
        run: node tools/run_headless.mjs --tissue fibrous --days 20 --out scratch/fibrous

      - name: Show what was written
        run: ls -la scratch/fibrous && head -2 scratch/fibrous/maturation.csv

      # The reader the exports are for. --dry-run parses and measures the trajectory without
      # Blender, so the JS writer and the python reader are exercised against each other on a file
      # this job just produced (tests/export.test.mjs does the same for a short in-memory export).
      - name: The Blender importer reads the trajectory it is given
        run: |
          python3 blender/import_tissue.py --input scratch/fibrous/maturation.json --dry-run --all-frames
          python3 blender/import_tissue.py --input blender/sample_trajectory.json --dry-run

      # tools/plot_scenarios.py is allowed to fail: it plots a fixed set of column names, and the
      # v0.2 CSV header is generated from the tissue definition. When the two agree the panel is
      # uploaded below; when they do not, the run still reports the mismatch without failing CI.
      - name: Plot the scenario panel
        id: plots
        continue-on-error: true
        run: python3 tools/plot_scenarios.py --dir scratch/fibrous --out scratch/fibrous/scenarios.png

      - name: Upload the scenario plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-plots
          path: |
            scratch/fibrous/*.png
            scratch/fibrous/*.csv
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------- optional browser smoke test
  # Advisory (continue-on-error): it needs a CDN, a software GL stack and a browser download, so a
  # red run here means "look at the artifacts", not "the change is wrong". Everything it covers that
  # CAN be judged deterministically is also covered by npm test.
  screenshot:
    name: Playwright screenshot smoke (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      # Loads index.html over a local server, drives the app (deep link, play, dial, reset,
      # injure, table toggle), probes accessibility and reports console errors.
      # Needs the Three.js CDN; tools/lib/browser.mjs serves it from a curl cache (this tool points
      # it at dist/cdn-cache) when the network is closed, and a failed download is never cached.
      - name: Drive the app in headless Chromium
        run: node tools/screenshot_app.mjs --tissue fibrous --days 10 --out dist/shots

      # The SHIPPED page, not the source tree: dist/tissue-weather.html is what GitHub Pages serves
      # and what an instructor downloads, and until now nothing ever executed it in a browser
      # (docs/REVIEW.md D8). --no-interact keeps it to "does the built bundle boot and render".
      - name: Drive the built single-file page
        run: node tools/screenshot_app.mjs --page dist/tissue-weather.html --no-interact --days 5 --out dist/shots/dist-page

      # 200 % browser zoom (a 1440x900 window at deviceScaleFactor 2). It is the only
      # configuration that exercises the docked legend and the reflowed HUD, which is where the
      # legend used to cover the clock and the live sentence (docs/REVIEW.md a11y 1).
      - name: Drive the app at 200 % zoom
        run: node tools/screenshot_app.mjs --width 720 --height 450 --dsf 2 --days 5 --out dist/shots/zoom200

      # The renderer on its own, against the synthetic tissues of tools/render_smoke.html:
      # screenshots, the §4 API, and one second of frame-time measurement (enough to catch a
      # renderer that has stopped drawing or has become 10x slower).
      - name: Renderer smoke test
        run: node tools/render_smoke.mjs --out dist/shots/render --perf-seconds 1

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: dist/shots/**
          if-no-files-found: warn
          retention-days: 14
