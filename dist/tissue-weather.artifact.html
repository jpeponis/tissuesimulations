<title>Tissue Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Tissue Weather — single deliberate dark-field treatment. The 3D viewport is a
   dark-field micrograph; the panel is an instrument console beside it. Every
   colour is painted explicitly so the page holds on any host ground. */
:root {
  color-scheme: dark;
  --ground: #0b0f14;        /* viewport */
  --panel: #10161e;         /* console */
  --surface: #161e28;       /* cards, inputs */
  --surface-2: #1c2632;
  --rule: #243040;
  --text: #e6edf3;
  --muted: #8b9bb0;
  --faint: #5d6d82;
  --amber: #e0a24a;         /* mature collagen: the one accent */
  --amber-ink: #f2c47a;
  --cool: #7fc4ff;          /* new matrix */
  --cell-q: #4ea3ff;        /* quiescent cell */
  --cell-a: #ff7a3d;        /* activated cell */
  --gf: #3fd6c4;            /* growth-factor haze */
  --mmp: #e05bd0;           /* protease haze */
  --focus: #ffd27a;
  /* chart series, stepped for the dark surface (validated) */
  --s-new: #3f97dc; --s-mat: #c4822a; --s-alpha: #e0602a; --s-fa: #8f7ae0; --s-e: #8fb8d8;
  --font-ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --panel-w: 384px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--text);
  font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: var(--amber-ink); }

#app { display: grid; grid-template-columns: 1fr var(--panel-w); height: 100vh; height: 100dvh; }
#stage { position: relative; min-width: 0; min-height: 0; background: var(--ground); }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* HUD over the viewport */
.hud { position: absolute; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-top { left: 20px; top: 16px; right: 20px; display: grid; gap: 6px; max-width: 560px; }
.brand { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1; letter-spacing: -0.01em; }
.brand em { font-style: italic; color: var(--amber-ink); }
.brand small { font-family: var(--font-ui); font-size: 12px; color: var(--muted); margin-left: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
.clock { font-family: var(--font-mono); font-size: 13px; color: var(--muted); display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
.clock b { color: var(--text); font-weight: 500; }
.equilibrium { margin: 4px 0 0; font-size: 15px; max-width: 46ch; color: var(--text); text-wrap: pretty; text-shadow: 0 1px 8px rgba(0,0,0,0.7); }
.equilibrium[data-state="condensing"]::before, .equilibrium[data-state="evaporating"]::before, .equilibrium[data-state="steady"]::before {
  content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px;
}
.equilibrium[data-state="condensing"]::before { background: var(--amber); }
.equilibrium[data-state="evaporating"]::before { background: var(--cool); }
.equilibrium[data-state="steady"]::before { background: var(--muted); }

.hud-legend { left: 20px; bottom: 16px; display: grid; gap: 5px; font-size: 12px; color: var(--muted); max-width: min(48%, 520px); }
.legend-row { display: flex; align-items: center; gap: 8px; }
.swatch { width: 34px; height: 8px; border-radius: 4px; flex: none; }
.swatch.fiber { background: linear-gradient(90deg, #cfe8ff, #e0a24a); }
.swatch.cell { background: linear-gradient(90deg, var(--cell-q), var(--cell-a)); }
.swatch.gf { background: var(--gf); opacity: 0.8; }
.swatch.mmp { background: var(--mmp); opacity: 0.8; }
.swatch.load { background: repeating-linear-gradient(90deg, var(--faint) 0 6px, transparent 6px 9px); }

.hud-layers { right: 16px; bottom: 16px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { border: 1px solid var(--rule); background: rgba(16,22,30,0.85); color: var(--muted); border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--text); border-color: var(--faint); background: var(--surface-2); }
.chip:hover { color: var(--text); }

/* Console */
#panel { background: var(--panel); border-left: 1px solid var(--rule); overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 18px; padding: 16px 18px 28px; }
section h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.scenarios { display: flex; flex-wrap: wrap; gap: 6px; }
.scenario-btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 6px 10px; cursor: pointer; color: var(--muted); font-size: 13px; }
.scenario-btn[aria-pressed="true"] { color: var(--text); border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.scenario-btn:hover { color: var(--text); }
.scenario-card { background: var(--surface); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; }
.scenario-card h3 { margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 400; letter-spacing: -0.005em; text-wrap: balance; }
.scenario-card p { margin: 0; color: var(--text); }
.scenario-card .goal { color: var(--muted); }
.scenario-card ol { margin: 0; padding-left: 20px; display: grid; gap: 3px; }
.scenario-card .question { border-left: 2px solid var(--amber); padding-left: 10px; color: var(--amber-ink); }
.scenario-card details { color: var(--muted); font-size: 13px; }
.scenario-card summary { cursor: pointer; color: var(--muted); }

.dial { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "label value" "slider slider" "hint hint"; gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--rule); }
.dial:first-of-type { border-top: 0; }
.dial label { grid-area: label; font-weight: 500; display: flex; align-items: baseline; gap: 8px; }
.dial .metaphor { font-family: var(--font-display); font-style: italic; color: var(--amber-ink); font-size: 15px; font-weight: 400; }
.dial output { grid-area: value; font-family: var(--font-mono); font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; align-self: baseline; }
.dial input[type=range] { grid-area: slider; width: 100%; margin: 6px 0 2px; accent-color: var(--amber); height: 22px; cursor: pointer; }
.dial .hint { grid-area: hint; font-size: 12px; color: var(--muted); }
.dial .hint b { color: var(--text); font-weight: 500; }
.dial .metaphor-note { color: var(--faint); font-style: italic; }

.transport { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.transport button { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 8px 6px; cursor: pointer; font-weight: 500; font-size: 13px; }
.transport button:hover { background: var(--surface-2); }
.transport button.primary { background: var(--amber); color: #1a1206; border-color: var(--amber); }
.transport button.primary:hover { background: var(--amber-ink); }
.transport button.danger { color: var(--cell-a); }
.speed { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
.speed input { accent-color: var(--amber); }
.speed output { font-family: var(--font-mono); color: var(--text); font-variant-numeric: tabular-nums; }

.readout { display: grid; gap: 2px; margin-bottom: 10px; }
.readout .head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); }
.readout .head b { color: var(--text); font-weight: 500; }
.readout .head .val { font-family: var(--font-mono); color: var(--text); font-variant-numeric: tabular-nums; }
.readout canvas { width: 100%; height: 84px; display: block; background: var(--surface); border-radius: 6px; }
.readout .keys { display: flex; gap: 12px; font-size: 11px; color: var(--muted); }
.readout .keys i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.gauge canvas { width: 100%; height: 62px; display: block; background: var(--surface); border-radius: 6px; }

.about { color: var(--muted); font-size: 13px; }
.about summary { cursor: pointer; color: var(--text); font-weight: 500; }
.about p { margin: 8px 0; max-width: 60ch; }
.about dl { margin: 8px 0; display: grid; gap: 8px; }
.about dt { color: var(--text); font-style: italic; font-family: var(--font-display); font-size: 16px; }
.about dd { margin: 0; }
.about .tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.about .tools button, .about .tools a { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 12px; color: var(--text); text-decoration: none; }
.note { font-size: 12px; color: var(--faint); }

#busy { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(11,15,20,0.6); color: var(--text); font-family: var(--font-mono); font-size: 13px; }
#busy[hidden] { display: none; }

@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 58vh auto; height: auto; }
  #panel { border-left: 0; border-top: 1px solid var(--rule); }
  .hud-top { max-width: 70%; }
  .brand { font-size: 24px; }
  .equilibrium { font-size: 13px; }
  .hud-legend { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app">

      <div class="clock"><span>day <b id="day">0.0</b></span><span id="scenario-name"></span><span id="fps" class="note"></span></div>

  <aside id="panel" aria-label="Controls and readouts">

        <button id="btn-step" title="Advance one day">+1 day</button>
        <button id="btn-injure" class="danger" title="Wound the tissue at a random spot">Injure</button>
        <button id="btn-reset" title="Restart this scenario">Reset</button>
      </div>

        <span>speed</span>
        <input id="speed" type="range" min="0.25" max="20" step="0.25" value="2" aria-label="Simulated days per second">
        <output id="speed-out">2 d/s</output>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== src/copy.js =====
// src/copy.js — student-facing text for Tissue Weather.
//
// Build constraints (docs/SPEC.md §0): ES module, named exports only, no
// imports, and every top-level identifier prefixed COPY_ / copy so the
// single-file build can strip `export ` and concatenate without collisions.
//
// Voice: plain, second person, concrete. The cloud metaphor (droplets = matrix
// fibers, vapor = soluble precursors, humidity / pressure / temperature = the
// dials) is a label and a hint, not a claim. COPY_METAPHOR_BREAKS says where
// it fails. Colour words match render.js: fibers pale blue (new) to amber
// (mature); cells blue (quiescent) to orange (activated); growth factor teal;
// protease magenta.

// ---------------------------------------------------------------------------
// Dials. Keys match the model dial names used by app.js.
// biology <= 18 words, metaphor <= 10 words, watch <= 20 words.
// ---------------------------------------------------------------------------
const COPY_DIALS = Object.freeze({
  Gext: Object.freeze({
    label: 'Growth-factor bath',
    biology: 'TGF-β-like signal in the medium. It pushes fibroblasts to activate and lay down more collagen.',
    metaphor: 'Humidity: how much vapor is available to condense.',
    watch: 'Cells turn orange as they activate, then the flux bar tips toward condensing a day or two later.',
  }),
  strain: Object.freeze({
    label: 'Mechanical load',
    biology: 'Static stretch along the vertical axis. Cells feel more tension, and fibers and cells line up with it.',
    metaphor: 'Pressure: a steady push that shapes the cloud.',
    watch: 'Fibers swing toward the arrows and the alignment trace rises; stiffness jumps at once, activation follows over days.',
  }),
  protease: Object.freeze({
    label: 'Protease activity',
    biology: 'Balance of matrix-cutting enzymes (MMPs) against their inhibitors (TIMPs). Above the middle, enzymes outnumber inhibitors.',
    metaphor: 'Temperature: heat turns droplets back into vapor.',
    watch: 'Flux bar leans toward evaporating. Pale new fibers thin first; amber mature ones resist. Switch on the protease haze.',
  }),
  nCells: Object.freeze({
    label: 'Cell number',
    biology: 'Seeding density. Each cell builds and digests matrix, so more cells amplify whichever way the balance leans.',
    metaphor: 'Condensation nuclei: droplets need something to form on.',
    watch: 'Few cells: the matrix barely changes for weeks. Many cells: the cube fills in faster, and so does breakdown.',
  }),
});

// ---------------------------------------------------------------------------
// Scenario cards. goal: one sentence. steps: three imperatives.
// question: one probing question. expect <= 30 words, checkable by a student.
// ---------------------------------------------------------------------------
const COPY_SCENARIOS = Object.freeze({
  maturation: Object.freeze({
    title: 'Scaffold to tissue',
    goal: 'Watch a loose provisional scaffold turn into dense, aligned, mature tissue while the cells inside it change too.',
    steps: Object.freeze([
      'Press Play and let about four weeks pass at 5 days per second.',
      'Watch the fiber colour and the alignment trace, then check stiffness.',
      'Pause and note which changed first: density, alignment, or maturity.',
    ]),
    question: 'Stiffness and activation both rise. Which one is driving the other, and how would you test that with the dials?',
    expect: 'Density climbs, fibers swing toward the load arrows and turn amber over four to eight weeks, the stiffness trace climbs steadily, and cells shift from blue toward orange.',
  }),
  unloading: Object.freeze({
    title: 'Unloading',
    goal: 'Take a mature tissue off load and see how a matrix that took weeks to build slowly comes apart.',
    steps: Object.freeze([
      'Confirm load is zero and the growth-factor bath is low, then press Play.',
      'Watch the flux bar and the cell colour during the first few days.',
      'Run for six weeks and compare how fast the pale and amber fibers disappear.',
    ]),
    question: 'Nothing was added to the dish. Why does removing load alone flip the cells from building to dismantling?',
    expect: 'Cells fade back toward blue within days, the flux bar tips to evaporating, density and alignment fall over weeks, and amber mature fibers outlast the pale new ones.',
  }),
  fibrosis: Object.freeze({
    title: 'Fibrosis',
    goal: 'Push the growth-factor bath high and find out whether turning it back down undoes what it started.',
    steps: Object.freeze([
      'Press Play with the bath at 0.9 and run for four weeks.',
      'Drop the bath to 0.2 without pausing and keep running.',
      'Wait another four weeks and compare stiffness and activation with where they started.',
    ]),
    question: 'You returned the bath to its starting value. What is now holding the cells in their activated state, if not the growth factor?',
    expect: 'Dense, stiff, poorly aligned matrix by week four. After you lower the bath, stiffness and activation may dip but stay high: the tissue does not retrace its path.',
  }),
  wound: Object.freeze({
    title: 'Wound healing',
    goal: 'Injure a mature tissue and follow the repair from inflammatory burst to scar.',
    steps: Object.freeze([
      'Press Play, then click Injure and find the hole that appears.',
      'Switch on the growth-factor and protease layers and watch the wound for a week.',
      'Run for eight weeks and compare fiber colour and direction inside and outside the old wound.',
    ]),
    question: 'The hole refills with matrix, so why does the repaired patch still count as a scar rather than a regeneration?',
    expect: 'A teal and magenta flare fills the hole, nearby cells turn orange and wander in, pale tangled fibers appear within days, and they mature slowly without fully regaining alignment.',
  }),
  sandbox: Object.freeze({
    title: 'Sandbox',
    goal: 'Start from almost nothing and find a set of dials that grows a tissue you would be willing to implant.',
    steps: Object.freeze([
      'Choose dial settings and predict, out loud, which way the flux bar will tip.',
      'Press Play and check your prediction after one simulated week.',
      'Change one dial at a time and find a setting where the flux bar sits near zero.',
    ]),
    question: 'When the flux bar sits at zero, is the tissue idle or busy, and which readout would tell you?',
    expect: 'There is no single right answer. You should be able to find settings that condense, settings that evaporate, and at least one steady balance that still shows active turnover.',
  }),
});

// ---------------------------------------------------------------------------
// Readouts (plots.js). meaning <= 18 words.
// ---------------------------------------------------------------------------
const COPY_READOUTS = Object.freeze({
  rho: Object.freeze({
    label: 'Matrix density',
    unit: 'relative (1 ≈ dense mature tissue)',
    meaning: 'Total fiber mass per volume, split into pale new matrix and amber mature crosslinked matrix.',
  }),
  fa: Object.freeze({
    label: 'Alignment',
    unit: '0–1 (fractional anisotropy)',
    meaning: 'How strongly fibers share one direction: 0 is a random tangle, 1 is a perfectly parallel bundle.',
  }),
  E: Object.freeze({
    label: 'Stiffness',
    unit: 'kPa (log scale)',
    meaning: 'How hard the matrix resists stretching. Rises with density, maturity and load; cells sense it and respond.',
  }),
  alpha: Object.freeze({
    label: 'Cell activation',
    unit: '0–1 (mean over cells)',
    meaning: 'How far cells have shifted from quiet fibroblast toward contractile, collagen-pumping myofibroblast.',
  }),
  flux: Object.freeze({
    label: 'Matrix flux',
    unit: 'density per day',
    meaning: 'Deposition against degradation right now. The bar leans toward condensing when building wins and evaporating when breakdown wins.',
  }),
});

// ---------------------------------------------------------------------------
// Live equilibrium sentence.
// ---------------------------------------------------------------------------

/** Format a rate (density per day) compactly: 0.12/d, 0.005/d, 1.5/d, 12/d. */
function copyFormatRate(x) {
  const v = Number.isFinite(x) ? Math.abs(x) : 0;
  let s;
  if (v >= 10) s = v.toFixed(0);
  else if (v >= 1) s = v.toFixed(1);
  else if (v >= 0.01) s = v.toFixed(2);
  else if (v >= 0.0005) s = v.toFixed(3);
  else s = '0';
  return s + '/d';
}

function copyNum(v) {
  return Number.isFinite(v) ? v : 0;
}

/**
 * One live sentence (<= 28 words) describing the current balance and what the
 * cells are doing. Pure: same stats in, same string out.
 *
 * stats = { deposition, degradation, meanRho, meanFA, meanAlpha, meanLogE }
 *   deposition / degradation: total rates this step (density per day)
 *   meanRho: mean fiber density; meanFA: accepted for API symmetry, unused
 *   meanAlpha: mean cell activation 0..1
 *   meanLogE: mean log10 stiffness in kPa
 *
 * Balance: ratio deposition/degradation > 1.15 condensing, < 0.87 evaporating,
 * otherwise holding shape. Cells: alpha < 0.3 quiet, > 0.6 activated.
 */
function copyEquilibriumSentence(stats) {
  const s = stats || {};
  const dep = Math.max(0, copyNum(s.deposition));
  const deg = Math.max(0, copyNum(s.degradation));
  const alpha = copyNum(s.meanAlpha);
  const rho = copyNum(s.meanRho);
  const E = Number.isFinite(s.meanLogE) ? Math.pow(10, s.meanLogE) : NaN;

  const tiny = 1e-6;
  const still = dep < tiny && deg < tiny;
  const ratio = deg > tiny ? dep / deg : dep > tiny ? Infinity : 1;
  const trend = still ? 'still' : ratio > 1.15 ? 'condensing' : ratio < 0.87 ? 'evaporating' : 'steady';
  const cells = alpha < 0.3 ? 'quiet' : alpha > 0.6 ? 'activated' : 'partly';
  const empty = rho < 0.05;
  const stiff = Number.isFinite(E) && E >= 30;

  const verb = trend === 'condensing' ? 'outpaces' : trend === 'evaporating' ? 'trails' : 'matches';
  const head = 'Deposition ' + copyFormatRate(dep) + ' ' + verb + ' degradation ' + copyFormatRate(deg);

  let tail;
  if (trend === 'still') {
    tail = empty
      ? 'the cloud is still; there is hardly any matrix yet, so add cells, growth factor or load to start condensation.'
      : 'the cloud is still; almost nothing is being built or removed, so nothing here is changing.';
  } else if (trend === 'condensing') {
    if (cells === 'activated') {
      tail = stiff
        ? 'the cloud is condensing; activated cells keep pumping collagen into a matrix already stiff enough to hold them switched on.'
        : 'the cloud is condensing; activated cells are pumping out collagen and stiffening the matrix that keeps them switched on.';
    } else if (cells === 'quiet') {
      tail = 'the cloud is condensing; the cells are quiet, so this is slow basal deposition with little breakdown to oppose it.';
    } else {
      tail = 'the cloud is condensing; the cells are partly activated and laying down more than the proteases remove.';
    }
  } else if (trend === 'evaporating') {
    if (cells === 'activated') {
      tail = 'the cloud is evaporating; the cells are activated, but breakdown is winning, and a softening matrix pulls activation down.';
    } else if (cells === 'quiet') {
      tail = 'the cloud is evaporating; the cells are quiet, making little collagen and more protease, so the matrix thins.';
    } else {
      tail = 'the cloud is evaporating; the cells are only partly activated and cannot keep pace with breakdown.';
    }
  } else if (cells === 'activated') {
    tail = 'the cloud holds its shape; activated cells rebuild almost exactly what the proteases remove, so this is a busy balance.';
  } else if (cells === 'quiet') {
    tail = empty
      ? 'the cloud holds its shape; there is hardly any matrix yet, so add cells, growth factor or load to start condensation.'
      : 'the cloud holds its shape; the cells are quiet and turnover is slow, so the tissue is resting, not remodelling.';
  } else {
    tail = 'the cloud holds its shape; partly activated cells replace matrix about as fast as it is removed.';
  }

  return head + ' — ' + tail;
}

// ---------------------------------------------------------------------------
// Intro panel. tagline <= 14 words; each paragraph <= 60 words.
// ---------------------------------------------------------------------------
const COPY_INTRO = Object.freeze({
  title: 'Tissue Weather',
  tagline: 'A cloud of matrix and the cells that make it, in dynamic equilibrium.',
  paragraphs: Object.freeze([

 * ---------------------------------------------------------------------------

 * written they cannot produce the scenario behaviour the spec describes (see

 * with tools/run_headless.mjs + tests/model.test.mjs.  All other numbers are
 * the spec's.  Reviewer items from docs/MODEL.md §4 are marked [MODEL.md #n].
 *
 *  SECRETION  s = (sBasal + sAct·α²)·(sTens + (1−sTens)·H)·(1 − rho/rhoCrowd)²
 *    sAct 0.05 → 2.5, sBasal 0.004 → 0.005.  Deposition goes into the ONE voxel
 *      the cell occupies, so the mean rate is (n/N³)·s ≈ 0.093·s at 160 cells;
 *      with the spec's s ≤ 0.054 the tissue gains ≤ 0.005 rho/d and cannot
 *      reach rho 0.6 in 60 d [MODEL.md #9].  α² (not α): collagen synthesis is
 *      strongly activation dependent; this keeps quiescent cells from slowly
 *      filling a low-growth-factor tissue.
 *    sTens 0.5 (new): relaxed cells synthesize less [MODEL.md #10; 0.5 rather
 *      than the suggested 0.3 so a soft scaffold can still be colonised].
 *    rhoCrowd 1.6, depCrowd 2 (new): crowding/feedback inhibition of synthesis.
 *      This is what lets a loaded tissue SETTLE at rho ≈ 1 instead of running
 *      to the trace clamp: with tension-suppressed MMP, degradation at the
 *      high state is lower than at the start, so a synthesis-side brake is
 *      required for a steady state.
 *  ACTIVATION  α* = tanh( gsat·(aG + aE·H) − aSoft·Esoft/(E+Esoft) ),
 *              gsat = g²/(g² + gHalf²),  H = τ²/(1+τ²),  τ = (E/Eref)(strain + κα)
 *    Growth factor GATES activation and tension potentiates it (multiplicative,
 *      Hinz) instead of the spec's additive sum: with the additive form the
 *      load term alone drives any loaded tissue to the high state, so Gext has
 *      no low state and no hysteresis is possible.
 *    tanh instead of clamp: the spec's aE + aG ≥ 1 pins α at 1.0 in every
 *      loaded scenario; tanh lets α rise and settle at ≈ 0.85–0.9.
 *    Hill-2 on g (gHill 2, gHalf 0.3 → 0.5) [MODEL.md #8] and Hill-2 on tension
 *      (nHill 2; the spec's τ/(1+τ) is Hill-1) [MODEL.md #4].  The load
 *      dependence of τ is KEPT (a pure stiffness gate would keep cells

 *    kappa (undefined in the spec) → 0.12: cell contractility must be a minor

 *      sits exactly at the initial stiffness and flickers).
 *    tauAlpha 1 d → tauAlphaUp 2 d / tauAlphaDown 4 d [MODEL.md #5].
 *  MMP SOURCE per cell  mBasal·P^3 + mAct·(1−H)/(1 + (α/mAlphaHalf)²)
 *    mBasal 20, protExp 3 (new): convex dial → active-MMP map (TIMP folded into

/** mulberry32 PRNG: returns a function producing uniform floats in [0,1). */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function tmRand() {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function tmClamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }

/** Round a typed array into a plain array with `digits` decimals (for JSON). */
function tmRoundArray(arr, digits) {
  const f = 10 ** digits, out = new Array(arr.length);
  for (let i = 0; i < arr.length; i++) out[i] = Math.round(arr[i] * f) / f;
  return out;
}

const tmDialKeys = ['Gext', 'strain', 'protease', 'nCells'];

class TissueModel {
  /**
   * @param {object} params  overrides of DEFAULT_PARAMS
   * @param {number} seed    PRNG seed (uint32)
   * @param {function} rngFactory  seed -> () => uniform in [0,1)  (default mulberry32)
   */
  constructor(params = {}, seed = 20240907, rngFactory = mulberry32) {
    this.params = Object.assign({}, DEFAULT_PARAMS, params);
    this.seed = seed >>> 0;
    this._rngFactory = rngFactory;
    this.rng = rngFactory(this.seed);

    const P = this.params;
    const N = P.N, NV = N * N * N;
    this.N = N; this.NV = NV; this.h = P.L / N;

    // ECM structure tensor (6 components) + derived per-voxel fields
    this.Txx = new Float32Array(NV); this.Tyy = new Float32Array(NV); this.Tzz = new Float32Array(NV);
    this.Txy = new Float32Array(NV); this.Txz = new Float32Array(NV); this.Tyz = new Float32Array(NV);
    this.rho = new Float32Array(NV); this.rhoMat = new Float32Array(NV);
    this.fa = new Float32Array(NV);
    this.fx = new Float32Array(NV); this.fy = new Float32Array(NV); this.fz = new Float32Array(NV);
    this.g = new Float32Array(NV); this.m = new Float32Array(NV); this.E = new Float32Array(NV);
    // scratch
    this._g2 = new Float32Array(NV); this._m2 = new Float32Array(NV);
    this._srcG = new Float32Array(NV); this._srcM = new Float32Array(NV);
    this._aSum = new Float32Array(NV); this._deg = new Float32Array(NV);
    this.inflam = new Float32Array(NV); // inflammatory source strength (1 in a fresh wound, decays)

    // cells (fixed capacity, `nCells` live)
    this.cap = Math.max(P.nCellsMax, P.nCells);
    this._cx = new Float32Array(3 * this.cap);
    this._cp = new Float32Array(3 * this.cap);
    this._alpha = new Float32Array(this.cap);
    this._vox = new Int32Array(this.cap);
    this._dx = new Float32Array(3 * this.cap); // repulsion displacements
    this._binStart = new Int32Array(NV + 1); this._binCursor = new Int32Array(NV); this._binCell = new Int32Array(this.cap);
    this._views = { n: -1, cx: null, cp: null, alpha: null };

    this.nCells = 0;
    this.time = 0;
    this.stepCount = 0;
    this.scenario = null;
    this.dials = { Gext: 0.5, strain: 0.5, protease: 0.5, nCells: P.nCells };
    this.wound = null;
    this._lastDep = 0; this._lastDeg = 0; this._meanH = 0; this._meanGcell = 0;
    this._maturedCache = null;
    this._maturedMs = null;

    this.reset('maturation');
  }

  // ------------------------------------------------------------------ setup

  /** Reset to a scenario preset (key of SCENARIOS). Optional overrides:
   *  { dials: {...}, init: {rho0, phiMat0, matured}, seed } */
  reset(scenarioKey = 'maturation', overrides = {}) {
    const sc = SCENARIOS[scenarioKey];
    if (!sc) throw new Error(`unknown scenario '${scenarioKey}'`);
    if (overrides.seed !== undefined) this.seed = overrides.seed >>> 0;
    this.rng = this._rngFactory(this.seed);
    this.scenario = scenarioKey;
    this.time = 0; this.stepCount = 0; this.wound = null;
    this._lastDep = 0; this._lastDeg = 0;

    const dials = Object.assign({}, sc.dials, overrides.dials || {});
    const init = Object.assign({}, sc.init, overrides.init || {});

    if (init.matured) {
      this._loadMatured();
    } else {
      this._initUniform(init.rho0 ?? 0.15, init.phiMat0 ?? 0);
      this.nCells = 0;
      this._addCells(dials.nCells);
    }
    // apply dials (cell count adjusts by add/remove)
    this.dials.Gext = dials.Gext; this.dials.strain = dials.strain; this.dials.protease = dials.protease;
    this._setCellCount(dials.nCells);
    if (!init.matured) this.g.fill(dials.Gext);
    this._derived();
    return this;
  }

  _initUniform(rho0, phiMat0) {
    const NV = this.NV, rng = this.rng;
    for (let v = 0; v < NV; v++) {
      const r = rho0 * (1 + 0.2 * (rng() - 0.5));
      this.Txx[v] = r / 3; this.Tyy[v] = r / 3; this.Tzz[v] = r / 3;
      this.Txy[v] = 0; this.Txz[v] = 0; this.Tyz[v] = 0;
      this.rhoMat[v] = phiMat0 * r;
      // random initial principal axis (warm start for power iteration)
      let x = rng() - 0.5, y = rng() - 0.5, z = rng() - 0.5;
      const n = Math.hypot(x, y, z) || 1;
      this.fx[v] = x / n; this.fy[v] = y / n; this.fz[v] = z / n;
    }
    this.g.fill(0); this.m.fill(0);
    this._deg.fill(0); this.inflam.fill(0);
  }

  _addCells(count) {
    const rng = this.rng, L = this.params.L;
    for (let c = 0; c < count && this.nCells < this.cap; c++) {
      const i = this.nCells, i3 = 3 * i;
      this._cx[i3] = rng() * L; this._cx[i3 + 1] = rng() * L; this._cx[i3 + 2] = rng() * L;
      let px = rng() - 0.5, py = rng() - 0.5, pz = rng() - 0.5;
      const n = Math.hypot(px, py, pz) || 1;
      this._cp[i3] = px / n; this._cp[i3 + 1] = py / n; this._cp[i3 + 2] = pz / n;
      this._alpha[i] = 0.05;
      this.nCells++;
    }
  }

  _removeCells(count) {
    const rng = this.rng;
    for (let c = 0; c < count && this.nCells > 0; c++) {
      const i = Math.floor(rng() * this.nCells), last = this.nCells - 1;
      if (i !== last) {
        for (let d = 0; d < 3; d++) {
          this._cx[3 * i + d] = this._cx[3 * last + d];
          this._cp[3 * i + d] = this._cp[3 * last + d];
        }
        this._alpha[i] = this._alpha[last];
      }
      this.nCells--;
    }
  }

  _setCellCount(n) {
    n = Math.max(0, Math.min(this.cap, Math.round(n)));
    if (n > this.nCells) this._addCells(n - this.nCells);
    else if (n < this.nCells) this._removeCells(this.nCells - n);
    this.dials.nCells = this.nCells;
  }

  /** Change dials while running. Partial object with any of Gext, strain, protease, nCells. */
  setDials(partial) {
    for (const k of tmDialKeys) {
      if (partial[k] === undefined) continue;
      if (k === 'nCells') this._setCellCount(partial[k]);
      else this.dials[k] = +partial[k];
    }
    return this.dials;
  }

  // -------------------------------------------------------- matured state

  /**
   * Snapshot of the tissue after running the maturation scenario for
   * params.matureDays with the same params/seed. Computed once and cached.
   * Returns { Txx..Tyz, rhoMat, fx, fy, fz, g, m, cx, cp, alpha, nCells, time }.
   */
  maturedState() {
    if (this._maturedCache) return this._maturedCache;
    const P = this.params;
    const pre = new TissueModel(Object.assign({}, P, { dt: P.matureDt }), (this.seed + 1) >>> 0, this._rngFactory);
    pre.reset('maturation');
    const steps = Math.round(P.matureDays / P.matureDt);
    pre.step(steps);
    const copy = (a) => Float32Array.from(a);
    this._maturedCache = {
      Txx: copy(pre.Txx), Tyy: copy(pre.Tyy), Tzz: copy(pre.Tzz),
      Txy: copy(pre.Txy), Txz: copy(pre.Txz), Tyz: copy(pre.Tyz),
      rhoMat: copy(pre.rhoMat), fx: copy(pre.fx), fy: copy(pre.fy), fz: copy(pre.fz),
      g: copy(pre.g), m: copy(pre.m), deg: copy(pre._deg),
      cx: pre._cx.slice(0, 3 * pre.nCells), cp: pre._cp.slice(0, 3 * pre.nCells),
      alpha: pre._alpha.slice(0, pre.nCells), nCells: pre.nCells, time: pre.time,
    };
    return this._maturedCache;
  }

  _loadMatured() {
    const S = this.maturedState();
    this.Txx.set(S.Txx); this.Tyy.set(S.Tyy); this.Tzz.set(S.Tzz);
    this.Txy.set(S.Txy); this.Txz.set(S.Txz); this.Tyz.set(S.Tyz);
    this.rhoMat.set(S.rhoMat); this.fx.set(S.fx); this.fy.set(S.fy); this.fz.set(S.fz);
    this.g.set(S.g); this.m.set(S.m); this._deg.set(S.deg);
    this._cx.set(S.cx); this._cp.set(S.cp); this._alpha.set(S.alpha);
    this.nCells = S.nCells; this.inflam.fill(0);
  }

  // -------------------------------------------------------------- injury

  /** Spherical wound (§1.6): zero T and rhoMat, g += woundG, m += woundM inside. */
  injure(center = null, radius = this.params.woundRadius) {
    const P = this.params, N = this.N, h = this.h, L = P.L;
    let cx, cy, cz;
    if (center) { [cx, cy, cz] = center; }
    else {
      // random spot, kept away from the walls so most of the sphere is inside
      const margin = Math.min(radius, L / 2);
      cx = margin + this.rng() * (L - 2 * margin);
      cy = margin + this.rng() * (L - 2 * margin);
      cz = margin + this.rng() * (L - 2 * margin);
    }
    const r2 = radius * radius;
    let count = 0;
    for (let i = 0; i < N; i++) {
      const x = (i + 0.5) * h - cx;
      for (let j = 0; j < N; j++) {
        const y = (j + 0.5) * h - cy;
        for (let k = 0; k < N; k++) {
          const z = (k + 0.5) * h - cz;
          if (x * x + y * y + z * z > r2) continue;
          const v = (i * N + j) * N + k;
          this.Txx[v] = 0; this.Tyy[v] = 0; this.Tzz[v] = 0;
          this.Txy[v] = 0; this.Txz[v] = 0; this.Tyz[v] = 0;
          this.rhoMat[v] = 0;
          this.g[v] += P.woundG; this.m[v] += P.woundM; this.inflam[v] = 1;
          count++;
        }
      }
    }
    this.wound = { center: [cx, cy, cz], radius, time: this.time, nVox: count };
    this._derived();
    return this.wound;
  }

  // ---------------------------------------------------------------- step

  step(nSteps = 1) {
    for (let s = 0; s < nSteps; s++) this._step();
    return this;
  }

  _gauss() { // ~N(0,1): sum of three uniforms, variance 3/12 -> scaled
    const r = this.rng;
    return (r() + r() + r() - 1.5) * 2;
  }

  _step() {
    const P = this.params, dt = P.dt, N = this.N, NV = this.NV, L = P.L;
    const invh = 1 / this.h, Nm1 = N - 1;
    const strain = this.dials.strain, protease = this.dials.protease, Gext = this.dials.Gext;
    const Txx = this.Txx, Tyy = this.Tyy, Tzz = this.Tzz, Txy = this.Txy, Txz = this.Txz, Tyz = this.Tyz;
    const rho = this.rho, rhoMat = this.rhoMat, fa = this.fa, fx = this.fx, fy = this.fy, fz = this.fz;
    const g = this.g, E = this.E;
    const srcG = this._srcG, srcM = this._srcM, aSum = this._aSum, deg = this._deg;
    const cx = this._cx, cp = this._cp, alpha = this._alpha, vox = this._vox, dxs = this._dx;
    const n = this.nCells;

    srcG.fill(0); srcM.fill(0); aSum.fill(0);

    // ---------------------------------------------------------- cells (§1.4)
    const invEref = 1 / P.Eref, aUp = Math.min(1, dt / P.tauAlphaUp), aDown = Math.min(1, dt / P.tauAlphaDown);
    const gHalfN = Math.pow(P.gHalf, P.gHill), gHill2 = P.gHill === 2;
    const invRhoStar = 1 / P.rhoStar, vFloor = P.vFloor, sTens = P.sTens;
    const strainA = P.loadExp === 2 ? strain * strain : Math.pow(strain, P.loadExp);
    const sigN = P.sigmaP * Math.sqrt(dt), kLoadP = P.kLoadAlign * strainA * dt;
    const invMA2 = 1 / (P.mAlphaHalf * P.mAlphaHalf), rhoCrowdInv = 1 / P.rhoCrowd;
    const mBasalP = P.mBasal * (P.protExp === 2 ? protease * protease : Math.pow(protease, P.protExp));
    const hill2 = P.nHill === 2, crowd2 = P.depCrowd === 2, doCrowd = P.depCrowd > 0;
    const kappa = P.kappa, aE = P.aE, aG = P.aG, aSoft = P.aSoft, Esoft = P.Esoft;
    const sBasal = P.sBasal, sAct = P.sAct, polBase = P.polBase, polAct = P.polAct, kAlignP = P.kAlign * dt;
    const kGcell = P.kGcell, mAct = P.mAct, kGuideP = P.kGuide * dt, v0 = P.v0;
    let depTotal = 0, sumH = 0, sumGc = 0;

    for (let i = 0; i < n; i++) {
      const i3 = 3 * i;
      const x = cx[i3], y = cx[i3 + 1], z = cx[i3 + 2];
      let ix = (x * invh) | 0, iy = (y * invh) | 0, iz = (z * invh) | 0;
      if (ix > Nm1) ix = Nm1; if (iy > Nm1) iy = Nm1; if (iz > Nm1) iz = Nm1;
      const v = (ix * N + iy) * N + iz;

      const Ev = E[v], rv = rho[v], gv = g[v];
      let a = alpha[i];

      // --- tension (stiffness × load) and activation
      const tau = Ev * invEref * (strain + kappa * a);
      const tauN = hill2 ? tau * tau : Math.pow(tau, P.nHill);
      const H = tauN / (1 + tauN);
      const gN = gHill2 ? gv * gv : Math.pow(gv, P.gHill);
      const gsat = gN / (gN + gHalfN);
      sumH += H; sumGc += gv;
      const soft = aSoft * Esoft / (Ev + Esoft);
      // TGF-β gates activation, tension potentiates it (Hinz): alphaStar = tanh(gsat·(aG + aE·H) − soft)
      let aStar = gsat * (aG + aE * H) - soft;
      aStar = aStar <= 0 ? 0 : Math.tanh(aStar); // soft saturation: settles, never pins at 1
      a += (aStar - a) * (aStar > a ? aUp : aDown);
      alpha[i] = a;

      // --- secretion into the voxel (oriented); synthesis is activation- and tension-dependent, crowding-limited
      let px = cp[i3], py = cp[i3 + 1], pz = cp[i3 + 2];
      let s = (sBasal + sAct * a * a) * (sTens + (1 - sTens) * H);
      if (doCrowd) {
        const q = 1 - rv * rhoCrowdInv;
        s *= q <= 0 ? 0 : (crowd2 ? q * q : Math.pow(q, P.depCrowd));
      }
      depTotal += s;
      const pol = polBase + polAct * a;
      const iso = (1 - pol) / 3 * s * dt, ani = pol * s * dt;
      let txx = Txx[v] + iso + ani * px * px, tyy = Tyy[v] + iso + ani * py * py, tzz = Tzz[v] + iso + ani * pz * pz;
      let txy = Txy[v] + ani * px * py, txz = Txz[v] + ani * px * pz, tyz = Tyz[v] + ani * py * pz;

      // --- traction realignment toward rho p pᵀ (trace-preserving)
      const kA = kAlignP * a;
      if (kA > 0) {
        const tr = txx + tyy + tzz;
        txx += kA * (tr * px * px - txx); tyy += kA * (tr * py * py - tyy); tzz += kA * (tr * pz * pz - tzz);
        txy += kA * (tr * px * py - txy); txz += kA * (tr * px * pz - txz); tyz += kA * (tr * py * pz - tyz);
      }
      Txx[v] = txx; Tyy[v] = tyy; Tzz[v] = tzz; Txy[v] = txy; Txz[v] = txz; Tyz[v] = tyz;

      // --- sources for the diffusible fields (§1.3)
      srcG[v] += kGcell * a * H; // autocrine / latent TGF-β activation by contractile cells on stiff matrix
      srcM[v] += mBasalP + mAct * (1 - H) / (1 + a * a * invMA2);
      aSum[v] += a;

      // --- polarity: contact guidance toward ±f, load alignment toward ±z, persistence noise
      const fxv = fx[v], fyv = fy[v], fzv = fz[v];
      const sg = (px * fxv + py * fyv + pz * fzv) >= 0 ? 1 : -1;
      const kG = kGuideP * fa[v];
      px += kG * (sg * fxv - px); py += kG * (sg * fyv - py); pz += kG * (sg * fzv - pz);
      const sz = pz >= 0 ? 1 : -1, kL = kLoadP * H; // cells align with the load only when they feel the tension
      px -= kL * px; py -= kL * py; pz += kL * (sz - pz);
      px += sigN * this._gauss(); py += sigN * this._gauss(); pz += sigN * this._gauss();
      let pn = Math.sqrt(px * px + py * py + pz * pz);
      if (pn < 1e-9) { px = 0; py = 0; pz = 1; pn = 1; }
      px /= pn; py /= pn; pz /= pn;
      cp[i3] = px; cp[i3 + 1] = py; cp[i3 + 2] = pz;

      // --- migration (§1.4): slower when activated or embedded; slow in near-empty matrix (nothing to grip)
      let grip = rv * invRhoStar; if (grip > 1) grip = 1;
      const speed = v0 * (1 - 0.6 * a) * (1 - 0.5 * rv / (rv + 0.5)) * (vFloor + (1 - vFloor) * grip);
      cx[i3] = x + speed * px * dt; cx[i3 + 1] = y + speed * py * dt; cx[i3 + 2] = z + speed * pz * dt;
    }

    // --- soft repulsion between cells closer than 2 rCell, via voxel binning
    //     (2 rCell = 0.06 L < h, so partners are in the same or an adjacent voxel: 27 bins per cell)
    if (n > 1) {
      const d0 = 2 * P.rCell, d02 = d0 * d0, kRep = P.kRep;
      const binStart = this._binStart, binCell = this._binCell, cursor = this._binCursor;
      binStart.fill(0);
      for (let i = 0; i < n; i++) {
        const i3 = 3 * i;
        let ix = (cx[i3] * invh) | 0, iy = (cx[i3 + 1] * invh) | 0, iz = (cx[i3 + 2] * invh) | 0;
        if (ix > Nm1) ix = Nm1; else if (ix < 0) ix = 0;
        if (iy > Nm1) iy = Nm1; else if (iy < 0) iy = 0;
        if (iz > Nm1) iz = Nm1; else if (iz < 0) iz = 0;
        const v = (ix * N + iy) * N + iz;
        vox[i] = v; binStart[v + 1]++;
      }
      for (let v = 0; v < NV; v++) binStart[v + 1] += binStart[v];
      cursor.set(binStart.subarray(0, NV));
      for (let i = 0; i < n; i++) binCell[cursor[vox[i]]++] = i;
      dxs.fill(0, 0, 3 * n);
      const N2 = N * N;
      for (let i = 0; i < n; i++) {
        const v = vox[i], ix = (v / N2) | 0, iy = ((v / N) | 0) % N, iz = v % N;
        const i3 = 3 * i, xi = cx[i3], yi = cx[i3 + 1], zi = cx[i3 + 2];
        const x0 = ix > 0 ? ix - 1 : 0, x1 = ix < Nm1 ? ix + 1 : Nm1;
        const y0 = iy > 0 ? iy - 1 : 0, y1 = iy < Nm1 ? iy + 1 : Nm1;
        const z0 = iz > 0 ? iz - 1 : 0, z1 = iz < Nm1 ? iz + 1 : Nm1;
        for (let jx = x0; jx <= x1; jx++) {
          for (let jy = y0; jy <= y1; jy++) {
            const wBase = (jx * N + jy) * N;
            for (let jz = z0; jz <= z1; jz++) {
              const w = wBase + jz;
              for (let q = binStart[w], qEnd = binStart[w + 1]; q < qEnd; q++) {
                const j = binCell[q];
                if (j <= i) continue;
                const j3 = 3 * j;
                const ddx = cx[j3] - xi, ddy = cx[j3 + 1] - yi, ddz = cx[j3 + 2] - zi;
                const d2 = ddx * ddx + ddy * ddy + ddz * ddz;
                if (d2 >= d02 || d2 === 0) continue;
                const d = Math.sqrt(d2);
                const f = kRep * (d0 - d) / d * 0.5;
                dxs[i3] -= f * ddx; dxs[i3 + 1] -= f * ddy; dxs[i3 + 2] -= f * ddz;
                dxs[j3] += f * ddx; dxs[j3 + 1] += f * ddy; dxs[j3 + 2] += f * ddz;
              }
            }
          }
        }
      }
      for (let i = 0; i < 3 * n; i++) cx[i] += dxs[i];
    }
    // --- walls: reflect position and polarity
    const Lmax = L - 1e-6;
    for (let i = 0; i < n; i++) {
      const i3 = 3 * i;
      for (let d = 0; d < 3; d++) {
        let q = cx[i3 + d];
        if (q < 0) { q = -q; cp[i3 + d] = -cp[i3 + d]; }
        if (q > Lmax) { q = 2 * Lmax - q; cp[i3 + d] = -cp[i3 + d]; }
        if (q < 0) q = 0; else if (q > Lmax) q = Lmax;
        cx[i3 + d] = q;
      }
    }

    // ------------------------------------------------------- ECM per voxel (§1.5) + derived fields (§1.2)
    const m = this.m;
    const kLF = P.kLoadFib * strainA * dt, kDeg = P.kDeg, rMat = P.rMat, mMin = P.mMin, kProtS = P.kProt * strain;
    const kMat0 = P.kMat0, kLox = P.kLox, kMatBase = P.kMatBase, eps = P.eps, eps2 = eps * eps, rhoMax = P.rhoMax;
    const strainFac = 1 + P.kStrain * strain, E0 = P.E0, Escale = P.Escale, kMatE = P.kMat;
    const doF = (this.stepCount % P.fEvery) === 0; // principal axis refresh (warm-started power iteration)
    let degTotal = 0;
    for (let v = 0; v < NV; v++) {
      let txx = Txx[v], tyy = Tyy[v], tzz = Tzz[v], txy = Txy[v], txz = Txz[v], tyz = Tyz[v];
      let tr = txx + tyy + tzz;
      let rm = rhoMat[v];
      if (rm > tr) rm = tr; if (rm < 0) rm = 0;
      let dv = 0;
      if (tr > eps) {
        const rhoNew = tr - rm;
        const mEff = mMin + m[v];
        // degradation: new matrix is vulnerable, mature is protected (rMat), strained aligned fibres are shielded
        dv = kDeg * mEff * (rhoNew + rMat * rm) * (1 - kProtS * tzz / tr);
        let fac = 1 - (dv / tr) * dt;
        if (fac < 0) fac = 0;
        txx *= fac; tyy *= fac; tzz *= fac; txy *= fac; txz *= fac; tyz *= fac;
        // maturation of new matrix (LOX from activated cells in the voxel), proteolysis of mature matrix
        const mat = kMat0 * rhoNew * (kMatBase + kLox * aSum[v]);
        rm += (mat - kDeg * mEff * rMat * rm) * dt;
        tr *= fac;
        // passive load alignment toward z (trace-preserving)
        if (kLF > 0) {
          txx -= kLF * txx; tyy -= kLF * tyy; tzz += kLF * (tr - tzz);
          txy -= kLF * txy; txz -= kLF * txz; tyz -= kLF * tyz;
        }
        // trace clamp
        if (tr > rhoMax) {
          const sc = rhoMax / tr;
          txx *= sc; tyy *= sc; tzz *= sc; txy *= sc; txz *= sc; tyz *= sc; tr = rhoMax;
        }
        // PSD guard (cheap): non-negative diagonal, |Tij| ≤ sqrt(Tii Tjj)
        if (txx < 0) txx = 0; if (tyy < 0) tyy = 0; if (tzz < 0) tzz = 0;
        if (txy * txy > txx * tyy) txy = (txy < 0 ? -0.999 : 0.999) * Math.sqrt(txx * tyy);
        if (txz * txz > txx * tzz) txz = (txz < 0 ? -0.999 : 0.999) * Math.sqrt(txx * tzz);
        if (tyz * tyz > tyy * tzz) tyz = (tyz < 0 ? -0.999 : 0.999) * Math.sqrt(tyy * tzz);
        if (rm > tr) rm = tr; if (rm < 0) rm = 0;
      } else {
        txx = 0; tyy = 0; tzz = 0; txy = 0; txz = 0; tyz = 0; tr = 0; rm = 0;
      }
      Txx[v] = txx; Tyy[v] = tyy; Tzz[v] = tzz; Txy[v] = txy; Txz[v] = txz; Tyz[v] = tyz;
      rhoMat[v] = rm; deg[v] = dv; degTotal += dv;

      // --- derived: rho, FA, principal axis, stiffness
      rho[v] = tr;
      const fro2 = txx * txx + tyy * tyy + tzz * tzz + 2 * (txy * txy + txz * txz + tyz * tyz);
      let f = 0;
      if (fro2 > eps2) {
        f = 1.5 * (fro2 - tr * tr / 3) / fro2;      // FA² = 3/2·‖T − (tr/3)I‖² / ‖T‖²
        f = f <= 0 ? 0 : (f >= 1 ? 1 : Math.sqrt(f));
        if (doF) {
          let ax = fx[v], ay = fy[v], az = fz[v];
          for (let it = 0; it < 2; it++) {
            const bx = txx * ax + txy * ay + txz * az;
            const by = txy * ax + tyy * ay + tyz * az;
            const bz = txz * ax + tyz * ay + tzz * az;
            const bn = Math.sqrt(bx * bx + by * by + bz * bz);
            if (bn < 1e-12) break;
            ax = bx / bn; ay = by / bn; az = bz / bn;
          }
          fx[v] = ax; fy[v] = ay; fz[v] = az;
        }
      }
      fa[v] = f;
      const phi = tr > eps ? rm / tr : 0;
      E[v] = E0 + Escale * tr * tr * (1 + kMatE * phi) * strainFac;
    }

    // ------------------------------------------- diffusible fields (§1.3)
    this._diffuse(Gext, dt);

    this._lastDep = depTotal; this._lastDeg = degTotal;
    this._meanH = n > 0 ? sumH / n : 0; this._meanGcell = n > 0 ? sumGc / n : 0;
    this.time += dt; this.stepCount++;
  }

  /** Explicit 6-neighbour diffusion with zero-flux walls, sources, bath exchange, decay. */
  _diffuse(Gext, dt) {
    const P = this.params, N = this.N, h2 = this.h * this.h;
    const lamG = Math.min(P.Dg * dt / h2, 1 / 6), lamM = Math.min(P.Dm * dt / h2, 1 / 6);
    const g = this.g, m = this.m, g2 = this._g2, m2 = this._m2, srcG = this._srcG, srcM = this._srcM, deg = this._deg;
    const kBath = P.kBath, kGdec = P.kGdec, kGrel = P.kGrel, kMdec = P.kMdec;
    const inflam = this.inflam, wG = P.woundGrate, wM = P.woundMrate, inflDecay = Math.exp(-dt / P.tauInfl);
    const N2 = N * N, Nm1 = N - 1;
    for (let i = 0; i < N; i++) {
      const im = i > 0, ip = i < Nm1;
      for (let j = 0; j < N; j++) {
        const jm = j > 0, jp = j < Nm1;
        const base = (i * N + j) * N;
        for (let k = 0; k < N; k++) {
          const v = base + k;
          const gv = g[v], mv = m[v];
          let sg = 0, sm = 0, cnt = 0;
          if (im) { sg += g[v - N2]; sm += m[v - N2]; cnt++; }
          if (ip) { sg += g[v + N2]; sm += m[v + N2]; cnt++; }
          if (jm) { sg += g[v - N]; sm += m[v - N]; cnt++; }
          if (jp) { sg += g[v + N]; sm += m[v + N]; cnt++; }
          if (k > 0) { sg += g[v - 1]; sm += m[v - 1]; cnt++; }
          if (k < Nm1) { sg += g[v + 1]; sm += m[v + 1]; cnt++; }
          const inf = inflam[v];
          const ng = gv + lamG * (sg - cnt * gv) + dt * (kBath * (Gext - gv) + srcG[v] + kGrel * deg[v] - kGdec * gv + wG * inf);
          const nm = mv + lamM * (sm - cnt * mv) + dt * (srcM[v] - kMdec * mv + wM * inf);
          g2[v] = ng > 0 ? ng : 0; m2[v] = nm > 0 ? nm : 0;
          if (inf > 0) inflam[v] = inf > 1e-4 ? inf * inflDecay : 0;
        }
      }
    }
    this.g = g2; this._g2 = g; this.m = m2; this._m2 = m;
  }

  /** Full recomputation of rho, FA, principal axis (2 warm-started power iterations) and stiffness.
   *  Used after reset/injure; during stepping the same quantities are updated inside _step. */
  _derived() {
    const P = this.params, NV = this.NV;
    const Txx = this.Txx, Tyy = this.Tyy, Tzz = this.Tzz, Txy = this.Txy, Txz = this.Txz, Tyz = this.Tyz;
    const rho = this.rho, rhoMat = this.rhoMat, fa = this.fa, fx = this.fx, fy = this.fy, fz = this.fz, E = this.E;
    const strainFac = 1 + P.kStrain * this.dials.strain, eps = P.eps;
    for (let v = 0; v < NV; v++) {
      const txx = Txx[v], tyy = Tyy[v], tzz = Tzz[v], txy = Txy[v], txz = Txz[v], tyz = Tyz[v];
      const tr = txx + tyy + tzz;
      rho[v] = tr;
      const fro2 = txx * txx + tyy * tyy + tzz * tzz + 2 * (txy * txy + txz * txz + tyz * tyz);
      let f = 0;
      if (fro2 > eps * eps) {
        f = 1.5 * (fro2 - tr * tr / 3) / fro2;
        f = f <= 0 ? 0 : (f >= 1 ? 1 : Math.sqrt(f));
        let ax = fx[v], ay = fy[v], az = fz[v];
        for (let it = 0; it < 2; it++) {
          const bx = txx * ax + txy * ay + txz * az;
          const by = txy * ax + tyy * ay + tyz * az;
          const bz = txz * ax + tyz * ay + tzz * az;
          const bn = Math.sqrt(bx * bx + by * by + bz * bz);
          if (bn < 1e-12) break;
          ax = bx / bn; ay = by / bn; az = bz / bn;
        }
        fx[v] = ax; fy[v] = ay; fz[v] = az;
      }
      fa[v] = f;
      const phi = tr > eps ? rhoMat[v] / tr : 0;
      E[v] = P.E0 + P.Escale * tr * tr * (1 + P.kMat * phi) * strainFac;
    }
  }

  // ------------------------------------------------------------- readouts

  get state() {
    const n = this.nCells, vw = this._views;
    if (vw.n !== n) {
      vw.n = n;
      vw.cx = this._cx.subarray(0, 3 * n); vw.cp = this._cp.subarray(0, 3 * n); vw.alpha = this._alpha.subarray(0, n);
    }
    return {
      N: this.N, L: this.params.L, h: this.h, time: this.time, dt: this.params.dt,
      scenario: this.scenario, dials: this.dials, nCells: n, wound: this.wound,
      Txx: this.Txx, Tyy: this.Tyy, Tzz: this.Tzz, Txy: this.Txy, Txz: this.Txz, Tyz: this.Tyz,
      rho: this.rho, rhoMat: this.rhoMat, fa: this.fa, fx: this.fx, fy: this.fy, fz: this.fz,
      g: this.g, m: this.m, E: this.E, inflam: this.inflam,
      cx: vw.cx, cp: vw.cp, alpha: vw.alpha,
    };
  }

  /** Scalar readouts (§1.8). deposition/degradation are total rates (density/day
   *  summed over voxels) for the last step — the "condensing ⟷ evaporating" gauge. */
  stats() {
    const NV = this.NV, n = this.nCells;
    const rho = this.rho, rhoMat = this.rhoMat, fa = this.fa, E = this.E, g = this.g, m = this.m, alpha = this._alpha;
    let sR = 0, sM = 0, sF = 0, sLE = 0, sE = 0, sG = 0, sMm = 0;
    let mxx = 0, myy = 0, mzz = 0, mxy = 0, mxz = 0, myz = 0;
    for (let v = 0; v < NV; v++) {
      sR += rho[v]; sM += rhoMat[v]; sF += fa[v]; sE += E[v]; sLE += Math.log10(E[v]); sG += g[v]; sMm += m[v];
      mxx += this.Txx[v]; myy += this.Tyy[v]; mzz += this.Tzz[v]; mxy += this.Txy[v]; mxz += this.Txz[v]; myz += this.Tyz[v];
    }
    let sA = 0;
    for (let i = 0; i < n; i++) sA += alpha[i];
    const meanRho = sR / NV, meanRhoMat = sM / NV;
    // FA of the mean tensor = coherence of alignment across the whole tissue
    const tr = mxx + myy + mzz, fro2 = mxx * mxx + myy * myy + mzz * mzz + 2 * (mxy * mxy + mxz * mxz + myz * myz);
    let gFA = 0;
    if (fro2 > 1e-12) { gFA = 1.5 * (fro2 - tr * tr / 3) / fro2; gFA = gFA <= 0 ? 0 : Math.sqrt(Math.min(1, gFA)); }
    return {
      t: this.time,
      meanRho, meanRhoNew: meanRho - meanRhoMat, meanRhoMat,
      phiMat: meanRho > 1e-9 ? meanRhoMat / meanRho : 0,
      meanFA: sF / NV, globalFA: gFA, meanFz: tr > 1e-9 ? mzz / tr : 1 / 3,
      meanLogE: sLE / NV, meanE: sE / NV,
      meanAlpha: n > 0 ? sA / n : 0,
      meanG: sG / NV, meanM: sMm / NV,
      deposition: this._lastDep, degradation: this._lastDeg,
      meanH: this._meanH, meanGcell: this._meanGcell,
      nCells: n,
    };
  }

  /** Mean rho / phiMat / FA inside the last wound sphere (null if no wound). */
  woundStats(wound = this.wound) {
    if (!wound) return null;
    const N = this.N, h = this.h, [cx, cy, cz] = wound.center, r2 = wound.radius * wound.radius;
    let sR = 0, sM = 0, sF = 0, sG = 0, sMm = 0, cnt = 0;
    for (let i = 0; i < N; i++) {
      const x = (i + 0.5) * h - cx;
      for (let j = 0; j < N; j++) {
        const y = (j + 0.5) * h - cy;
        for (let k = 0; k < N; k++) {
          const z = (k + 0.5) * h - cz;
          if (x * x + y * y + z * z > r2) continue;
          const v = (i * N + j) * N + k;
          sR += this.rho[v]; sM += this.rhoMat[v]; sF += this.fa[v]; sG += this.g[v]; sMm += this.m[v]; cnt++;
        }
      }
    }
    // cells inside the wound
    let nc = 0, sA = 0;
    for (let i = 0; i < this.nCells; i++) {
      const x = this._cx[3 * i] - cx, y = this._cx[3 * i + 1] - cy, z = this._cx[3 * i + 2] - cz;
      if (x * x + y * y + z * z <= r2) { nc++; sA += this._alpha[i]; }
    }
    if (cnt === 0) return { meanRho: 0, phiMat: 0, meanFA: 0, meanG: 0, meanM: 0, nVox: 0, nCells: nc, meanAlpha: nc ? sA / nc : 0 };
    return { meanRho: sR / cnt, phiMat: sR > 1e-9 ? sM / sR : 0, meanFA: sF / cnt, meanG: sG / cnt, meanM: sMm / cnt, nVox: cnt,
      nCells: nc, meanAlpha: nc ? sA / nc : 0 };
  }

  /** One frame in the §1.10 export format (plain arrays, rounded). */
  snapshot() {
    const NV = this.NV, n = this.nCells;
    const phi = new Float32Array(NV);
    for (let v = 0; v < NV; v++) phi[v] = this.rho[v] > 1e-9 ? this.rhoMat[v] / this.rho[v] : 0;
    const f = new Float32Array(3 * NV);
    for (let v = 0; v < NV; v++) { f[3 * v] = this.fx[v]; f[3 * v + 1] = this.fy[v]; f[3 * v + 2] = this.fz[v]; }
    return {
      t: Math.round(this.time * 1000) / 1000,
      rho: tmRoundArray(this.rho, 3),
      fa: tmRoundArray(this.fa, 3),
      f: tmRoundArray(f, 3),
      phiMat: tmRoundArray(phi, 3),
      cells: {
        x: tmRoundArray(this._cx.subarray(0, 3 * n), 4),
        p: tmRoundArray(this._cp.subarray(0, 3 * n), 3),
        alpha: tmRoundArray(this._alpha.subarray(0, n), 3),
      },
    };
  }

  /** `meta` block of the §1.10 export. */
  exportMeta() {
    const P = this.params;
    return {
      N: this.N, L: P.L, K: P.K, dtDays: P.dt, scenario: this.scenario,
      dials: Object.assign({}, this.dials), seed: this.seed, version: TM_VERSION,
    };
  }
}


// ===== src/plots.js =====
// plots.js — 2D canvas readouts for Tissue Weather: rolling time-series strips
// and the deposition/degradation "flux gauge". No dependencies, no DOM lookups
// beyond the canvas handed in. Colours are passed in by the app so the same
// tokens drive the 3D scene, the legend and the charts.

const PLOT_FONT = '11px "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace';

function plotSetupCanvas(canvas) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(10, Math.round(rect.width));
  const h = Math.max(10, Math.round(rect.height));
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

/**
 * Rolling time-series strip.
 * spec = {
 *   series: [{ key, label, color, stack: bool }],   // stacked series drawn as areas from the baseline
 *   yDomain: [0, 1] | 'auto',
 *   yFormat: fn(v) -> string,
 *   windowDays: 90,
 *   theme: { text, muted, grid, surface }
 * }
 */
class TimeSeriesPlot {
  constructor(canvas, spec) {
    this.canvas = canvas;
    this.spec = Object.assign({ yDomain: [0, 1], windowDays: 90, yFormat: (v) => v.toFixed(2) }, spec);
    this.t = [];
    this.data = {};
    for (const s of this.spec.series) this.data[s.key] = [];
    this.hoverX = null;
    canvas.addEventListener('pointermove', (e) => {
      const r = canvas.getBoundingClientRect();
      this.hoverX = e.clientX - r.left;
      this.draw();
    });
    canvas.addEventListener('pointerleave', () => { this.hoverX = null; this.draw(); });
  }

  clear() {
    this.t.length = 0;
    for (const k in this.data) this.data[k].length = 0;
  }

  push(t, values) {
    const n = this.t.length;
    if (n && t - this.t[n - 1] < 0.1) return; // ~0.1 d resolution is plenty for a 90 d strip
    this.t.push(t);
    for (const s of this.spec.series) this.data[s.key].push(values[s.key]);
    const minT = t - this.spec.windowDays;
    let drop = 0;
    while (drop < this.t.length && this.t[drop] < minT) drop++;
    if (drop > 0) {
      this.t.splice(0, drop);
      for (const k in this.data) this.data[k].splice(0, drop);
    }
  }

  draw() {
    const { ctx, w, h } = plotSetupCanvas(this.canvas);
    const th = this.spec.theme;
    const padL = 6, padR = 44, padT = 8, padB = 16;
    const pw = w - padL - padR, ph = h - padT - padB;
    ctx.clearRect(0, 0, w, h);
    ctx.font = PLOT_FONT;
    ctx.textBaseline = 'middle';

    const n = this.t.length;
    const t0 = n ? Math.max(this.t[0], this.t[n - 1] - this.spec.windowDays) : 0;
    const t1 = n ? Math.max(this.t[n - 1], t0 + 5) : 5;

    // y domain
    let y0 = 0, y1 = 1;
    if (this.spec.yDomain === 'auto') {
      y0 = Infinity; y1 = -Infinity;
      for (const s of this.spec.series) for (const v of this.data[s.key]) { if (v < y0) y0 = v; if (v > y1) y1 = v; }
      if (!isFinite(y0)) { y0 = 0; y1 = 1; }
      if (y1 - y0 < 1e-6) { y0 -= 0.5; y1 += 0.5; }
      const pad = (y1 - y0) * 0.1; y0 -= pad; y1 += pad;
    } else { [y0, y1] = this.spec.yDomain; }
    // stacked series may exceed the domain top: widen if needed
    if (this.spec.yDomain !== 'auto') {
      let maxStack = 0;
      for (let i = 0; i < n; i++) {
        let acc = 0;
        for (const s of this.spec.series) if (s.stack) acc += this.data[s.key][i];
        if (acc > maxStack) maxStack = acc;
      }
      if (maxStack > y1) y1 = Math.ceil(maxStack * 4) / 4;
    }

    const X = (t) => padL + ((t - t0) / (t1 - t0)) * pw;
    const Y = (v) => padT + ph - ((v - y0) / (y1 - y0)) * ph;

    // recessive grid: 3 horizontal lines, labels at right
    ctx.strokeStyle = th.grid; ctx.lineWidth = 1;
    ctx.fillStyle = th.muted; ctx.textAlign = 'left';
    const ticks = [y0, (y0 + y1) / 2, y1];
    for (const v of ticks) {
      const y = Math.round(Y(v)) + 0.5;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + pw, y); ctx.stroke();
      ctx.fillText(this.spec.yFormat(v), padL + pw + 6, Math.min(Math.max(y, padT + 5), padT + ph - 5));
    }
    // time axis: start and end day
    ctx.textAlign = 'left'; ctx.fillText(`d ${t0.toFixed(0)}`, padL, h - 6);
    ctx.textAlign = 'right'; ctx.fillText(`d ${t1.toFixed(0)}`, padL + pw, h - 6);

    if (n < 2) return;

    // stacked areas first (from baseline), with a 1px surface gap between bands
    let base = new Float64Array(n);
    for (const s of this.spec.series) {
      if (!s.stack) continue;
      const vals = this.data[s.key];
      ctx.beginPath();
      for (let i = 0; i < n; i++) ctx.lineTo(X(this.t[i]), Y(base[i] + vals[i]));
      for (let i = n - 1; i >= 0; i--) ctx.lineTo(X(this.t[i]), Y(base[i]) + (base[i] > 0 ? -1 : 0));
      ctx.closePath();
      ctx.fillStyle = s.color; ctx.globalAlpha = 0.55; ctx.fill(); ctx.globalAlpha = 1;
      ctx.beginPath();
      for (let i = 0; i < n; i++) ctx.lineTo(X(this.t[i]), Y(base[i] + vals[i]));
      ctx.strokeStyle = s.color; ctx.lineWidth = 1.5; ctx.stroke();
      for (let i = 0; i < n; i++) base[i] += vals[i];
    }
    // lines
    for (const s of this.spec.series) {
      if (s.stack) continue;
      const vals = this.data[s.key];
      ctx.beginPath();
      for (let i = 0; i < n; i++) ctx.lineTo(X(this.t[i]), Y(vals[i]));
      ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
    }
    // emphasised endpoints + direct labels (identity never by colour alone)
    ctx.textAlign = 'left';
    let acc = 0;
    const labelYs = [];
    for (const s of this.spec.series) {
      const v = this.data[s.key][n - 1];
      const yv = s.stack ? (acc + v) : v;
      if (s.stack) acc += v;
      const x = X(this.t[n - 1]), y = Y(yv);
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = th.surface; ctx.lineWidth = 1.5; ctx.stroke();
      labelYs.push({ y, label: s.label, v: this.spec.yFormat(v) });
    }
    // hover crosshair + tooltip
    if (this.hoverX != null && this.hoverX >= padL && this.hoverX <= padL + pw) {
      const th_ = (this.hoverX - padL) / pw * (t1 - t0) + t0;
      let i = 0; while (i < n - 1 && this.t[i + 1] < th_) i++;
      const x = X(this.t[i]);
      ctx.strokeStyle = th.muted; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(x + 0.5, padT); ctx.lineTo(x + 0.5, padT + ph); ctx.stroke(); ctx.setLineDash([]);
      const lines = [`day ${this.t[i].toFixed(1)}`].concat(this.spec.series.map((s) => `${s.label} ${this.spec.yFormat(this.data[s.key][i])}`));
      const tw = Math.max(...lines.map((l) => ctx.measureText(l).width)) + 12;
      const tx = x + 8 + tw > padL + pw ? x - 8 - tw : x + 8;
      const ty = padT + 2;
      ctx.fillStyle = th.surface; ctx.globalAlpha = 0.92;
      ctx.fillRect(tx, ty, tw, 14 * lines.length + 6); ctx.globalAlpha = 1;
      ctx.strokeStyle = th.grid; ctx.strokeRect(tx + 0.5, ty + 0.5, tw, 14 * lines.length + 6);
      ctx.textAlign = 'left';
      lines.forEach((l, k) => {
        ctx.fillStyle = k === 0 ? th.muted : th.text;
        ctx.fillText(l, tx + 6, ty + 10 + 14 * k);
      });
    }
  }
}

/**
 * Two-sided flux gauge: degradation (evaporating, cool) to the left of centre,
 * deposition (condensing, warm) to the right. The bar shows log2(dep/deg),
 * clamped to ±3, so "balanced" is the centre mark.
 */
class FluxGauge {
  constructor(canvas, theme) {
    this.canvas = canvas; this.theme = theme; this.dep = 0; this.deg = 0;
  }
  update(dep, deg) { this.dep = dep; this.deg = deg; this.draw(); }
  draw() {
    const { ctx, w, h } = plotSetupCanvas(this.canvas);
    const th = this.theme;
    ctx.clearRect(0, 0, w, h);
    ctx.font = PLOT_FONT; ctx.textBaseline = 'middle';
    const cx = w / 2, barY = 18, barH = 10, half = w / 2 - 12;
    // track
    ctx.fillStyle = th.grid; ctx.fillRect(cx - half, barY, half * 2, barH);
    // value
    const ratio = (this.dep + 1e-9) / (this.deg + 1e-9);
    const lg = Math.max(-3, Math.min(3, Math.log2(ratio)));
    const len = Math.abs(lg) / 3 * half;
    ctx.fillStyle = lg >= 0 ? th.warm : th.cool;
    if (lg >= 0) ctx.fillRect(cx, barY, len, barH); else ctx.fillRect(cx - len, barY, len, barH);
    // centre tick
    ctx.fillStyle = th.text; ctx.fillRect(cx - 1, barY - 4, 2, barH + 8);
    // captions
    ctx.fillStyle = th.muted; ctx.textAlign = 'left'; ctx.fillText('evaporating', cx - half, barY + barH + 12);
    ctx.textAlign = 'right'; ctx.fillText('condensing', cx + half, barY + barH + 12);
    ctx.textAlign = 'center'; ctx.fillStyle = th.text;
    const r = ratio > 99 ? '>99' : ratio.toFixed(2);
    ctx.fillText(`deposition / degradation = ${r}`, cx, h - 8);
  }
}


// ===== src/render.js =====
// Tissue Weather — 3D renderer (SPEC 1.9). ES module, named exports only.
// Consumes the model state (SPEC 1.1–1.2) and draws fibers, cells, optional
// g/m point clouds, load arrows and the domain cube with three.js r160.
//
// Public API:
//   new TissueRenderer(canvasEl, opts)  opts: { K, rCell, maxCells, maxPixelRatio, seed,
//                                       autoRotate, autoRotateSpeed, background, fov,
//                                       toneMapping: 'aces'|'agx'|'none', exposure, fogDepth,
//                                       ...look tuning, see the defaults in the constructor }
//   .resize()                    fit canvas to its parent (also automatic via ResizeObserver)
//   .update(state, layers)       copy state → instances; layers {fibers, cells, g, m}
//   .render()                    one frame (controls damping/autorotate + draw)
//   .setAutoRotate(bool)
//   .screenshot()                → PNG data URL of the current frame
//   .dispose()
//   .stats                       read-only { updateMs, fibersVisible, cells }

const RENDER_POINT_VERT = `
attribute float aVal;
uniform float uScale;
uniform float uSize;
uniform float uMinVal;
varying float vA;
void main() {
  vec4 mv = modelViewMatrix * vec4( position, 1.0 );
  float v = clamp( aVal, 0.0, 1.0 );
  vA = v;
  float size = ( v < uMinVal ) ? 0.0 : uSize * ( 0.35 + 0.65 * v );
  gl_PointSize = clamp( size * uScale / max( -mv.z, 0.05 ), 0.0, 160.0 );
  gl_Position = projectionMatrix * mv;
}`;

const RENDER_POINT_FRAG = `
uniform vec3 uColor;
uniform float uOpacity;
varying float vA;
void main() {
  vec2 q = gl_PointCoord - 0.5;
  float soft = exp( -dot( q, q ) * 8.0 ) * smoothstep( 0.5, 0.42, length( q ) );
  float a = soft * uOpacity * ( 0.2 + 0.8 * vA );
  if ( a < 0.004 ) discard;
  gl_FragColor = vec4( uColor, a );
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

class TissueRenderer {
  constructor(canvasEl, opts = {}) {
    this.canvas = canvasEl;
    this.opts = Object.assign({
      K: 3,                 // fiber instances per voxel
      rCell: 0.03,          // cell radius (L units), SPEC 1.4
      maxCells: 512,        // initial instance capacity (grows on demand)
      maxPixelRatio: 2,
      seed: 90210,
      autoRotate: true,
      autoRotateSpeed: 0.5, // OrbitControls units: 2.0 = 30 s per orbit
      background: 0x0b0f14,
      fov: 36,
      toneMapping: 'aces',
      exposure: 1.0,
      minRho: 0.03,         // hide fibers below this density
      fogDepth: 2.8,        // fog fully in at (camera distance + fogDepth); smaller = stronger depth cue
      // Look tuning. Defaults were chosen from headless screenshot comparisons
      // (tools/render_smoke.mjs); SPEC 1.9 numbers are the reference the scales multiply.
      fiberRadiusScale: 0.6,  // × SPEC radius 0.12 h sqrt(rho)  (1.0 looked like matchsticks)
      fiberLengthScale: 1.35, // × SPEC length h (0.5 + 0.9 FA)  (longer threads weave across voxels)
      fiberMinRadius: 0.025,  // × h, floor so sparse fibers stay visible hairlines
      fiberShape: 'cylinder', // 'cylinder' | 'capsule'
      fiberRoughness: 0.5, fiberEmissive: 0.2, fiberRim: 0.5,
      fiberAlbedo: 1.0, fiberSaturation: 1.25,   // albedo compensation: lit+tone-mapped colour desaturates
      cellRoughness: 0.55, cellEmissive: 0.35, cellRim: 0.45,
      cellAlbedo: 0.55, cellSaturation: 1.15,
      cellColorMid: null,     // e.g. '#f2f2f2' for a diverging blue→pale→orange ramp (default: straight lerp)
      keyIntensity: 1.6, fillIntensity: 0.3, hemiIntensity: 0.55,
      keyColor: 0xfff1dc, fillColor: 0x8fb0ff, hemiSky: 0xc9d6ea, hemiGround: 0x3a2a1c,
      pointBlending: 'normal', // 'normal' | 'additive'  (additive turns teal+magenta into white)
      pointOpacity: 0.45, pointSize: 1.8, // g/m point clouds (size × h); 0.45 reads as a haze, additive blooms white
      wireColor: 0x4a5a70,
    }, opts);
    this.stats = { updateMs: 0, fibersVisible: 0, cells: 0 };
    this._disposed = false;

    // --- renderer -----------------------------------------------------------
    const renderer = new THREE.WebGLRenderer({
      canvas: canvasEl, antialias: true, alpha: false, stencil: false,
      powerPreference: 'high-performance',
    });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const tm = this.opts.toneMapping;
    renderer.toneMapping = tm === 'none' ? THREE.NoToneMapping
      : tm === 'agx' ? THREE.AgXToneMapping : THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = this.opts.exposure;
    this.renderer = renderer;

    // --- scene, camera (z is the load axis, so z is "up") -------------------
    const scene = new THREE.Scene();
    const bg = new THREE.Color(this.opts.background);
    scene.background = bg;
    scene.fog = new THREE.Fog(bg.getHex(), 2.4, 5.2);
    this.scene = scene;
    this.center = new THREE.Vector3(0.5, 0.5, 0.5);

    const camera = new THREE.PerspectiveCamera(this.opts.fov, 1, 0.05, 40);
    camera.up.set(0, 0, 1);
    this._tmpV = new THREE.Vector3();
    this._tmpV.set(0.64, -0.70, 0.32).normalize().multiplyScalar(2.75).add(this.center);
    camera.position.copy(this._tmpV);
    camera.lookAt(this.center);
    this.camera = camera;

    const controls = new OrbitControls(camera, canvasEl);
    controls.target.copy(this.center);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 1.0;
    controls.maxDistance = 9;
    controls.autoRotate = !!this.opts.autoRotate;
    controls.autoRotateSpeed = this.opts.autoRotateSpeed;
    controls.update();
    this.controls = controls;
    this._onPointerDown = () => { this.controls.autoRotate = false; };
    canvasEl.addEventListener('pointerdown', this._onPointerDown, { passive: true });

    // --- lights ---------------------------------------------------------------
    const hemi = new THREE.HemisphereLight(this.opts.hemiSky, this.opts.hemiGround, this.opts.hemiIntensity);
    hemi.position.set(0, 0, 1);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(this.opts.keyColor, this.opts.keyIntensity);
    key.position.set(0.5 - 1.6, 0.5 - 2.2, 0.5 + 2.6);
    key.target.position.copy(this.center);
    scene.add(key, key.target);
    const fill = new THREE.DirectionalLight(this.opts.fillColor, this.opts.fillIntensity);
    fill.position.set(0.5 + 2.4, 0.5 + 1.8, 0.5 - 1.1);
    fill.target.position.copy(this.center);
    scene.add(fill, fill.target);
    this._lights = [hemi, key, fill];

    // --- colours (linear working space) ---------------------------------------
    const c = new THREE.Color();
    const lin = (hex, sat) => { c.set(hex); return TissueRenderer._saturate([c.r, c.g, c.b], sat); };
    this._cNew = lin('#cfe8ff', this.opts.fiberSaturation);
    this._cMat = lin('#e0a24a', this.opts.fiberSaturation);
    this._cQui = lin('#4ea3ff', this.opts.cellSaturation);
    this._cAct = lin('#ff7a3d', this.opts.cellSaturation);
    this._cMid = this.opts.cellColorMid ? lin(this.opts.cellColorMid, 1) : null;

    // --- materials ------------------------------------------------------------
    this._uRimFiber = { value: this.opts.fiberRim };
    this._uRimPowFiber = { value: 2.5 };
    this._uRimCell = { value: this.opts.cellRim };
    this._uRimPowCell = { value: 3.0 };
    this.fiberMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setScalar(this.opts.fiberAlbedo), roughness: this.opts.fiberRoughness, metalness: 0.04,
      emissive: 0xffffff, emissiveIntensity: this.opts.fiberEmissive,
    });
    TissueRenderer._patchInstanceGlow(this.fiberMat, this._uRimFiber, this._uRimPowFiber);
    this.cellMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setScalar(this.opts.cellAlbedo), roughness: this.opts.cellRoughness, metalness: 0.0,
      emissive: 0xffffff, emissiveIntensity: this.opts.cellEmissive,
    });
    TissueRenderer._patchInstanceGlow(this.cellMat, this._uRimCell, this._uRimPowCell);

    // --- static scenery: wire cube, load arrows ------------------------------
    const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1));
    const wireMat = new THREE.LineBasicMaterial({ color: this.opts.wireColor, transparent: true, opacity: 0.85 });
    const wire = new THREE.LineSegments(edges, wireMat);
    wire.position.copy(this.center);
    scene.add(wire);
    this._wire = { geo: edges, mat: wireMat, obj: wire };
    this._buildLoad();

    // --- dynamic content -----------------------------------------------------
    this.fibers = null;
    this.fields = null;
    this.cells = null;
    this._buildCells(this.opts.maxCells);

    // --- sizing ---------------------------------------------------------------
    this._ro = null;
    const parent = canvasEl.parentElement;
    if (typeof ResizeObserver !== 'undefined' && parent) {
      this._ro = new ResizeObserver(() => this.resize());
      this._ro.observe(parent);
    } else if (typeof window !== 'undefined') {
      this._onWinResize = () => this.resize();
      window.addEventListener('resize', this._onWinResize);
    }
    this.resize();
  }

  // Seeded PRNG (mulberry32) so per-instance jitter is reproducible.
  static _rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Scale saturation of a linear-RGB triple around its luminance (1 = unchanged).
  static _saturate(rgb, sat) {
    if (!(sat > 0) || sat === 1) return rgb;
    const l = 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
    return rgb.map((x) => Math.max(0, l + (x - l) * sat));
  }

  // Tint the constant emissive by the per-instance colour and add a rim term,
  // so fibers/cells never go black on their shadow side and read as a "cloud".
  static _patchInstanceGlow(material, uRim, uRimPow) {
    material.onBeforeCompile = (shader) => {
      shader.uniforms.uRim = uRim;
      shader.uniforms.uRimPow = uRimPow;
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>\nuniform float uRim;\nuniform float uRimPow;')
        .replace('#include <emissivemap_fragment>',
          '#include <emissivemap_fragment>\n' +
          '#ifdef USE_COLOR\n' +
          '  totalEmissiveRadiance *= vColor;\n' +
          '  float rrRim = pow( 1.0 - saturate( abs( dot( normalize( vViewPosition ), normal ) ) ), uRimPow );\n' +
          '  totalEmissiveRadiance += vColor * uRim * rrRim;\n' +
          '#endif');
    };
    material.customProgramCacheKey = () => 'tissue-instance-glow';
  }

  // Zero the 3x3 part of `count` instance matrices starting at instance `from`.
  static _hideRange(arr, from, count) {
    for (let i = 0; i < count; i++) {
      const o = (from + i) * 16;
      arr[o] = arr[o + 1] = arr[o + 2] = 0;
      arr[o + 4] = arr[o + 5] = arr[o + 6] = 0;
      arr[o + 8] = arr[o + 9] = arr[o + 10] = 0;
      arr[o + 15] = 1;
    }
  }

  _buildLoad() {
    const group = new THREE.Group();
    const arrowMat = new THREE.MeshStandardMaterial({
      color: 0xd9c9a3, emissive: 0xd9c9a3, emissiveIntensity: 0.25, roughness: 0.5,
      transparent: true, opacity: 0.6, depthWrite: false,
    });
    const plateMat = new THREE.MeshBasicMaterial({
      color: 0xd9c9a3, transparent: true, opacity: 0.08, depthWrite: false, side: THREE.DoubleSide,
    });
    const shaftGeo = new THREE.CylinderGeometry(0.045, 0.045, 0.68, 12, 1, false);
    shaftGeo.translate(0, 0.34, 0);
    const coneGeo = new THREE.ConeGeometry(0.115, 0.32, 16);
    coneGeo.translate(0, 0.84, 0);
    const plateGeo = new THREE.PlaneGeometry(1, 1);
    const makeArrow = (dirSign) => {
      const a = new THREE.Group();
      a.add(new THREE.Mesh(shaftGeo, arrowMat), new THREE.Mesh(coneGeo, arrowMat));
      a.rotation.x = dirSign * Math.PI / 2;   // +Y → ±Z
      a.position.set(0.5, 0.5, dirSign > 0 ? 1.015 : -0.015);
      return a;
    };
    const top = makeArrow(+1), bottom = makeArrow(-1);
    const plateTop = new THREE.Mesh(plateGeo, plateMat);
    plateTop.position.set(0.5, 0.5, 1.0);
    const plateBot = new THREE.Mesh(plateGeo, plateMat);
    plateBot.position.set(0.5, 0.5, 0.0);
    group.add(top, bottom, plateTop, plateBot);
    group.visible = false;
    this.scene.add(group);
    this.load = { group, top, bottom, arrowMat, plateMat, geos: [shaftGeo, coneGeo, plateGeo] };
  }

  _disposeFibers() {
    if (!this.fibers) return;
    this.scene.remove(this.fibers.mesh);
    this.fibers.geo.dispose();
    this.fibers.mesh.dispose();
    this.fibers = null;
    if (this.fields) {
      for (const L of [this.fields.g, this.fields.m]) {
        this.scene.remove(L.points);
        L.geo.dispose();
        L.mat.dispose();
      }
      this.fields = null;
    }
  }

  // Fixed per-instance jitter: offset inside the voxel, random unit vector r_j,
  // and mild length/radius variation. Rebuilt only when N changes.
  _buildFibers(N) {
    this._disposeFibers();
    const K = this.opts.K, V = N * N * N, count = V * K, h = 1 / N;
    const rand = TissueRenderer._rng(this.opts.seed);
    const base = new Float32Array(count * 3);
    const rvec = new Float32Array(count * 3);
    const jit = new Float32Array(count * 2);
    const centers = new Float32Array(V * 3);
    for (let v = 0; v < V; v++) {
      const i = (v / (N * N)) | 0, j = ((v / N) | 0) % N, k = v % N;
      const cx = (i + 0.5) * h, cy = (j + 0.5) * h, cz = (k + 0.5) * h;
      centers[3 * v] = cx; centers[3 * v + 1] = cy; centers[3 * v + 2] = cz;
      for (let q = 0; q < K; q++) {
        const o = v * K + q;
        base[3 * o] = cx + (rand() - 0.5) * 0.9 * h;
        base[3 * o + 1] = cy + (rand() - 0.5) * 0.9 * h;
        base[3 * o + 2] = cz + (rand() - 0.5) * 0.9 * h;
        const z = rand() * 2 - 1, ph = rand() * Math.PI * 2, s = Math.sqrt(Math.max(0, 1 - z * z));
        rvec[3 * o] = s * Math.cos(ph); rvec[3 * o + 1] = s * Math.sin(ph); rvec[3 * o + 2] = z;
        jit[2 * o] = 0.78 + 0.5 * rand();      // length factor
        jit[2 * o + 1] = 0.85 + 0.3 * rand();  // radius factor
      }
    }
    // Local +Y is the fiber axis. Capsule: rounded (spindle-like after anisotropic scale) ends.
    const capsule = this.opts.fiberShape === 'capsule';
    const geo = capsule ? new THREE.CapsuleGeometry(1, 2, 2, 6) : new THREE.CylinderGeometry(1, 1, 1, 6, 1, false);
    const geoHeight = capsule ? 4 : 1;
    const mesh = new THREE.InstancedMesh(geo, this.fiberMat, count);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
