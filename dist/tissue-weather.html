<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tissue Weather</title>
<meta name="description" content="A 3D interactive for teaching dynamic reciprocity: cells and extracellular matrix remodelling each other under growth factor, load and protease dials.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Tissue Weather — single deliberate dark-field treatment. The 3D viewport is a
   dark-field micrograph; the panel is an instrument console beside it. Every
   colour is painted explicitly so the page holds on any host ground.
   Contrast (WCAG 2.2 AA, checked against --panel / --surface):
     --text  15.4 / 14.2   --muted 6.4 / 5.9   --faint 5.4 / 5.0 (informational text)
     --deco  3.4 / 3.2     decoration only (stripes, rules), never text. */
:root {
  color-scheme: dark;
  --ground: #0b0f14;        /* viewport */
  --panel: #10161e;         /* console */
  --surface: #161e28;       /* cards, inputs */
  --surface-2: #1c2632;
  --rule: #243040;
  --text: #e6edf3;
  --muted: #8b9bb0;
  --faint: #7d8ea6;         /* quiet but readable: ≥ 4.5:1 on every surface */
  --deco: #5d6d82;          /* decoration only */
  --amber: #e0a24a;         /* mature collagen: the one accent */
  --amber-ink: #f2c47a;
  --cool: #7fc4ff;          /* new matrix */
  --cell-q: #4ea3ff;        /* quiescent cell */
  --cell-a: #ff7a3d;        /* activated cell */
  --gf: #3fd6c4;            /* growth-factor haze */
  --mmp: #e05bd0;           /* protease haze */
  --focus: #ffd27a;
  --font-ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --panel-w: 392px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--text);
  font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: var(--amber-ink); }
kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface-2); color: var(--text); }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

#app { display: grid; grid-template-columns: 1fr var(--panel-w); height: 100vh; height: 100dvh; }
#stage { position: relative; min-width: 0; min-height: 0; background: var(--ground); }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#view:focus-visible { outline-offset: -3px; }

/* HUD over the viewport */
.hud { position: absolute; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-top { left: 20px; top: 16px; right: 20px; display: grid; gap: 6px; max-width: 560px; }
.brand { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1; letter-spacing: -0.01em; }
.brand em { font-style: italic; color: var(--amber-ink); }
.brand small { font-family: var(--font-ui); font-size: 12px; color: var(--muted); margin-left: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
.clock { font-family: var(--font-mono); font-size: 13px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.clock b { color: var(--text); font-weight: 500; }
.equilibrium { margin: 4px 0 0; font-size: 15px; max-width: 46ch; color: var(--text); text-wrap: pretty; text-shadow: 0 1px 8px rgba(0,0,0,0.7); min-height: 1.4em; }
.equilibrium[data-state]::before {
  content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; background: var(--muted);
}
.equilibrium[data-state="condensing"]::before { background: var(--amber); }
.equilibrium[data-state="evaporating"]::before { background: var(--cool); }
.equilibrium[data-state="flash"]::before { background: var(--focus); }

/* legend: a collapsible so it stays reachable on small screens */
.hud-legend { left: 20px; bottom: 16px; font-size: 12px; color: var(--muted); max-width: min(48%, 420px); pointer-events: auto; }
.hud-legend summary { cursor: pointer; display: inline-block; min-height: 24px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--rule); background: rgba(16,22,30,0.85); color: var(--text); font-size: 12px; }
.hud-legend summary::-webkit-details-marker { display: none; }
.hud-legend summary::before { content: "▸ "; color: var(--muted); }
.hud-legend[open] summary::before { content: "▾ "; }
#legend { margin-top: 8px; display: grid; gap: 6px; background: rgba(16,22,30,0.72); border-radius: 8px; padding: 8px 10px; }
.legend-swatches { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.legend-row { display: flex; align-items: center; gap: 8px; }
.swatch { width: 34px; height: 8px; border-radius: 4px; flex: none; }
.legend-guide summary { display: inline-block; min-height: 24px; line-height: 24px; border: 0; background: none; padding: 0; color: var(--muted); }
.legend-guide summary::before { content: "▸ "; }
.legend-guide[open] summary::before { content: "▾ "; }
.legend-guide ul { margin: 6px 0 0; padding-left: 16px; display: grid; gap: 4px; max-width: 46ch; }

.hud-layers { right: 16px; bottom: 16px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 48%; }
.chip { border: 1px solid var(--rule); background: rgba(16,22,30,0.85); color: var(--muted); border-radius: 999px; padding: 4px 11px; min-height: 28px; font-size: 12px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--text); border-color: var(--muted); background: var(--surface-2); }
.chip:hover { color: var(--text); }

/* notices: CDN / WebGL failures */
#notice { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92%, 520px); background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--amber); border-radius: 10px; padding: 16px 18px; color: var(--text); box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
#notice h2 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
#notice p { margin: 6px 0; color: var(--muted); font-size: 13px; }
#notice code { font-family: var(--font-mono); font-size: 12px; color: var(--text); }
#notice[hidden] { display: none; }

/* Console */
#panel { background: var(--panel); border-left: 1px solid var(--rule); overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 18px; padding: 16px 18px 28px; }
section h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.segmented { display: flex; margin: 0; padding: 0; min-width: 0; min-inline-size: 0; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--surface); }
.segmented .seg { flex: 1; position: relative; min-width: 0; }
.segmented .seg + .seg { border-left: 1px solid var(--rule); }
.segmented input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.segmented span { display: block; text-align: center; padding: 7px 8px; min-height: 34px; color: var(--muted); font-size: 13px; line-height: 1.3; }
.segmented input:checked + span { background: var(--surface-2); color: var(--text); box-shadow: inset 0 -2px 0 var(--amber); }
.segmented input:hover + span { color: var(--text); }
.segmented input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: -3px; border-radius: 6px; }
.tissue-short { margin: 6px 0 0; font-size: 12px; color: var(--faint); }

.hint-card { display: flex; gap: 10px; align-items: center; background: var(--surface); border-left: 3px solid var(--amber); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.hint-card p { margin: 0; flex: 1; }
.hint-card b { color: var(--amber-ink); font-weight: 500; }
.hint-card button { border: 1px solid var(--rule); background: var(--surface-2); border-radius: 6px; padding: 5px 10px; min-height: 28px; cursor: pointer; font-size: 12px; color: var(--text); }

.scenarios { display: flex; flex-wrap: wrap; gap: 6px; }
.scenario-btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 6px 10px; min-height: 32px; cursor: pointer; color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
.scenario-btn kbd { font-size: 10px; padding: 0 4px; color: var(--muted); border-bottom-width: 1px; }
.scenario-btn[aria-pressed="true"] { color: var(--text); border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.scenario-btn[aria-pressed="true"] kbd { color: var(--text); }
.scenario-btn:hover { color: var(--text); }
.scenario-card { background: var(--surface); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; }
.scenario-card h3 { margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 400; letter-spacing: -0.005em; text-wrap: balance; }
.scenario-card p { margin: 0; color: var(--text); }
.scenario-card .goal { color: var(--muted); }
.scenario-card ol { margin: 0; padding-left: 20px; display: grid; gap: 3px; }
.scenario-card .question { border-left: 2px solid var(--amber); padding-left: 10px; color: var(--amber-ink); }
.scenario-card details { color: var(--muted); font-size: 13px; }
.scenario-card summary { cursor: pointer; color: var(--muted); min-height: 24px; }
.scenario-card .note { color: var(--faint); }

.dial { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "label value" "slider slider" "hint hint"; gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--rule); }
.dial:first-of-type { border-top: 0; }
.dial label { grid-area: label; font-weight: 500; display: flex; align-items: baseline; gap: 8px; }
.dial .metaphor { font-family: var(--font-display); font-style: italic; color: var(--amber-ink); font-size: 15px; font-weight: 400; }
.dial output { grid-area: value; font-family: var(--font-mono); font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; align-self: baseline; }
.dial input[type=range] { grid-area: slider; width: 100%; margin: 4px 0 2px; accent-color: var(--amber); height: 28px; cursor: pointer; }
.dial .hint { grid-area: hint; font-size: 12px; color: var(--muted); }
.dial .hint b { color: var(--text); font-weight: 500; }
.dial .metaphor-note { color: var(--faint); font-style: italic; }

.transport { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.transport button { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 8px 6px; min-height: 36px; cursor: pointer; font-weight: 500; font-size: 13px; }
.transport button:hover { background: var(--surface-2); }
.transport button.primary { background: var(--amber); color: #1a1206; border-color: var(--amber); }
.transport button.primary:hover { background: var(--amber-ink); }
.transport button.danger { color: var(--cell-a); }
.transport button[hidden] { display: none; }
.speed { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
.speed input { accent-color: var(--amber); height: 28px; margin: 0; }
.speed output { font-family: var(--font-mono); color: var(--text); font-variant-numeric: tabular-nums; }
.speed .speed-hint { grid-column: 2 / -1; color: var(--faint); font-variant-numeric: tabular-nums; }
.share { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.share button, .tools-row button { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 5px 10px; min-height: 28px; cursor: pointer; font-size: 12px; color: var(--text); }
.share button:hover, .tools-row button:hover { background: var(--surface-2); }
.share .link-out { flex: 1 1 100%; min-height: 28px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--text); font-family: var(--font-mono); font-size: 11px; padding: 4px 8px; }
.share .link-out[hidden] { display: none; }

.readout { display: grid; gap: 2px; margin-bottom: 12px; }
.readout .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.readout h3 { margin: 0; font-size: 13px; font-weight: 500; color: var(--text); }
.readout .meaning .unit { color: var(--text); }
.readout .val { font-family: var(--font-mono); font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; text-align: right; flex: none; }
.readout .meaning { margin: 0 0 2px; font-size: 12px; color: var(--muted); }
.readout canvas { width: 100%; height: 84px; display: block; background: var(--surface); border-radius: 6px; }
.readout .keys { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); min-height: 14px; }
.readout .keys i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.readout .keys i.dash { width: 14px; height: 0; border-top: 2px dashed var(--muted); vertical-align: 3px; border-radius: 0; }
.readout .keys [hidden] { display: none; }
.gauge canvas { width: 100%; height: 62px; display: block; background: var(--surface); border-radius: 6px; }
.tools-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tools-row button[aria-pressed="true"] { border-color: var(--amber); color: var(--amber-ink); }
.tools-row button[hidden] { display: none; }
#stats-table { margin-top: 8px; overflow-x: auto; }
#stats-table[hidden] { display: none; }
#stats-table table { width: 100%; border-collapse: collapse; font-size: 12px; }
#stats-table caption { text-align: left; color: var(--muted); padding: 0 0 6px; font-family: var(--font-mono); }
#stats-table th, #stats-table td { text-align: left; padding: 4px 6px; border-top: 1px solid var(--rule); vertical-align: top; }
#stats-table thead th { color: var(--muted); font-weight: 500; border-top: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
#stats-table tbody th { font-weight: 500; }
#stats-table td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

.about { color: var(--muted); font-size: 13px; }
.about summary { cursor: pointer; color: var(--text); font-weight: 500; min-height: 24px; }
.about p { margin: 8px 0; max-width: 60ch; }
.about .tagline { color: var(--text); font-family: var(--font-display); font-size: 16px; font-style: italic; }
.about h3 { margin: 14px 0 6px; font-size: 13px; color: var(--text); font-weight: 600; }
.about dl { margin: 8px 0; display: grid; gap: 8px; }
.about dt { color: var(--text); font-style: italic; font-family: var(--font-display); font-size: 16px; }
.about dd { margin: 0; }
.about .keys-list { margin: 6px 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.about .tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.about .tools button, .about .tools a { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 6px 10px; min-height: 28px; cursor: pointer; font-size: 12px; color: var(--text); text-decoration: none; display: inline-flex; align-items: center; }
.note { font-size: 12px; color: var(--faint); }

#busy { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(11,15,20,0.6); color: var(--text); font-family: var(--font-mono); font-size: 13px; }
#busy[hidden] { display: none; }
[hidden] { display: none !important; }

@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 58vh auto; height: auto; }
  #panel { border-left: 0; border-top: 1px solid var(--rule); }
  .hud-top { max-width: 70%; }
  .brand { font-size: 24px; }
  .equilibrium { font-size: 13px; }
  .hud-legend { max-width: calc(50% - 30px); }
  .hud-layers { max-width: calc(50% - 22px); }
  #legend { max-height: 45vh; overflow-y: auto; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>

<body>
<div id="app">
  <main id="stage" aria-label="3D tissue view">
    <canvas id="view" role="img" tabindex="0" aria-label="3D tissue view, loading"></canvas>
    <div class="hud hud-top">
      <h1 class="brand"><em>Tissue Weather</em><small>dynamic reciprocity</small></h1>
      <div class="clock"><span>day <b id="day">0.0</b></span><span id="tissue-name"></span><span id="scenario-name"></span><span id="fps" class="note"></span></div>
      <p class="equilibrium" id="equilibrium" data-state="steady" role="status" aria-live="polite" aria-atomic="true"></p>
    </div>
    <details class="hud hud-legend" id="legend-box" open>
      <summary>Legend</summary>
      <div id="legend"></div>
    </details>
    <div class="hud hud-layers" id="layers" role="group" aria-label="Layers shown in the 3D view"></div>
    <div id="notice" role="alert" hidden></div>
    <div id="busy" hidden>preparing tissue…</div>
  </main>
  <aside id="panel" aria-label="Controls and readouts">
    <section>
      <h2 id="h-tissue">Tissue</h2>
      <fieldset class="segmented" id="tissue-picker" aria-labelledby="h-tissue"></fieldset>
      <p class="tissue-short" id="tissue-short"></p>
    </section>
    <div class="hint-card" id="hint" role="note">
      <p><b>First time here?</b> Pick a scenario, press Play, then move a dial.</p>
      <button type="button" id="hint-dismiss" aria-label="Dismiss this hint">Got it</button>
    </div>
    <section>
      <h2 id="h-scenario">Scenario</h2>
      <div class="scenarios" id="scenarios" role="group" aria-labelledby="h-scenario"></div>
    </section>
    <section class="scenario-card" id="scenario-card" aria-label="Scenario details"></section>
    <section>
      <h2>Weather</h2>
      <div id="dials"></div>
    </section>
    <section>
      <h2>Run</h2>
      <div class="transport">
        <button id="btn-play" class="primary" type="button" aria-keyshortcuts="Space" title="Run the simulation (Space)">Play</button>
        <button id="btn-step" type="button" title="Advance one simulated day">+1 day</button>
        <button id="btn-injure" class="danger" type="button" title="Wound the tissue at a random spot" aria-keyshortcuts="i" hidden>Injure</button>
        <button id="btn-reset" type="button" title="Restart this scenario from day 0; the current run stays as dashed lines" aria-keyshortcuts="r">Reset</button>
      </div>
      <div class="speed">
        <label for="speed">speed</label>
        <input id="speed" type="range" min="0.25" max="20" step="0.25" value="2" aria-describedby="speed-hint">
        <output id="speed-out" for="speed">2 d/s</output>
        <span class="speed-hint" id="speed-hint">1 week ≈ 3.5 s</span>
      </div>
      <div class="share">
        <button type="button" id="btn-copy-link" title="Copy a link that restores this tissue, scenario, dials and speed">Copy link</button>
        <input class="link-out" id="link-out" type="text" readonly aria-label="Link to this view" hidden>
      </div>
    </section>
    <section>
      <h2>Readouts</h2>
      <div id="readouts"></div>
      <div class="tools-row">
        <button type="button" id="btn-table" aria-pressed="false" aria-controls="stats-table" title="Show the latest values as a text table">Table</button>
        <button type="button" id="btn-clear-ref" hidden title="Remove the dashed previous-run lines from the charts">Clear comparison</button>
      </div>
      <div id="stats-table" hidden></div>
    </section>
    <section>
      <h2>About</h2>
      <details class="about" id="about">
        <summary>What am I looking at?</summary>
        <div id="about-body"></div>
      </details>
    </section>
  </aside>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== src/copy.js =====
// src/copy.js — shared student-facing copy helpers for Tissue Weather.
//
// Tissue-specific text (dials, scenario cards, readouts, intro, metaphor
// breaks, legend, vocabulary) lives in the tissue definitions under
// src/tissues/ (docs/EXTENDING.md §1 `copy`). This file keeps only what every
// tissue shares: the live equilibrium sentence and two formatters.
//
// Build constraints (docs/EXTENDING.md): ES module, named exports only, no
// imports, every top-level identifier prefixed COPY_ / copy so the single-file
// build can strip `export ` and concatenate without collisions.
//
// Voice: plain, second person, concrete. The cloud metaphor (droplets = matrix,
// vapor = soluble precursors, humidity / pressure / temperature = the dials) is
// a label and a hint, not a claim; each tissue says where it breaks.

/** Format a rate (density per day) compactly: 0.12/d, 0.005/d, 1.5/d, 12/d. */
function copyFormatRate(x) {
  const v = Number.isFinite(x) ? Math.abs(x) : 0;
  let s;
  if (v >= 10) s = v.toFixed(0);
  else if (v >= 1) s = v.toFixed(1);
  else if (v >= 0.01) s = v.toFixed(2);
  else if (v >= 0.0005) s = v.toFixed(3);
  else s = '0';
  return s + '/d';
}

/**
 * Format a dial value per the definition's `format` field (docs/EXTENDING.md §1):
 * 'fixed2' → 0.50 · 'percent' → 60 % · 'cells' → 160 cells · 'int' → 160 ·
 * 'onoff' → Off / On (0/1 toggle) · function → format(value).
 */
function copyFormatDial(format, value) {
  const v = Number.isFinite(value) ? value : 0;
  if (typeof format === 'function') return String(format(v));
  switch (format) {
    case 'fixed2': return v.toFixed(2);
    case 'percent': return `${Math.round(v * 100)} %`;
    case 'cells': return `${Math.round(v)} cells`;
    case 'int': return String(Math.round(v));
    case 'onoff': return v >= 0.5 ? 'On' : 'Off';
    default: return String(v);
  }
}

function copyNum(v) {
  return Number.isFinite(v) ? v : 0;
}

/** Nouns used when a tissue supplies no `copy.vocabulary`. */
const COPY_VOCABULARY_DEFAULT = Object.freeze({
  matrix: 'matrix',
  cellsActive: 'activated cells are building matrix',
  cellsQuiet: 'the cells are quiet',
});

/**
 * One live sentence (<= 28 words) describing the current balance and what the
 * cells are doing. Pure: same stats in, same string out.
 *
 * stats: an engine stats() object — deposition / degradation are MEAN density
 *   change per day over the tissue, cells.a the mean primary cell state (0..1),
 *   species.total the mean matrix density, logE the mean log10 stiffness (kPa).
 *   (The v0.1 shape meanAlpha / meanRho / meanLogE is still accepted.)
 * vocabulary: tissue.copy.vocabulary = { matrix, cellsActive, cellsQuiet }.
 *
 * Balance: ratio deposition/degradation > 1.15 condensing, < 0.87 evaporating,
 * otherwise holding shape ("still" below 1e-6 on both mean rates).
 * Cells: a < 0.3 quiet, > 0.6 activated. Empty: density < 0.05. Stiff: E >= 30 kPa.
 */
function copyEquilibriumSentence(stats, vocabulary) {
  const s = stats || {};
  const V = Object.assign({}, COPY_VOCABULARY_DEFAULT, vocabulary || {});
  const dep = Math.max(0, copyNum(s.deposition));
  const deg = Math.max(0, copyNum(s.degradation));
  const alpha = copyNum(s.cells ? s.cells.a : s.meanAlpha);
  const rho = copyNum(s.species ? s.species.total : s.meanRho);
  const logE = s.logE !== undefined ? s.logE : s.meanLogE;
  const E = Number.isFinite(logE) ? Math.pow(10, logE) : NaN;

  const tiny = 1e-6;
  const still = dep < tiny && deg < tiny;
  const ratio = deg > tiny ? dep / deg : dep > tiny ? Infinity : 1;
  const trend = still ? 'still' : ratio > 1.15 ? 'condensing' : ratio < 0.87 ? 'evaporating' : 'steady';
  const cells = alpha < 0.3 ? 'quiet' : alpha > 0.6 ? 'activated' : 'partly';
  const empty = rho < 0.05;
  const stiff = Number.isFinite(E) && E >= 30;

  const verb = trend === 'condensing' ? 'outpaces' : trend === 'evaporating' ? 'trails' : 'matches';
  const head = 'Deposition ' + copyFormatRate(dep) + ' ' + verb + ' degradation ' + copyFormatRate(deg);

  let tail;
  if (trend === 'still') {
    tail = empty
      ? 'the cloud is still; there is hardly any matrix yet, so add cells, growth factor or load to start condensation.'
      : 'the cloud is still; almost nothing is being built or removed, so nothing here is changing.';
  } else if (trend === 'condensing') {
    if (cells === 'activated') {
      tail = stiff
        ? 'the cloud is condensing; ' + V.cellsActive + ' into a matrix already stiff enough to hold them switched on.'
        : 'the cloud is condensing; ' + V.cellsActive + ' and stiffening the matrix that keeps them switched on.';
    } else if (cells === 'quiet') {
      tail = 'the cloud is condensing; ' + V.cellsQuiet + ', so this is slow basal deposition with little breakdown to oppose it.';
    } else {
      tail = 'the cloud is condensing; the cells are partly activated and laying down more ' + V.matrix + ' than is removed.';
    }
  } else if (trend === 'evaporating') {
    if (cells === 'activated') {
      tail = 'the cloud is evaporating; the cells are activated, but breakdown is winning, and a softening matrix pulls activation down.';
    } else if (cells === 'quiet') {
      tail = 'the cloud is evaporating; ' + V.cellsQuiet + ', making little ' + V.matrix + ', so breakdown wins and the matrix thins.';
    } else {
      tail = 'the cloud is evaporating; the cells are only partly activated and cannot keep pace with breakdown.';
    }
  } else if (cells === 'activated') {
    tail = 'the cloud holds its shape; activated cells rebuild almost exactly the ' + V.matrix + ' that is removed, so this is a busy balance.';
  } else if (cells === 'quiet') {
    tail = empty
      ? 'the cloud holds its shape; there is hardly any matrix yet, so add cells, growth factor or load to start condensation.'
      : 'the cloud holds its shape; ' + V.cellsQuiet + ' and turnover is slow, so the tissue is resting, not remodelling.';
  } else {
    tail = 'the cloud holds its shape; partly activated cells replace ' + V.matrix + ' about as fast as it is removed.';
  }

  return head + ' — ' + tail;
}


// ===== src/engine.js =====
/*
 * Tissue Weather — generic simulation engine (docs/EXTENDING.md §2–§3, §5).
 *
 * The engine knows about a cubic grid of voxels, per-voxel matrix SPECIES
 * densities, a shared fiber orientation tensor T (trace = Σ fiber species),
 * diffusible FIELDS, motile CELLS with two state scalars (a, b) and a type, the
 * dials, the numerics, statistics and the export format.  It knows nothing
 * about what the matrix is made of or what the cells do: that comes from a
 * tissue definition (src/tissues/*.js) whose `makeRules()` returns the hooks
 * `cell(ctx)`, `voxel(ctx)` and optionally `stiffness(ctx)`.
 *
 * Pure ES module: no DOM, no `performance`, no `Math.random` (all randomness
 * comes from a mulberry32 PRNG seeded in the constructor), named exports only,
 * top-level identifiers prefixed `TissueEngine` / `ENGINE_` / `engine` / `tm` /
 * `mulberry32` so the single-file build can concatenate the sources.
 *
 * ---------------------------------------------------------------------------
 * WHERE THE CONTRACT IS SILENT — choices made here (all documented in one place)
 * ---------------------------------------------------------------------------
 *  engine numerics   ENGINE_DEFAULTS adds L (cube side), K (fiber instances per
 *                    voxel, export meta only), nCellsMax (capacity of the cell
 *                    arrays; the real capacity is max(nCellsMax, cellCount dial
 *                    max)) and eps (a voxel whose fiber total is ≤ eps has its
 *                    tensor and fiber species zeroed).  `trace` must be 'fiber'.
 *  constructor       `new TissueEngine(tissue, { seed, overrides })` validates
 *                    the definition (TissueEngine.validate) and resets to the
 *                    FIRST scenario so the instance is always in a valid state.
 *  reset(key, o)     `o = { dials, init, seed }` are optional overrides merged
 *                    shallowly over the scenario's dials / init (tools and the
 *                    golden regression use them).  makeRules() is called at the
 *                    start of every reset.
 *  init.species      uniform densities with ONE jitter draw per voxel shared by
 *                    all species: density × (1 + jitter·(u − ½)), u ~ U[0,1)
 *                    (i.e. ± jitter·50 %; default jitter 0, the draw is always
 *                    consumed so the RNG stream does not depend on it), then
 *                    three draws for a random initial principal axis.  Species
 *                    not listed start at 0.  Fields with a bath start at the
 *                    bath dial's value, others at 0; `init.fields: {key: v}`
 *                    overrides that.  Cells: three draws for the position, three
 *                    for the polarity; a = cellType.init.a (default 0), b =
 *                    cellType.init.b (default 0).  With several cell types the
 *                    type of each new cell is chosen deterministically (no RNG)
 *                    so that the counts track `cellType.fraction` (default:
 *                    equal shares).
 *  init.from         pre-runs `from.scenario` for `from.days` in a fresh engine
 *                    with seed + 1 (v0.1 convention: the pre-run's RNG stream
 *                    differs from the main run's), without that scenario's
 *                    events, and copies species, T, principal axes, fields and
 *                    cells.  Cached per (scenario, days, seed) in the instance.
 *                    Chains (from → from) are allowed up to depth 4.
 *  scenario.events   OPTIONAL `events: [{ at, dials }, { at, injure: { center?, radius? } }]`
 *                    applied by checkScenario() and the headless tools when the
 *                    clock reaches day `at` (before stepping on).  The app may
 *                    treat them as suggestions (v0.1 never auto-injured).
 *  checks            `{ at, stat, op, value }` or `{ at, stat, rel: { stat, op, at? }, value? }`:
 *                    with `rel` the check passes when stat(at) op (rel.stat at
 *                    rel.at (default: same day) + value (default 0)).
 *  cell hook outputs out.a / out.b are pre-filled with the current values (so a
 *                    hook that does not write them leaves the state unchanged);
 *                    out.aSum is pre-filled with NaN and the engine substitutes
 *                    out.a ("default a") when the hook leaves it; every other
 *                    output is zeroed.  ctx.fz is |f_z|.  ctx.rho reflects the
 *                    deposition of cells processed earlier in the same step;
 *                    ctx.fiberTotal, ctx.fa, ctx.E are from the last voxel pass.
 *  voxel hook        out.E is pre-filled with the voxel's current E; the engine
 *                    applies dRho first (clamp ≥ 0), then rescales T so that its
 *                    trace equals the new fiber total (this both applies the loss
 *                    and keeps trace(T) = Σ fiber species exact), then the
 *                    passive load alignment, the trace clamp (T AND the fiber
 *                    species are scaled), the PSD guard.  A fiber total that
 *                    appears in a voxel with a zero tensor is added isotropically.
 *  field.boundary    OPTIONAL 'bath' (default: relaxation toward the bath dial
 *                    everywhere at kBath) or 'face:+z' / 'face:-z' (Dirichlet:
 *                    the voxels of that z layer are held at the bath dial's value
 *                    after every step, no bulk relaxation, all other walls
 *                    zero-flux — e.g. oxygen entering from the medium face).
 *                    Consumption is a negative cell fieldSrc; fields stay ≥ 0.
 *  cell state c      a third per-cell scalar next to a and b (ctx.c, out.c,
 *                    state.cc, stats.cells.c, snapshot cells.c), clamped to
 *                    cellType.cRange (default [0, 1]); initial value
 *                    cellType.init.c (default 0).  Swap-remove moves it too.
 *  load axis         z, fixed.  With no role:'load' dial ctx.load = 0 and the
 *                    passive alignment is off (hooks may still output loadAlign).
 *  polarity noise    `out.noise` rad/√day → three Gaussian draws (each the sum
 *                    of three uniforms) per cell per step, only when noise > 0.
 *  stats().fz        Tzz / trace of the MEAN tensor (alignment with the load
 *                    axis; 1/3 when there is no fiber).  ratio = deposition /
 *                    degradation (Infinity if only deposition, 1 if both are 0).
 *  stat(path)        also accepts 'fz', 'cells.n', 't' and 'species.fiberTotal'.
 *  exportMeta(extra) merges `extra` (e.g. { exportEveryDays }) into the meta.
 *  woundStats()      means inside the last wound sphere (null without a wound).
 *  checkScenario     `{ seed = 7, engine }`: pass an existing engine of the same
 *                    tissue to reuse its init.from cache.
 * ---------------------------------------------------------------------------
 */

const ENGINE_VERSION = '0.2.0';

/** Engine-level numerics; a tissue's `engine` block and constructor `overrides` are merged over these. */
const ENGINE_DEFAULTS = Object.freeze({
  N: 12,            // voxels per side
  L: 1,             // cube side (≈ 300 µm)
  dt: 0.02,         // days per step
  K: 3,             // fiber instances per voxel (render / export meta only)
  rhoMax: 2,        // trace clamp on the fiber total
  kLoadFib: 0.06,   // /day passive alignment of T toward z, × load^loadExp
  loadExp: 2,       // exponent of the load dial in the passive alignment
  fEvery: 4,        // refresh the principal axis every fEvery steps
  rCell: 0.03,      // cell radius (repulsion range 2·rCell)
  kRep: 0.5,        // repulsion stiffness
  trace: 'fiber',   // T trace = Σ fiber species (the only supported mode)
  nCellsMax: 400,   // minimum capacity of the cell arrays
  eps: 1e-6,        // fiber total below which a voxel's tensor is zeroed
});

/** mulberry32 PRNG: returns a function producing uniform floats in [0,1). */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function tmRand() {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function tmClamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }

/** Round a typed array into a plain array with `digits` decimals (for JSON). */
function tmRoundArray(arr, digits) {
  const f = 10 ** digits, out = new Array(arr.length);
  for (let i = 0; i < arr.length; i++) out[i] = Math.round(arr[i] * f) / f;
  return out;
}

const ENGINE_OPS = Object.freeze({
  gt: (a, b) => a > b,
  lt: (a, b) => a < b,
  between: (a, b) => Array.isArray(b) && a >= b[0] && a <= b[1],
});
const ENGINE_FORMATS = Object.freeze(['fixed2', 'percent', 'cells', 'int', 'onoff']);
const ENGINE_HEX = /^#[0-9a-fA-F]{6}$/;
const ENGINE_IDENT = /^[A-Za-z_][A-Za-z0-9_]*$/;
const ENGINE_TISSUE_KEY = /^[a-z0-9-]+$/;

/** Resolve a §1 stat path against a stats() object; undefined if unknown. */
function engineStatFrom(s, path) {
  switch (path) {
    case 't': return s.t;
    case 'fa': return s.fa;
    case 'globalFA': return s.globalFA;
    case 'fz': return s.fz;
    case 'logE': return s.logE;
    case 'E': return s.E;
    case 'deposition': return s.deposition;
    case 'degradation': return s.degradation;
    case 'ratio': return s.ratio;
    case 'species.total': return s.species.total;
    case 'species.fiberTotal': return s.species.fiberTotal;
    case 'fiber.total': return s.species.fiberTotal;
    case 'cells.a': return s.cells.a;
    case 'cells.b': return s.cells.b;
    case 'cells.c': return s.cells.c;
    case 'cells.n': return s.cells.n;
    default: break;
  }
  const p = path.split('.');
  if (p[0] === 'species' && p.length === 2) return s.species[p[1]];
  if (p[0] === 'species' && p.length === 3 && p[2] === 'fraction') return s.fraction[p[1]];
  if (p[0] === 'fields' && p.length === 2) return s.fields[p[1]];
  return undefined;
}

/** Is `path` a stat path that exists for this definition (species/field keys resolved)? */
function engineStatPathValid(tissue, path) {
  if (typeof path !== 'string') return false;
  if (['t', 'fa', 'globalFA', 'fz', 'logE', 'E', 'deposition', 'degradation', 'ratio', 'species.total', 'species.fiberTotal',
    'fiber.total', 'cells.a', 'cells.b', 'cells.c', 'cells.n'].includes(path)) return true;
  const p = path.split('.');
  const sKeys = (tissue.species || []).map((s) => s.key), fKeys = (tissue.fields || []).map((f) => f.key);
  if (p[0] === 'species' && p.length === 2) return sKeys.includes(p[1]);
  if (p[0] === 'species' && p.length === 3 && p[2] === 'fraction') return sKeys.includes(p[1]);
  if (p[0] === 'fields' && p.length === 2) return fKeys.includes(p[1]);
  return false;
}

class TissueEngine {
  /**
   * @param {object} tissue     a tissue definition (docs/EXTENDING.md §1)
   * @param {object} opts       { seed: uint32, overrides: { N, dt, ... engine numerics } }
   */
  constructor(tissue, opts = {}) {
    const errors = TissueEngine.validate(tissue);
    if (errors.length) throw new Error(`invalid tissue definition '${tissue && tissue.key}': ${errors.join('; ')}`);
    this.tissue = tissue;
    this.seed = (opts.seed === undefined ? 20240907 : opts.seed) >>> 0;
    this._overrides = Object.assign({}, opts.overrides || {});

    const P = this.P = Object.freeze(Object.assign({}, ENGINE_DEFAULTS, tissue.engine || {}, this._overrides));
    if (P.trace !== 'fiber') throw new Error(`engine.trace '${P.trace}' is not supported (only 'fiber')`);
    const N = this.N = P.N | 0, NV = this.NV = N * N * N;
    this.L = P.L; this.h = P.L / N; this.dt = P.dt;

    // ---- species
    this.speciesKeys = tissue.species.map((s) => s.key);
    this.speciesIndex = {};
    this.speciesKeys.forEach((k, i) => { this.speciesIndex[k] = i; });
    this.nSpecies = this.speciesKeys.length;
    this.species = this.speciesKeys.map(() => new Float32Array(NV));
    this._isFiber = new Uint8Array(this.nSpecies);
    const fiberIdx = [];
    tissue.species.forEach((s, i) => { if (s.kind === 'fiber') { this._isFiber[i] = 1; fiberIdx.push(i); } });
    this._fiberIdx = Int32Array.from(fiberIdx);
    this._lastFiber = fiberIdx.length ? fiberIdx[fiberIdx.length - 1] : -1;

    // ---- orientation tensor and derived per-voxel fields
    this.Txx = new Float32Array(NV); this.Tyy = new Float32Array(NV); this.Tzz = new Float32Array(NV);
    this.Txy = new Float32Array(NV); this.Txz = new Float32Array(NV); this.Tyz = new Float32Array(NV);
    this.fiberTotal = new Float32Array(NV);
    this.fa = new Float32Array(NV);
    this.fx = new Float32Array(NV); this.fy = new Float32Array(NV); this.fz = new Float32Array(NV);
    this.E = new Float32Array(NV);
    this.inflam = new Float32Array(NV);

    // ---- dials
    this.dialKeys = tissue.dials.map((d) => d.key);
    this.dialIndex = {};
    this.dialKeys.forEach((k, i) => { this.dialIndex[k] = i; });
    this.nDials = this.dialKeys.length;
    this._dialVals = new Float64Array(this.nDials);
    this.dials = {};
    this._loadDial = -1; this._cellDial = -1;
    tissue.dials.forEach((d, i) => {
      this._dialVals[i] = d.default; this.dials[d.key] = d.default;

      if (d.role === 'cellCount') this._cellDial = i;
    });

    this.fieldKeys = tissue.fields.map((f) => f.key);

    this.fieldKeys.forEach((k, i) => { this.fieldIndex[k] = i; });

    this._fields2 = this.fieldKeys.map(() => new Float32Array(NV));

    this._fInfl = new Float64Array(this.nFields); this._fBurst = new Float64Array(this.nFields);

    tissue.fields.forEach((f, i) => {
      this._fD[i] = f.D || 0; this._fKBath[i] = f.kBath || 0; this._fDecay[i] = f.decay || 0;
      this._fBathDial[i] = f.bath ? this.dialIndex[f.bath] : -1;

    this._typeInitB = Float64Array.from(tissue.cellTypes.map((c) => (c.init && c.init.b) || 0));
    this._typeInitC = Float64Array.from(tissue.cellTypes.map((c) => (c.init && c.init.c) || 0));

    this._cp = new Float32Array(3 * this.cap);
    this._ca = new Float32Array(this.cap);
    this._cb = new Float32Array(this.cap);
    this._cc = new Float32Array(this.cap);
    this._ctype = new Uint8Array(this.cap);
    this._vox = new Int32Array(this.cap);
    this._dx = new Float32Array(3 * this.cap);
    this._binStart = new Int32Array(NV + 1); this._binCursor = new Int32Array(NV); this._binCell = new Int32Array(this.cap);
    this._views = { n: -1, cx: null, cp: null, ca: null, cb: null, cc: null, ctype: null };

    // ---- per-step scratch
    this._aSum = new Float64Array(NV);
    this._cellCount = new Int32Array(NV);

    // ---- reusable hook contexts (monomorphic: every field initialised once)
    const self = this;
    this._cctx = {
      i: 0, type: 0, a: 0, b: 0, c: 0, dt: this.dt,
      rho: new Float32Array(this.nSpecies), fiberTotal: 0, fa: 0, fz: 0,
      field: new Float32Array(this.nFields), E: 0, dial: this._dialVals, load: 0, cellsInVoxel: 0,
      rng: () => self.rng(),
      out: { a: 0, b: 0, c: 0, secrete: new Float64Array(this.nSpecies), pol: 0, align: 0, fieldSrc: new Float64Array(this.nFields),

    };

      v: 0, dt: this.dt, rho: new Float32Array(this.nSpecies), fiberTotal: 0, fa: 0, Tzz_over_trace: 0,
      field: new Float32Array(this.nFields), dial: this._dialVals, load: 0, aSum: 0, nCellsHere: 0, inflam: 0,
      out: { dRho: new Float64Array(this.nSpecies), loss: 0, fieldSrc: new Float64Array(this.nFields), E: 0 },

  // ------------------------------------------------------------------ setup

  /** Scenario definition by key (throws if unknown). */
  scenarioDef(key) {
    const sc = this.tissue.scenarios.find((s) => s.key === key);
    if (!sc) throw new Error(`unknown scenario '${key}' for tissue '${this.tissue.key}'`);
    return sc;
  }

  /**
   * Reset to a scenario. Optional overrides { dials: {...}, init: {...}, seed } are merged

  // -------------------------------------------------------------- injury

  // ---------------------------------------------------------------- step
