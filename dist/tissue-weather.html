          tr = rhoMax;
        }
        if (txx < 0) txx = 0; if (tyy < 0) tyy = 0; if (tzz < 0) tzz = 0;
        if (txy * txy > txx * tyy) txy = (txy < 0 ? -0.999 : 0.999) * Math.sqrt(txx * tyy);
        if (txz * txz > txx * tzz) txz = (txz < 0 ? -0.999 : 0.999) * Math.sqrt(txx * tzz);
        if (tyz * tyz > tyy * tzz) tyz = (tyz < 0 ? -0.999 : 0.999) * Math.sqrt(tyy * tzz);
      } else {
        txx = 0; tyy = 0; tzz = 0; txy = 0; txz = 0; tyz = 0; tr = 0;
        for (let q = 0; q < fiberIdx.length; q++) species[fiberIdx[q]][v] = 0;
      }
      Txx[v] = txx; Tyy[v] = tyy; Tzz[v] = tzz; Txy[v] = txy; Txz[v] = txz; Tyz[v] = tyz;
      fiberTotal[v] = tr;

      // --- derived: FA, principal axis (warm-started power iteration), stiffness from the hook
      const fro2 = txx * txx + tyy * tyy + tzz * tzz + 2 * (txy * txy + txz * txz + tyz * tyz);
      let f = 0;
      if (fro2 > eps2) {
        f = 1.5 * (fro2 - tr * tr / 3) / fro2;      // FA² = 3/2·‖T − (tr/3)I‖² / ‖T‖²
        f = f <= 0 ? 0 : (f >= 1 ? 1 : Math.sqrt(f));
        if (doF) {
          let ax = fx[v], ay = fy[v], az = fz[v];
          for (let it = 0; it < 2; it++) {
            const bx = txx * ax + txy * ay + txz * az;
            const by = txy * ax + tyy * ay + tyz * az;
            const bz = txz * ax + tyz * ay + tzz * az;
            const bn = Math.sqrt(bx * bx + by * by + bz * bz);
            if (bn < 1e-12) break;
            ax = bx / bn; ay = by / bn; az = bz / bn;
          }
          fx[v] = ax; fy[v] = ay; fz[v] = az;
        }
      }
      fa[v] = f;
      const Ev = vout.E;
      E[v] = Ev === Ev ? Ev : E[v];
    }

    // ------------------------------------------- diffusible fields
    this._diffuse(dt);

    this._lastDep = depTotal; this._lastDeg = degTotal;
    this.time += dt; this.stepCount++;
  }

  /** Explicit 6-neighbour diffusion with zero-flux walls, sources, bath exchange, decay, inflammation. */
  _diffuse(dt) {
    const N = this.N, NV = this.NV, h2 = this.h * this.h, N2 = N * N, Nm1 = N - 1, inflam = this.inflam;
    const hasInfl = this._inflTau > 0;
    for (let f = 0; f < this.nFields; f++) {
      const lam = Math.min(this._fD[f] * dt / h2, 1 / 6);
      const bd = this._fBathDial[f], bath = bd >= 0 ? this._dialVals[bd] : 0, face = this._fBoundary[f];
      const kBath = bd >= 0 && face === 0 ? this._fKBath[f] : 0;   // face boundaries: no bulk relaxation
      const decay = this._fDecay[f], wInf = hasInfl ? this._fInfl[f] : 0;
      const g = this.fields[f], g2 = this._fields2[f], src = this._fieldSrc[f];
      for (let i = 0; i < N; i++) {
        const im = i > 0, ip = i < Nm1;
        for (let j = 0; j < N; j++) {
          const jm = j > 0, jp = j < Nm1;
          const base = (i * N + j) * N;
          for (let k = 0; k < N; k++) {
            const v = base + k;
            const gv = g[v];
            let sg = 0, cnt = 0;
            if (im) { sg += g[v - N2]; cnt++; }
            if (ip) { sg += g[v + N2]; cnt++; }
            if (jm) { sg += g[v - N]; cnt++; }
            if (jp) { sg += g[v + N]; cnt++; }
            if (k > 0) { sg += g[v - 1]; cnt++; }
            if (k < Nm1) { sg += g[v + 1]; cnt++; }
            const ng = gv + lam * (sg - cnt * gv) + dt * (kBath * (bath - gv) + src[v] - decay * gv + wInf * inflam[v]);
            g2[v] = ng > 0 ? ng : 0;
          }
        }
      }
      if (face !== 0 && bd >= 0) {   // Dirichlet face: hold the boundary layer at the bath value
        const k = face > 0 ? Nm1 : 0;
        for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) g2[(i * N + j) * N + k] = bath;
      }
      this.fields[f] = g2; this._fields2[f] = g;
    }
    if (hasInfl) {
      const dec = Math.exp(-dt / this._inflTau);
      for (let v = 0; v < NV; v++) { const inf = inflam[v]; if (inf > 0) inflam[v] = inf > 1e-4 ? inf * dec : 0; }
    }
  }

  /** Cell counts per voxel from the current positions (used after reset / cell-count changes). */
  _countCells() {
    const N = this.N, Nm1 = N - 1, invh = 1 / this.h, cx = this._cx, cc = this._cellCount;
    cc.fill(0);
    for (let i = 0; i < this.nCells; i++) {
      const i3 = 3 * i;
      let ix = (cx[i3] * invh) | 0, iy = (cx[i3 + 1] * invh) | 0, iz = (cx[i3 + 2] * invh) | 0;
      if (ix > Nm1) ix = Nm1; else if (ix < 0) ix = 0;
      if (iy > Nm1) iy = Nm1; else if (iy < 0) iy = 0;
      if (iz > Nm1) iz = Nm1; else if (iz < 0) iz = 0;
      cc[(ix * N + iy) * N + iz]++;
    }
  }

  /** Full recomputation of fiberTotal, FA and the principal axis (2 warm-started power iterations). */
  _derived() {
    const NV = this.NV, eps = this.P.eps, nS = this.nSpecies, species = this.species, isFiber = this._isFiber;
    const Txx = this.Txx, Tyy = this.Tyy, Tzz = this.Tzz, Txy = this.Txy, Txz = this.Txz, Tyz = this.Tyz;
    const fa = this.fa, fx = this.fx, fy = this.fy, fz = this.fz, fiberTotal = this.fiberTotal;
    for (let v = 0; v < NV; v++) {
      const txx = Txx[v], tyy = Tyy[v], tzz = Tzz[v], txy = Txy[v], txz = Txz[v], tyz = Tyz[v];
      const tr = txx + tyy + tzz;
      let tot = 0;
      for (let s = 0; s < nS; s++) if (isFiber[s]) tot += species[s][v];
      fiberTotal[v] = tot;
      const fro2 = txx * txx + tyy * tyy + tzz * tzz + 2 * (txy * txy + txz * txz + tyz * tyz);
      let f = 0;
      if (fro2 > eps * eps) {
        f = 1.5 * (fro2 - tr * tr / 3) / fro2;
        f = f <= 0 ? 0 : (f >= 1 ? 1 : Math.sqrt(f));
        let ax = fx[v], ay = fy[v], az = fz[v];
        for (let it = 0; it < 2; it++) {
          const bx = txx * ax + txy * ay + txz * az;
          const by = txy * ax + tyy * ay + tyz * az;
          const bz = txz * ax + tyz * ay + tzz * az;
          const bn = Math.sqrt(bx * bx + by * by + bz * bz);
          if (bn < 1e-12) break;
          ax = bx / bn; ay = by / bn; az = bz / bn;
        }
        fx[v] = ax; fy[v] = ay; fz[v] = az;
      }
      fa[v] = f;
    }
  }

  /** Fill E from the tissue's `stiffness` hook (or `voxel` with dt = 0). */
  _stiffness() {
    const NV = this.NV, nS = this.nSpecies, nF = this.nFields, species = this.species, fields = this.fields;
    const vctx = this._vctx, vout = vctx.out, eps = this.P.eps;
    const hook = typeof this.rules.stiffness === 'function' ? this.rules.stiffness : this.rules.voxel;
    vctx.dt = 0; vctx.load = this._loadDial >= 0 ? this._dialVals[this._loadDial] : 0;
    for (let v = 0; v < NV; v++) {
      const tr = this.Txx[v] + this.Tyy[v] + this.Tzz[v];
      for (let s = 0; s < nS; s++) vctx.rho[s] = species[s][v];
      vctx.v = v; vctx.fiberTotal = this.fiberTotal[v]; vctx.fa = this.fa[v]; vctx.Tzz_over_trace = tr > eps ? this.Tzz[v] / tr : 0;
      for (let f = 0; f < nF; f++) vctx.field[f] = fields[f][v];
      vctx.aSum = 0; vctx.nCellsHere = this._cellCount[v]; vctx.inflam = this.inflam[v];
      for (let s = 0; s < nS; s++) vout.dRho[s] = 0;
      for (let f = 0; f < nF; f++) vout.fieldSrc[f] = 0;
      vout.loss = 0; vout.E = this.E[v];
      hook(vctx);
      const Ev = vout.E;
      this.E[v] = Ev === Ev ? Ev : this.E[v];
    }
    vctx.dt = this.dt;
  }

  // ------------------------------------------------------------- readouts

  get state() {
    const n = this.nCells, vw = this._views;
    if (vw.n !== n) {
      vw.n = n;
      vw.cx = this._cx.subarray(0, 3 * n); vw.cp = this._cp.subarray(0, 3 * n);
      vw.ca = this._ca.subarray(0, n); vw.cb = this._cb.subarray(0, n); vw.cc = this._cc.subarray(0, n); vw.ctype = this._ctype.subarray(0, n);
    }
    return {
      N: this.N, L: this.L, h: this.h, time: this.time, dt: this.dt,
      dials: this.dials, nCells: n, wound: this.wound, tissue: this.tissue.key, scenario: this.scenario,
      species: this.species, speciesKeys: this.speciesKeys,
      Txx: this.Txx, Tyy: this.Tyy, Tzz: this.Tzz, Txy: this.Txy, Txz: this.Txz, Tyz: this.Tyz,
      fiberTotal: this.fiberTotal, fa: this.fa, fx: this.fx, fy: this.fy, fz: this.fz, E: this.E, inflam: this.inflam,
      fields: this.fields, fieldKeys: this.fieldKeys,
      cx: vw.cx, cp: vw.cp, ca: vw.ca, cb: vw.cb, cc: vw.cc, ctype: vw.ctype,
    };
  }

  /** Generic scalar readouts (EXTENDING.md §3). deposition/degradation are MEAN density change per day. */
  stats() {
    const NV = this.NV, n = this.nCells, nS = this.nSpecies, nF = this.nFields;
    const fa = this.fa, E = this.E;
    let sF = 0, sLE = 0, sE = 0;
    let mxx = 0, myy = 0, mzz = 0, mxy = 0, mxz = 0, myz = 0;
    for (let v = 0; v < NV; v++) {
      sF += fa[v]; sE += E[v]; sLE += Math.log10(E[v]);
      mxx += this.Txx[v]; myy += this.Tyy[v]; mzz += this.Tzz[v]; mxy += this.Txy[v]; mxz += this.Txz[v]; myz += this.Tyz[v];
    }
    const species = {}, fraction = {};
    let total = 0, fiberTot = 0;
    for (let s = 0; s < nS; s++) {
      const arr = this.species[s];
      let sum = 0;
      for (let v = 0; v < NV; v++) sum += arr[v];
      const mean = sum / NV;
      species[this.speciesKeys[s]] = mean; total += mean;
      if (this._isFiber[s]) fiberTot += mean;
    }
    for (let s = 0; s < nS; s++) fraction[this.speciesKeys[s]] = total > 1e-9 ? species[this.speciesKeys[s]] / total : 0;
    species.total = total; species.fiberTotal = fiberTot;
    const fields = {};
    for (let f = 0; f < nF; f++) {
      const arr = this.fields[f];
      let sum = 0;
      for (let v = 0; v < NV; v++) sum += arr[v];
      fields[this.fieldKeys[f]] = sum / NV;
    }
    let sA = 0, sB = 0, sC = 0;
    for (let i = 0; i < n; i++) { sA += this._ca[i]; sB += this._cb[i]; sC += this._cc[i]; }
    // FA of the mean tensor = coherence of alignment across the whole tissue
    const tr = mxx + myy + mzz, fro2 = mxx * mxx + myy * myy + mzz * mzz + 2 * (mxy * mxy + mxz * mxz + myz * myz);
    let gFA = 0;
    if (fro2 > 1e-12) { gFA = 1.5 * (fro2 - tr * tr / 3) / fro2; gFA = gFA <= 0 ? 0 : Math.sqrt(Math.min(1, gFA)); }
    const deposition = this._lastDep / NV, degradation = this._lastDeg / NV;
    return {
      t: this.time,
      species, fraction,
      fa: sF / NV, globalFA: gFA, fz: tr > 1e-9 ? mzz / tr : 1 / 3,
      logE: sLE / NV, E: sE / NV,
      cells: { a: n > 0 ? sA / n : 0, b: n > 0 ? sB / n : 0, c: n > 0 ? sC / n : 0, n },
      fields,
      deposition, degradation,
      ratio: degradation > 1e-12 ? deposition / degradation : (deposition > 1e-12 ? Infinity : 1),
    };
  }

  /** One stat by §1 path, e.g. 'species.mat.fraction'. Throws on an unknown path. */
  stat(path) {
    const v = engineStatFrom(this.stats(), path);
    if (v === undefined) throw new Error(`unknown stat path '${path}'`);
    return v;
  }

  /** Same as stat(), from an already computed stats() object (undefined if unknown). */
  static statFrom(stats, path) { return engineStatFrom(stats, path); }

  /** Means inside the last wound sphere (null without a wound). */
  woundStats(wound = this.wound) {
    if (!wound) return null;
    const N = this.N, h = this.h, [cx, cy, cz] = wound.center, r2 = wound.radius * wound.radius;
    const nS = this.nSpecies, nF = this.nFields;
    const sS = new Float64Array(nS), sFld = new Float64Array(nF);
    let sF = 0, cnt = 0, sTot = 0;
    for (let i = 0; i < N; i++) {
      const x = (i + 0.5) * h - cx;
      for (let j = 0; j < N; j++) {
        const y = (j + 0.5) * h - cy;
        for (let k = 0; k < N; k++) {
          const z = (k + 0.5) * h - cz;
          if (x * x + y * y + z * z > r2) continue;
          const v = (i * N + j) * N + k;
          for (let s = 0; s < nS; s++) sS[s] += this.species[s][v];
          for (let f = 0; f < nF; f++) sFld[f] += this.fields[f][v];
          sF += this.fa[v]; sTot += this.fiberTotal[v]; cnt++;
        }
      }
    }
    let nc = 0, sA = 0, sB = 0, sC = 0;
    for (let i = 0; i < this.nCells; i++) {
      const x = this._cx[3 * i] - cx, y = this._cx[3 * i + 1] - cy, z = this._cx[3 * i + 2] - cz;
      if (x * x + y * y + z * z <= r2) { nc++; sA += this._ca[i]; sB += this._cb[i]; sC += this._cc[i]; }
    }
    const species = {}, fraction = {}, fields = {};
    let total = 0;
    for (let s = 0; s < nS; s++) { species[this.speciesKeys[s]] = cnt ? sS[s] / cnt : 0; total += species[this.speciesKeys[s]]; }
    for (let s = 0; s < nS; s++) fraction[this.speciesKeys[s]] = total > 1e-9 ? species[this.speciesKeys[s]] / total : 0;
    species.total = total; species.fiberTotal = cnt ? sTot / cnt : 0;
    for (let f = 0; f < nF; f++) fields[this.fieldKeys[f]] = cnt ? sFld[f] / cnt : 0;
    return { species, fraction, fields, fa: cnt ? sF / cnt : 0, nVox: cnt, cells: { n: nc, a: nc ? sA / nc : 0, b: nc ? sB / nc : 0, c: nc ? sC / nc : 0 } };
  }

  /** One frame of the format-2 export (EXTENDING.md §5): plain arrays, rounded. */
  snapshot() {
    const NV = this.NV, n = this.nCells, nS = this.nSpecies;
    const f = new Float32Array(3 * NV);
    for (let v = 0; v < NV; v++) { f[3 * v] = this.fx[v]; f[3 * v + 1] = this.fy[v]; f[3 * v + 2] = this.fz[v]; }
    const phi = new Float32Array(NV);
    if (this._lastFiber >= 0) {
      const last = this.species[this._lastFiber];
      for (let v = 0; v < NV; v++) phi[v] = this.fiberTotal[v] > 1e-9 ? last[v] / this.fiberTotal[v] : 0;
    }
    const species = {};
    for (let s = 0; s < nS; s++) species[this.speciesKeys[s]] = tmRoundArray(this.species[s], 3);
    const a = tmRoundArray(this._ca.subarray(0, n), 3);
    return {
      t: Math.round(this.time * 1000) / 1000,
      species,
      fa: tmRoundArray(this.fa, 3),
      f: tmRoundArray(f, 3),
      rho: tmRoundArray(this.fiberTotal, 3),   // format-1 readers: rho = fiber total
      phiMat: tmRoundArray(phi, 3),            // format-1 readers: fraction of the LAST fiber species
      cells: {
        x: tmRoundArray(this._cx.subarray(0, 3 * n), 4),
        p: tmRoundArray(this._cp.subarray(0, 3 * n), 3),
        a, b: tmRoundArray(this._cb.subarray(0, n), 3), c: tmRoundArray(this._cc.subarray(0, n), 3),
        type: Array.from(this._ctype.subarray(0, n)),
        alpha: a,                               // format-1 readers
      },
    };
  }

  /** `meta` block of the format-2 export; `extra` (e.g. { exportEveryDays }) is merged in. */
  exportMeta(extra = {}) {
    const t = this.tissue;
    return Object.assign({
      format: 2, tissue: t.key, tissueVersion: t.version, engine: ENGINE_VERSION,
      N: this.N, L: this.L, K: this.P.K, dtDays: this.dt, scenario: this.scenario,
      dials: Object.assign({}, this.dials), seed: this.seed,
      species: t.species.map((s) => ({ key: s.key, label: s.label, kind: s.kind, color: s.color })),
      cellTypes: t.cellTypes.map((c) => ({ key: c.key, label: c.label, colors: c.colors.slice(), shape: Object.assign({}, c.shape), radius: c.radius })),
    }, extra);
  }

  // ------------------------------------------------------------- scenario checks

  /**
   * Run `scenarioKey` (with its `events`) to the latest `at` of its checks and evaluate them.
   * Returns [{ check, value, ref, pass }]. opts: { seed = 7, engine } (engine: reuse an instance
   * of the same tissue, e.g. for its init.from cache).
   */
  static checkScenario(tissue, scenarioKey, opts = {}) {
    const seed = opts.seed === undefined ? 7 : opts.seed;
    const M = opts.engine || new TissueEngine(tissue, { seed });
    if (M.tissue !== tissue) throw new Error('checkScenario: engine belongs to another tissue');
    if (opts.engine && M.seed !== (seed >>> 0)) M.seed = seed >>> 0;
    M.reset(scenarioKey);
    const sc = M.scenarioDef(scenarioKey);
    const checks = sc.checks || [], events = (sc.events || []).map((e) => Object.assign({}, e));
    const days = new Set();
    let last = 0;
    for (const c of checks) {
      days.add(c.at); if (c.at > last) last = c.at;
      if (c.rel && c.rel.at !== undefined) { days.add(c.rel.at); if (c.rel.at > last) last = c.rel.at; }
    }
    for (const e of events) if (e.at > last) last = e.at;
    const stepsPerDay = Math.round(1 / M.dt);
    const rec = new Map();
    for (let d = 0; d <= last; d++) {
      for (const e of events) {
        if (e.at !== d || e.fired) continue;
        e.fired = true;
        if (e.dials) M.setDials(e.dials);
        if (e.injure) M.injure(e.injure.center || null, e.injure.radius);
      }
      if (days.has(d)) rec.set(d, M.stats());
      if (d < last) M.step(stepsPerDay);
    }
    return checks.map((check) => {
      const value = engineStatFrom(rec.get(check.at), check.stat);
      let pass, ref;
      if (check.rel) {
        const at = check.rel.at === undefined ? check.at : check.rel.at;
        ref = engineStatFrom(rec.get(at), check.rel.stat) + (check.value === undefined ? 0 : check.value);
        pass = ENGINE_OPS[check.rel.op](value, ref);
      } else {
        ref = check.value;
        pass = ENGINE_OPS[check.op](value, check.value);
      }
      return { check, value, ref, pass: !!pass };
    });
  }

  // ------------------------------------------------------------- schema

  /** Validate a tissue definition against EXTENDING.md §1. Returns an array of error strings ([] = valid). */
  static validate(t) {
    const err = [];
    const isNum = (x) => typeof x === 'number' && Number.isFinite(x);
    const isStr = (x) => typeof x === 'string' && x.length > 0;
    const isHex = (x) => typeof x === 'string' && ENGINE_HEX.test(x);
    if (!t || typeof t !== 'object') return ['definition is not an object'];
    if (!isStr(t.key) || !ENGINE_TISSUE_KEY.test(t.key)) err.push('key must match [a-z0-9-]+');
    if (!isStr(t.name)) err.push('name missing');
    if (!isStr(t.version)) err.push('version missing');
    if (typeof t.makeRules !== 'function') err.push('makeRules must be a function');

    const sKeys = [], fKeys = [], dKeys = [], scKeys = [];
    if (!Array.isArray(t.species) || t.species.length === 0) err.push('species must be a non-empty array');
    else t.species.forEach((s, i) => {
      if (!isStr(s.key) || !ENGINE_IDENT.test(s.key)) err.push(`species[${i}].key invalid`);
      else if (sKeys.includes(s.key)) err.push(`species key '${s.key}' duplicated`); else sKeys.push(s.key);
      if (!isStr(s.label)) err.push(`species '${s.key}' label missing`);
      if (!['fiber', 'gel', 'scaffold'].includes(s.kind)) err.push(`species '${s.key}' kind must be fiber|gel|scaffold`);
      if (!isHex(s.color)) err.push(`species '${s.key}' color must be #rrggbb`);
    });
    if (!Array.isArray(t.fields)) err.push('fields must be an array');
    else t.fields.forEach((f, i) => {
      if (!isStr(f.key) || !ENGINE_IDENT.test(f.key)) err.push(`fields[${i}].key invalid`);
      else if (fKeys.includes(f.key)) err.push(`field key '${f.key}' duplicated`); else fKeys.push(f.key);
      if (!isStr(f.label)) err.push(`field '${f.key}' label missing`);
      if (!isHex(f.color)) err.push(`field '${f.key}' color must be #rrggbb`);
      if (!isNum(f.D) || f.D < 0) err.push(`field '${f.key}' D must be a number ≥ 0`);
      if (f.bath !== null && f.bath !== undefined && !isStr(f.bath)) err.push(`field '${f.key}' bath must be null or a dial key`);
      if (f.kBath !== undefined && (!isNum(f.kBath) || f.kBath < 0)) err.push(`field '${f.key}' kBath must be ≥ 0`);
      if (f.decay !== undefined && (!isNum(f.decay) || f.decay < 0)) err.push(`field '${f.key}' decay must be ≥ 0`);
      if (f.boundary !== undefined && !['bath', 'face:+z', 'face:-z'].includes(f.boundary)) err.push(`field '${f.key}' boundary must be bath|face:+z|face:-z`);
      if (f.boundary && f.boundary !== 'bath' && !f.bath) err.push(`field '${f.key}' boundary '${f.boundary}' needs a bath dial`);
    });
    if (!Array.isArray(t.cellTypes) || t.cellTypes.length === 0) err.push('cellTypes must be a non-empty array');
    else t.cellTypes.forEach((c, i) => {
      if (!isStr(c.key) || !ENGINE_IDENT.test(c.key)) err.push(`cellTypes[${i}].key invalid`);
      if (!isStr(c.label)) err.push(`cellType '${c.key}' label missing`);
      if (!Array.isArray(c.colors) || c.colors.length !== 2 || !c.colors.every(isHex)) err.push(`cellType '${c.key}' colors must be two #rrggbb`);
      if (!c.shape || !['a', 'b'].includes(c.shape.by) || !isNum(c.shape.aspectMin) || !isNum(c.shape.aspectMax)) err.push(`cellType '${c.key}' shape must be { by: 'a'|'b', aspectMin, aspectMax }`);
      if (!isNum(c.radius) || c.radius <= 0) err.push(`cellType '${c.key}' radius must be > 0`);
      if (typeof c.motile !== 'boolean') err.push(`cellType '${c.key}' motile must be boolean`);
      if (c.fraction !== undefined && (!isNum(c.fraction) || c.fraction < 0)) err.push(`cellType '${c.key}' fraction must be ≥ 0`);
      if (c.init && ((c.init.a !== undefined && !isNum(c.init.a)) || (c.init.b !== undefined && !isNum(c.init.b)) || (c.init.c !== undefined && !isNum(c.init.c)))) err.push(`cellType '${c.key}' init.a/b/c must be numbers`);
      if (c.cRange !== undefined && (!Array.isArray(c.cRange) || c.cRange.length !== 2 || !c.cRange.every(isNum) || c.cRange[0] >= c.cRange[1])) err.push(`cellType '${c.key}' cRange must be [lo, hi] with lo < hi`);
    });
    if (t.cellTypes && t.cellTypes.length > 255) err.push('at most 255 cell types');
    let nLoad = 0, nCount = 0;
    if (!Array.isArray(t.dials)) err.push('dials must be an array');
    else t.dials.forEach((d, i) => {
      if (!isStr(d.key) || !ENGINE_IDENT.test(d.key)) err.push(`dials[${i}].key invalid`);
      else if (dKeys.includes(d.key)) err.push(`dial key '${d.key}' duplicated`); else dKeys.push(d.key);
      if (!isStr(d.label)) err.push(`dial '${d.key}' label missing`);
      if (!isNum(d.min) || !isNum(d.max) || d.min >= d.max) err.push(`dial '${d.key}' needs min < max`);
      if (!isNum(d.step) || d.step <= 0) err.push(`dial '${d.key}' step must be > 0`);
      if (!isNum(d.default) || d.default < d.min || d.default > d.max) err.push(`dial '${d.key}' default outside [min, max]`);
      if (!(typeof d.format === 'function' || ENGINE_FORMATS.includes(d.format))) err.push(`dial '${d.key}' format must be fixed2|percent|cells|int|onoff|function`);
      if (d.role !== undefined) {
        if (d.role === 'load') nLoad++;
        else if (d.role === 'cellCount') nCount++;
        else err.push(`dial '${d.key}' role must be load|cellCount`);
      }
    });
    if (nLoad > 1) err.push('at most one dial with role load');
    if (nCount > 1) err.push('at most one dial with role cellCount');
    if (Array.isArray(t.fields)) t.fields.forEach((f) => { if (f.bath && !dKeys.includes(f.bath)) err.push(`field '${f.key}' bath '${f.bath}' is not a dial`); });

    const checkPath = (path, where) => { if (!engineStatPathValid(t, path)) err.push(`${where}: unknown stat path '${path}'`); };
    if (!Array.isArray(t.scenarios) || t.scenarios.length === 0) err.push('scenarios must be a non-empty array');
    else {
      t.scenarios.forEach((s) => { if (isStr(s.key)) scKeys.push(s.key); });
      t.scenarios.forEach((s, i) => {
        if (!isStr(s.key) || !ENGINE_IDENT.test(s.key)) err.push(`scenarios[${i}].key invalid`);
        if (scKeys.indexOf(s.key) !== i) err.push(`scenario key '${s.key}' duplicated`);
        if (!isStr(s.title)) err.push(`scenario '${s.key}' title missing`);
        if (s.dials) for (const k of Object.keys(s.dials)) { if (!dKeys.includes(k)) err.push(`scenario '${s.key}' dials: unknown dial '${k}'`); if (!isNum(s.dials[k])) err.push(`scenario '${s.key}' dial '${k}' not a number`); }
        const init = s.init || {};
        if (init.species) for (const k of Object.keys(init.species)) { if (!sKeys.includes(k)) err.push(`scenario '${s.key}' init.species: unknown species '${k}'`); if (!isNum(init.species[k]) || init.species[k] < 0) err.push(`scenario '${s.key}' init.species.${k} must be ≥ 0`); }
        if (init.jitter !== undefined && (!isNum(init.jitter) || init.jitter < 0 || init.jitter > 2)) err.push(`scenario '${s.key}' init.jitter must be in [0, 2]`);
        if (init.fields) for (const k of Object.keys(init.fields)) if (!fKeys.includes(k)) err.push(`scenario '${s.key}' init.fields: unknown field '${k}'`);
        if (init.from) {
          if (!scKeys.includes(init.from.scenario)) err.push(`scenario '${s.key}' init.from.scenario '${init.from.scenario}' unknown`);
          if (init.from.scenario === s.key) err.push(`scenario '${s.key}' init.from refers to itself`);
          if (!isNum(init.from.days) || init.from.days <= 0) err.push(`scenario '${s.key}' init.from.days must be > 0`);
          // cycle detection
          let cur = init.from.scenario, hops = 0;
          while (cur && hops < 10) {
            const nxt = t.scenarios.find((q) => q.key === cur);
            cur = nxt && nxt.init && nxt.init.from ? nxt.init.from.scenario : null; hops++;
            if (cur === s.key) { err.push(`scenario '${s.key}' init.from chain is cyclic`); break; }
          }
        }
        if (s.checks !== undefined && !Array.isArray(s.checks)) err.push(`scenario '${s.key}' checks must be an array`);
        (Array.isArray(s.checks) ? s.checks : []).forEach((c, j) => {
          const w = `scenario '${s.key}' checks[${j}]`;
          if (!isNum(c.at) || c.at < 0) err.push(`${w}: at must be a day ≥ 0`);
          checkPath(c.stat, w);
          if (c.rel) {
            checkPath(c.rel.stat, `${w}.rel`);
            if (!['gt', 'lt'].includes(c.rel.op)) err.push(`${w}.rel.op must be gt|lt`);
            if (c.rel.at !== undefined && (!isNum(c.rel.at) || c.rel.at < 0)) err.push(`${w}.rel.at must be a day ≥ 0`);
            if (c.value !== undefined && !isNum(c.value)) err.push(`${w}: value (offset) must be a number`);
          } else if (c.op === 'between') {
            if (!Array.isArray(c.value) || c.value.length !== 2 || !c.value.every(isNum) || c.value[0] > c.value[1]) err.push(`${w}: between needs value [lo, hi]`);
          } else if (c.op === 'gt' || c.op === 'lt') {
            if (!isNum(c.value)) err.push(`${w}: value must be a number`);
          } else err.push(`${w}: op must be gt|lt|between`);
        });
        (Array.isArray(s.events) ? s.events : []).forEach((e, j) => {
          const w = `scenario '${s.key}' events[${j}]`;
          if (!isNum(e.at) || e.at < 0) err.push(`${w}: at must be a day ≥ 0`);
          if (!e.dials && !e.injure) err.push(`${w}: needs dials or injure`);
          if (e.dials) for (const k of Object.keys(e.dials)) if (!dKeys.includes(k)) err.push(`${w}: unknown dial '${k}'`);
          if (e.injure && !t.injury) err.push(`${w}: injure event but the tissue has no injury block`);
        });
      });
    }
    if (t.readouts !== undefined) {
      if (!Array.isArray(t.readouts)) err.push('readouts must be an array');
      else t.readouts.forEach((r, i) => {
        if (!isStr(r.key)) err.push(`readouts[${i}].key missing`);
        if (!isStr(r.label)) err.push(`readout '${r.key}' label missing`);
        if (!['stack', 'lines', 'log', 'flux'].includes(r.type)) err.push(`readout '${r.key}' type must be stack|lines|log|flux`);
        if (r.type !== 'flux') {
          if (!Array.isArray(r.series) || r.series.length === 0) err.push(`readout '${r.key}' needs series`);
          else r.series.forEach((ser) => { checkPath(ser.stat, `readout '${r.key}' series`); if (!isHex(ser.color)) err.push(`readout '${r.key}' series '${ser.stat}' color must be #rrggbb`); });
        }
      });
    }
    if (t.injury !== undefined && t.injury !== null) {
      const inj = t.injury;
      if (!isNum(inj.radius) || inj.radius <= 0) err.push('injury.radius must be > 0');
      (inj.clearSpecies || []).forEach((k) => { if (!sKeys.includes(k)) err.push(`injury.clearSpecies: unknown species '${k}'`); });
      for (const k of Object.keys(inj.fieldBurst || {})) if (!fKeys.includes(k)) err.push(`injury.fieldBurst: unknown field '${k}'`);
      if (inj.inflammation) {
        for (const k of Object.keys(inj.inflammation.sources || {})) if (!fKeys.includes(k)) err.push(`injury.inflammation.sources: unknown field '${k}'`);
        if (!isNum(inj.inflammation.tau) || inj.inflammation.tau <= 0) err.push('injury.inflammation.tau must be > 0');
      }
    }
    if (t.engine !== undefined) {
      if (typeof t.engine !== 'object') err.push('engine must be an object');
      else for (const [k, v] of Object.entries(t.engine)) {
        if (!(k in ENGINE_DEFAULTS)) err.push(`engine.${k} is not an engine numeric`);
        else if (k === 'trace') { if (v !== 'fiber') err.push("engine.trace must be 'fiber'"); }
        else if (!isNum(v)) err.push(`engine.${k} must be a number`);
      }
    }
    if (t.copy !== undefined && (typeof t.copy !== 'object' || t.copy === null)) err.push('copy must be an object');
    if (t.copy && t.copy.vocabulary) for (const k of ['matrix', 'cellsActive', 'cellsQuiet']) if (!isStr(t.copy.vocabulary[k])) err.push(`copy.vocabulary.${k} missing`);
    return err;
  }
}


// ===== src/tissues/cartilage.js =====
/*
 * src/tissues/cartilage.js — TISSUE_CARTILAGE: articular cartilage engineered in
 * a degrading hydrogel (docs/tissues/cartilage-hydrogel.md §2–§3), written for
 * the generic engine of docs/EXTENDING.md.
 *
 * The anti-fibrous case: round, pinned cells; an isotropic matrix whose
 * stiffness comes from osmotic swelling restrained by a collagen net; a
 * scaffold that must vanish on time; and a phenotype that can flip and stay
 * flipped. The story is a RACE — the hydrogel dissolves on its own clock while
 * the cells try to replace it — not an equilibrium.
 *
 * ---------------------------------------------------------------------------
 * HOW THE SPEC MAPS ONTO THE HOOKS
 * ---------------------------------------------------------------------------
 *  species  scaf (scaffold, the connected network fraction), gag (gel, aggrecan),
 *           col2 (fiber, deposited with pol ≈ 0 so it stays a felt, FA low),
 *           col1 (fiber, deposited along the cell polarity by dedifferentiated
 *           cells, so it is the only species that raises FA).
 *  fields   tgf (bath dial tgfExt, kBath 4), o2 (Dirichlet on the +z medium face
 *           at the o2Ext dial, consumed by cells as a negative fieldSrc, engine
 *           clamps ≥ 0), m (catabolic protease: MMP-13 + aggrecanase, decay 1/d).
 *  cell     a = phi, the phenotype axis (1 chondrogenic ↔ 0 fibroblastic);
 *           b = cat, catabolic memory (IL-1 exposure, slow to clear);
 *           c = the pericellular halo pool (matrix made but trapped by the mesh),
 *           cRange [0, 3], full at c = Pcap = 1.
 *           Colour lerps a = 0 → orange (fibroblastic), a = 1 → teal
 *           (chondrogenic); shape { by: 'a', aspectMin: 2.2, aspectMax: 1 } —
 *           aspect DECREASES with a, so a chondrogenic cell is a sphere and a
 *           dedifferentiated one a spindle. Both the renderer and the Blender
 *           importer compute aspect = aspectMin + (aspectMax − aspectMin)·s
 *           linearly, so aspectMin > aspectMax is legal and does the right thing
 *           (verified: src/render.js:1051, blender/import_tissue.py:583; the
 *           engine's validator only requires two numbers).
 *  voxel    scaffold hydrolysis + cell-enzyme term, GAG loss to the medium and
 *           protease digestion, protected collagen II, slow collagen I loss, and
 *           the pericellular → bulk SPREADING of gag and col2 (see below).
 *  dials    tgfExt, amp (role 'load'), o2Ext, infl, xl, nCells (role 'cellCount'),
 *           serum. `amp` is a strain amplitude in [0, 0.2] shown as 0–20 %;
 *           `o2Ext` is oxygen normalised to 21 % (1 ≡ 21 %) with a formatter that
 *           prints the percentage, so the o2 field is also 0–1 and can share a
 *           0–1 chart with the phenotype.
 *
 * ---------------------------------------------------------------------------
 * WHAT THE ENGINE FORCED (deviations from docs/tissues/cartilage-hydrogel.md)
 * ---------------------------------------------------------------------------
 *  SPREADING  The engine deposits a cell's secretion into the ONE voxel the cell
 *    occupies and never moves matrix between voxels. Chondrocytes are pinned, so
 *    with 160 cells in 12³ voxels only ~8 % of the cube would ever contain
 *    matrix and the mean densities of §2.6 (gag > 0.7) would be unreachable.
 *    The voxel hook therefore runs an explicit 6-neighbour diffusion of gag and
 *    col2 (computed for the whole grid on the v = 0 call, then read back per
 *    voxel), gated by the same mesh factor as the halo: mobility (1 − conf)².
 *    This is the physics the spec already describes at the sub-voxel scale
 *    (Nikolaev 2010: mobile monomer → immobile aggregate; Mauck 2003: collagen II
 *    spreads from pericellular to construct-wide once the mesh opens), lifted to
 *    the voxel scale. Dgag 0.04, Dcol2 0.015 L²/d ⇒ ~10–25 d to fill the cube.
 *  ONE HALO   The spec has two pericellular pools (haloG, haloC); the engine has
 *    one spare cell scalar, so c holds their sum and is released in the fixed
 *    ratio sG : sC2. Release rate kRel·(1 − conf)⁴·c — the mesh gates the release
 *    with the square of the same (1 − conf)² that gates bulk deposition (the
 *    spec's (1 − conf) drained the halo while the mesh was still tight, so the
 *    pericellular islands of scenario 3 never formed).
 *  ONE pol    A cell has one orientation strength for all fiber species. col2
 *    (pol 0) and col1 (pol 0.8·(1 − phi)) are mixed by their deposition rates,
 *    which is exact whenever a cell is making mostly one of them — the usual case.
 *  NO Da      Oxygen is the engine's explicit-Euler field, not a quasi-steady
 *    Gauss–Seidel solve; the engine caps the diffusion number at 1/6, so the
 *    effective D is h²/(6·dt) = 0.058 L²/d and the profile takes ~1 d to form
 *    instead of minutes. The steady profile is what matters and is tuned through
 *    the consumption kO2 instead of a Damköhler number: 5 % in the bath gives
 *    5 % at the medium face and ≈ 1 % at the deep face, 21 % gives 21 → 12 %.
 *  NO mesh-hindered field D   A field's D is a constant of the definition, so the
 *    spec's D_m·(1 − 0.8·conf) for the protease is folded into its source
 *    (kMxl: tight gels make ~25× more MMP-13, Nicodemus 2011).
 *  SCAFFOLD FLUX  out.loss feeds the flux gauge, which has two bars; scaffold
 *    hydrolysis is neither deposition nor degradation of TISSUE, so it is left
 *    out of `loss` (the spec asked for a third bar). The stacked chart still
 *    shows the grey band draining.
 *  MOTILITY   v0 0.05 → 0.35 L/d × (1 − phi)²(1 − scaf): a chondrocyte is pinned
 *    (phi ≈ 0.9 ⇒ 0.004 L/d), but a dedifferentiated cell on a cleared, fibrous
 *    matrix crawls like the fibroblast of TISSUE_FIBROUS. Without that, collagen I
 *    piles up in the ~140 voxels that hold a cell and hits the trace clamp before
 *    the mean can reach the 0.3 of scenario 4.
 *  RADIUS     one radius per cell type, so the spec's rCell·(1 + 0.3·phi) is a
 *    constant 0.032.
 *  aSum       the per-voxel "cell activity" accumulator carries the rate of fresh
 *    aggrecan that washed out of this voxel (see RETENTION below): the cell hook
 *    knows the halo and the voxel hook does not, and there is no other channel
 *    from cell() to voxel().
 *
 * ---------------------------------------------------------------------------
 * PARAMETER / EQUATION CHANGES (the spec's constants are placeholders, and two of
 * its scenario targets contradict its own parameter table; verified with
 * tools/run_headless.mjs + tools/plot_scenarios.py + the scenario checks)
 * ---------------------------------------------------------------------------
 *  RETENTION (the biggest change).  The spec's single escape term
 *    R = 1 − (1 − col2/(col2+cRet))·(1 − 0.8·conf) cannot tell scenario 1 from
 *    scenario 2: by week four both have conf = 0 and similar col2, so they end in
 *    the same place whatever the rate constant. Retention is split in two here.
 *      · FRESH matrix (cell hook) has to be caught where it is made. hold =
 *        scaf + (1 − scaf)·[1 − (1 − H2(col2, cRet))·(1 − H2(gag, gSelf))·(1 − 0.8·halo/Pcap)]:
 *        an intact network, a collagen II net, aggrecan already aggregated, or the
 *        cell's own pericellular island will each do. A fraction
 *        wf = kWashNew·(1 − hold)·(1 + kWash·s(a)) (≤ 0.9) of new aggrecan is lost
 *        at once, and wC2·wf of new procollagen II — collagen has to be assembled
 *        into fibrils at the cell surface, so it is the more fragile of the two.
 *      · The STANDING pool (voxel hook) leaks at kGagLoss·free·(1 + kWash·s(a))·gag
 *        with free = (1 − scaf)·(1 − H2(col2, cRet))·(1 − H2(gag, gSelf)).
 *    Sources: Nikolaev 2010 (mobile monomer → immobile aggregate), Maroudas 1976 /
 *    Williamson 2001 (the collagen net is what holds the swelling pressure),
 *    Schneider 2017 (pericellular islands keep the construct connected through
 *    reverse gelation), Kisiday 2004 and Schneider 2020 (loading raises GAG loss;
 *    daily loading left an MMP-sensitive construct at 26 kPa against 107 kPa in
 *    free swelling). The result is the race the spec describes: scenario 1's halo
 *    hands over its matrix while the mesh is still there and the construct ignites;
 *    scenario 2 loses the same matrix to the medium and never gets going.
 *  tRG(xl) = 7 + 28·xl + 90·xl⁴ d (7 → 125) instead of the spec's linear 7 + 28·xl
 *    (7 → 35). With the linear law even the densest gel reverse-gels by day 35 and
 *    scenario 3's own target (scaf > 0.4 at day 42) is unreachable. The quartic term
 *    reads as the slower hydrolysis per bond of a dense, low-water network and makes
 *    xl = 1 the non-degradable PEG control of Bryant & Anseth 2002 / Skaalure 2014,
 *    while keeping tRG(0.5) = 27 d inside the 2–4 week band of Schneider 2020.
 *  E_scaf ∝ scaf² (percolation: the modulus of a network vanishes faster than its
 *    connected fraction near the gel point) rather than ∝ scaf. This is what gives
 *    scenario 1 its handover dip (35 → 24 kPa in week 1) and scenario 3 its long
 *    slide from 65 to 15 kPa.
 *  SYNTHESIS  sG 0.30 → 0.7, sC2 0.06 → 0.12 per agent. With the spec's rates and
 *    the losses above, scenario 1 reaches gag ≈ 0.35 in eight weeks instead of the
 *    0.7 of §2.6; the ratio sG : sC2 (collagen lags ~5×, Hung 2004) is kept.
 *    fCrowd scale 1.6 → 2.2: at 1.6 product inhibition shuts synthesis down at
 *    gag + col2 ≈ 1.1 and no loss at all could be balanced.
 *  PROTEASE  mBasal 0.35 per agent (m ≈ 0.05 in a cleared gel), kMxl 3 → 20 (m ≈ 0.6
 *    in a tight one; Nicodemus 2011 report ~25× MMP-13), mFib 3 → 1.5, mInfl 20 → 8
 *    (20 gives m ≈ 1.2 at IL-1 0.8, which strips the whole GAG pool in three days;
 *    8 gives ≈ 0.5, the level the spec's kGagDeg was written against). Degradation
 *    uses the protease in EXCESS of a TIMP pool, max(0, m − mTimp), mTimp 0.05, so
 *    basal MMP does not eat a healthy construct (aggrecan half-life is years in vivo)
 *    while IL-1 removes ~20 %/d. kCol2Deg 0.05 → 0.15 so collagen II visibly loses
 *    ground in week 2 of scenario 5 once the aggrecan shielding it is gone (Pratta 2003).
 *  kEnz 0.15 → 0.0015 /d: with the (scaf + sOff) multiplier the spec's value clears
 *    even the densest gel in four days and scenario 3 cannot exist.
 *  PHENOTYPE  cSpread 0.30 → 0.55, cSerum 0.20 → 0.30 so that the fibrocartilage
 *    drift of scenario 4 completes inside eight weeks (phi < 0.3, aspect > 1.8 by
 *    day 42) and still reverses when the medium is corrected.
 * ---------------------------------------------------------------------------
 */

  // ---- the rules
  makeRules(engine, p) {
    const iScaf = engine.speciesIndex.scaf, iGag = engine.speciesIndex.gag;
    const iCol2 = engine.speciesIndex.col2, iCol1 = engine.speciesIndex.col1;
    const fTgf = engine.fieldIndex.tgf, fO2 = engine.fieldIndex.o2, fM = engine.fieldIndex.m;
    const dXl = engine.dialIndex.xl;
    const dInfl = engine.dialIndex.infl, dSerum = engine.dialIndex.serum;
    const NV = engine.NV, N = engine.N;

    // --- pre-resolved constants
    const tgfHalf2 = p.tgfHalf * p.tgfHalf, cRet4 = Math.pow(p.cRet, 4), gSelf2 = p.gSelf * p.gSelf;
    const ESpread2 = p.ESpread * p.ESpread;
    const invAStar = 1 / p.aStar, invAInj = 1 / p.aInj;
    const fracG = p.sG / (p.sG + p.sC2), invPcap = 1 / p.Pcap;
    const invAmpRef = 1 / p.ampRef, eps = p.eps;

    // --- 6-neighbour table (zero-flux walls), shared by every engine with this N
    const nbr = cartNeighbours(N);
    // --- scratch for the pericellular → bulk spreading pass (one per reset)
    const dGag = new Float64Array(NV), dCol2 = new Float64Array(NV), mob = new Float64Array(NV);
    const spScaf = engine.species[iScaf], spGag = engine.species[iGag], spCol2 = engine.species[iCol2];
    const invh2 = 1 / (engine.h * engine.h);

    /** Explicit, mass-conserving diffusion of gag and col2 over the whole grid (see header). */
    const spreadPass = (xl) => {
      for (let v = 0; v < NV; v++) {
        const c = xl * spScaf[v], q = c >= 1 ? 0 : 1 - c;
        mob[v] = q * q;
        dGag[v] = 0; dCol2[v] = 0;
      }
      for (let v = 0; v < NV; v++) {
        const g0 = spGag[v], c0 = spCol2[v], m0 = mob[v], b = 6 * v;
        for (let d = 0; d < 6; d += 2) {           // only the +x, +y, +z neighbours: each face once
          const w = nbr[b + d];
          if (w < 0) continue;
          const k = 0.5 * (m0 + mob[w]) * invh2;
          const fg = p.Dgag * k * (spGag[w] - g0), fc = p.Dcol2 * k * (spCol2[w] - c0);
          dGag[v] += fg; dGag[w] -= fg;
          dCol2[v] += fc; dCol2[w] -= fc;
        }
      }
    };

    const stiffnessOf = (scaf, gag, col2, col1, xl, amp) => {
      const net = p.EgagBase + (1 - p.EgagBase) * col2 / (col2 + p.Ecol2Half);
      return p.E0 + (p.EscafA + p.EscafB * xl) * scaf * scaf   // percolation: E ~ (connected fraction)²
        + p.Egag * gag * Math.sqrt(gag) * net
        + p.Ecol2 * col2 * col2
        + p.Ecol1 * col1 * col1 * (1 + p.kStrain * amp * invAmpRef);
    };

    return {
      cell(ctx) {
        const out = ctx.out, dt = ctx.dt, rho = ctx.rho;
        const scaf = rho[iScaf], gag = rho[iGag], col2 = rho[iCol2], col1 = rho[iCol1];
        const tgf = ctx.field[fTgf], o2 = ctx.field[fO2];
        const amp = ctx.load, xl = ctx.dial[dXl], infl = ctx.dial[dInfl], serum = ctx.dial[dSerum];
        let phi = ctx.a, cat = ctx.b, halo = ctx.c;

        // --- mesh confinement: 0 open, 1 tight
        const conf = xl * scaf > 1 ? 1 : xl * scaf;
        const open = 1 - conf, bulk = open * open;

        // --- modulating functions
        const hT = tgf * tgf / (tgf * tgf + tgfHalf2);
        const fT = p.fT0 + (1 - p.fT0) * hT;
        const u = amp * invAStar, u2 = u * u, q1 = 1 + u2;
        const sLoad = 4 * u2 / (q1 * q1);                       // biphasic bump, peak at aStar
        const w2 = amp * invAInj * amp * invAInj, w4 = w2 * w2;
        const dInj = w4 / (1 + w4);                             // injury above ~aInj
        const mHere = gag + col2 + halo;
        const matPresent = mHere / (mHere + p.matHalf);
        let fL = 1 + p.kStim * sLoad * (1 - dInj) * matPresent - p.kInj * dInj
          - p.kEarly * sLoad * conf * (0.5 + 0.5 * hT);
        if (fL < 0) fL = 0;
        const hyp = 1 - o2 / (o2 + p.o2Half);
        const fO = (1 + p.aHyp * hyp) * o2 / (o2 + p.o2Anox);
        const fI = 1 - p.kIL * cat;
        let fC = 1 - (gag + col2) / p.crowd;
        fC = fC <= 0 ? 0 : fC * fC;

        // --- synthesis (density/day into this voxel, or into the halo while the mesh is tight)
        const anab = phi * phi * fT * fL * fO * fI * fC;
        const sGag = p.sG * anab, sCol2 = p.sC2 * anab;
        const one = 1 - phi;
        const sCol1 = p.sC1 * one * one * (0.5 + 0.5 * hT) * fI * fC;

        const rel = p.kRel * bulk * bulk * halo;                  // halo → voxel as the mesh opens
        let toHalo = (1 - bulk) * (sGag + sCol2);
        if (halo >= p.Pcap) toHalo = 0;                          // saturated: further confined synthesis is wasted
        out.c = halo + (toHalo - rel) * dt;

        // --- fresh matrix has to be caught by something: the intact mesh, the pericellular island
        //     the cell is sitting in, or a collagen II network. What is not caught washes out, and
        //     a squeeze washes out more (Schneider 2017/2020, Kisiday 2004, Roberts 2011).
        //     Procollagen II is the more fragile of the two: it has to be assembled into fibrils
        //     where it is made, so a factor wC2 more of it is lost from an unsupported voxel.
        const hc = halo * invPcap * p.haloBridge;
        const c22 = col2 * col2, c2n = c22 * c22 / (c22 * c22 + cRet4), gn = gag * gag / (gag * gag + gSelf2);
        const hold = scaf + (1 - scaf) * (1 - (1 - c2n) * (1 - gn) * (1 - hc));
        let wf = p.kWashNew * (1 - hold) * (1 + p.kWash * sLoad);
        wf = wf <= 0 ? 0 : (wf > 0.9 ? 0.9 : wf);
        let wf2 = wf * p.wC2;
        if (wf2 > 0.95) wf2 = 0.95;

        out.secrete[iGag] = bulk * sGag + rel * fracG;            // deposited, then washed by voxel()
        out.secrete[iCol2] = bulk * sCol2 * (1 - wf2) + rel * (1 - fracG);
        out.secrete[iCol1] = sCol1;
        out.aSum = wf * bulk * sGag;                             // voxel() removes this again as loss

        // --- orientation: collagen II is laid down isotropically, collagen I along the polarity
        const fib = bulk * sCol2 + rel * (1 - fracG) + sCol1;
        out.pol = fib > eps ? p.polC1 * one * sCol1 / fib : 0;
        out.align = p.kAlign * one * col1 / (col1 + col2 + 0.05);

        // --- fields: TGF-β3 uptake and autocrine release, oxygen consumption, protease
        out.fieldSrc[fTgf] = p.kTauto * phi * sLoad - p.kTup * tgf;
        out.fieldSrc[fO2] = -p.kO2 * o2 / (o2 + p.o2Km);
        out.fieldSrc[fM] = p.mBasal * (1 + p.kMxl * conf) + p.mInfl * infl * infl + p.mFib * one;

        // --- phenotype: round in a gel, spread on a stiff fibrous matrix
        let round = scaf + gag / (gag + p.roundHalf);
        round = round > 1 ? 1 : round;
        const Ev = ctx.E;
        const spread = (1 - round) * (Ev * Ev / (Ev * Ev + ESpread2)) * col1 / (col1 + p.col1Half);
        let phiStar = p.phi0 + p.cTgf * hT + p.cHyp * hyp + p.cRound * round
          + p.cLoad * sLoad * (1 - dInj)
          - p.cSpread * spread - p.cSerum * serum - p.cCat * cat - p.cInj * dInj;
        phiStar = phiStar < 0 ? 0 : (phiStar > 1 ? 1 : phiStar);
        const tauPhi = phiStar < phi ? p.tauPhiDown : p.tauPhiUp;
        phi += (phiStar - phi) * (dt / tauPhi < 1 ? dt / tauPhi : 1);
        const tauC = infl > cat ? p.tauCatUp : p.tauCatDown;
        cat += (infl - cat) * (dt / tauC < 1 ? dt / tauC : 1);
        out.a = phi; out.b = cat;

        // --- motility: chondrocytes are pinned; dedifferentiated cells on cleared matrix crawl
        out.speed = p.v0 * one * one * (1 - (scaf > 1 ? 1 : scaf));
        out.guide = p.kGuide * one;
        out.noise = p.sigmaP * one;
      },

      voxel(ctx) {
        const out = ctx.out, rho = ctx.rho, v = ctx.v;
        const scaf = rho[iScaf], gag = rho[iGag], col2 = rho[iCol2], col1 = rho[iCol1];
        const amp = ctx.load, xl = ctx.dial[dXl];
        const mRaw = ctx.field[fM], m = mRaw > p.mTimp ? mRaw - p.mTimp : 0;   // TIMP-buffered
        if (v === 0) spreadPass(xl);                             // whole-grid pass, once per step

        const conf = xl * scaf > 1 ? 1 : xl * scaf;
        const u = amp * invAStar, u2 = u * u, q1 = 1 + u2, sLoad = 4 * u2 / (q1 * q1);

        // --- scaffold: bulk hydrolysis (clock set by the crosslink dial) + cell enzyme
        const kHyd = p.kRG / (p.tRGa + p.tRGb * xl + p.tRGc * xl * xl * xl * xl);
        const dScaf = -(kHyd * (1 + p.kLoadDeg * sLoad) + p.kEnz * mRaw / (mRaw + p.mK)) * (scaf + p.sOff);

        const wash = ctx.aSum;                                   // fresh aggrecan washed out (see cell())

        // --- aggrecan: escape of the standing pool to the medium (the literal evaporation) + protease
        const c22 = col2 * col2;
        const free = (1 - scaf) * (1 - c22 * c22 / (c22 * c22 + cRet4))
          * (1 - gag * gag / (gag * gag + gSelf2));
        const gagLoss = p.kGagLoss * free * (1 + p.kWash * sLoad) * gag + p.kGagDeg * m * gag + wash;
        // --- collagen II: slow, and shielded while there is aggrecan around it
        const col2Loss = p.kCol2Deg * m * col2 * (1 - gag / (gag + p.gProt));
        // --- collagen I: as in the fibrous tissue, slow
        const col1Loss = p.kCol1Deg * (p.mMin + m) * col1;

        out.dRho[iScaf] = dScaf;
        out.dRho[iGag] = dGag[v] - gagLoss;
        out.dRho[iCol2] = dCol2[v] - col2Loss;
        out.dRho[iCol1] = -col1Loss;
        out.loss = gagLoss + col2Loss + col1Loss;                // the scaffold is neither built nor eaten
        out.E = stiffnessOf(scaf, gag, col2, col1, xl, amp);
      },

      stiffness(ctx) {
        ctx.out.E = stiffnessOf(ctx.rho[iScaf], ctx.rho[iGag], ctx.rho[iCol2], ctx.rho[iCol1],
          ctx.dial[dXl], ctx.load);
      },
    };
  },
};

/** 6-neighbour index table for an N³ grid (−1 at a wall), cached per N. */
const CART_NBR = new Map();
function cartNeighbours(N) {
  let t = CART_NBR.get(N);
  if (t) return t;
  const N2 = N * N, NV = N2 * N;
  t = new Int32Array(6 * NV);
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      for (let k = 0; k < N; k++) {
        const v = (i * N + j) * N + k, b = 6 * v;
        t[b] = i < N - 1 ? v + N2 : -1; t[b + 1] = i > 0 ? v - N2 : -1;
        t[b + 2] = j < N - 1 ? v + N : -1; t[b + 3] = j > 0 ? v - N : -1;
        t[b + 4] = k < N - 1 ? v + 1 : -1; t[b + 5] = k > 0 ? v - 1 : -1;
      }
    }
  }
  CART_NBR.set(N, t);
  return t;
}

/*
 * src/tissues/fibrous.js — TISSUE_FIBROUS: fibrous connective tissue
 * (fibroblasts, provisional matrix → mature collagen I). This is the v0.1
 * model (src/model.js, docs/SPEC.md §1, docs/MODEL.md) expressed as rules for
 * the generic engine; it reproduces v0.1 within the golden tolerance
 * (tests/golden/fibrous.json, seed 7).
 *
 * ---------------------------------------------------------------------------
 * HOW v0.1 MAPS ONTO THE HOOKS (and the v0.1 details that were kept on purpose)
 * ---------------------------------------------------------------------------
 *  cell()   activation  α* = tanh( gsat·(aG + aE·H) − aSoft·Esoft/(E+Esoft) ),
 *                       gsat = g²/(g²+gHalf²),  H = τ²/(1+τ²),  τ = (E/Eref)(strain + κα),
 *                       asymmetric relaxation τUp / τDown; the NEW α is used for
 *                       everything below (as in v0.1) and reported as aSum.
 *           secretion   s = (sBasal + sAct·α²)·(sTens + (1−sTens)·H)·(1 − rho/rhoCrowd)²
 *                       into the 'new' species with pol = polBase + polAct·α,
 *                       where rho is ctx.fiberTotal (the voxel total from the last
 *                       voxel pass, exactly what v0.1 read).
 *           align       kAlign·α (the engine multiplies by dt)
 *           fieldSrc    g: kGcell·α·H (latent TGF-β activation), m: mBasal·P³ + mAct·(1−H)/(1+(α/αHalf)²)
 *           polarity    guide = kGuide (× FA in the engine), loadAlign = kLoadAlign·strain²·H, noise = σP
 *           speed       v0·(1 − 0.6α)·(1 − 0.5·rho/(rho+0.5))·(vFloor + (1−vFloor)·min(1, rho/rhoStar))
 *  voxel()  with tr = ctx.fiberTotal (= new + mat), mEff = mMin + m, shield = 1 − kProt·strain·Tzz/tr:
 *             dv     = kDeg·mEff·(new + rMat·mat)·shield          total loss (v0.1 `dv`)
 *             degMat = kDeg·mEff·rMat·mat                          UNshielded (v0.1 updated rhoMat with this)
 *             mat    = kMat0·new·(kMatBase + kLox·aSum)            cross-linking needs LOX from activated cells
 *             dRho[mat] = mat − degMat ;  dRho[new] = −dv − mat + degMat ;  loss = dv ;  fieldSrc[g] = kGrel·dv
 *           v0.1 scaled the tensor by (1 − dv/tr·dt) and updated rhoMat with the unshielded
 *           mature loss, so the shield acted on the total but not on the new/mature split.
 *           That split is reproduced exactly here (deg_new_effective = dv − degMat).
 *           E is evaluated at the POST-update densities (v0.1 computed E after the ECM
 *           update of the same step): E = E0 + Escale·tr²·(1 + kMat·phi)·(1 + kStrain·strain).
 *           When tr ≤ eps: E = E0 and nothing else happens (the engine zeroes the voxel).
 *  engine   passive alignment kLoadFib·strain², trace clamp rhoMax, PSD guard, FA/axis every
 *           fEvery steps, diffusion (g: bath Gext at kBath 4; m: decay 1 /d), the inflammation
 *           field (sources g 4, m 1 per day, τ 5 d), repulsion, walls, cell count.
 *  scenarios `events` (fibrosis: Gext → 0.2 at day 45; wound: injure at day 5) encode the
 *           protocol of the headless runs and the checks; the app treats them as suggestions.
 *  readouts  the 'align' chart combines the v0.1 alignment and cell-activation charts (as the
 *           v0.1 app drew them); each series carries the verbatim v0.1 unit/meaning.
 *  copy.legend keeps the v0.1 swatch labels (fiberNew, fiberMature, cellQuiescent,
 *           cellActivated) next to the contract's fibers/cells/fields/load.
 *
 * ---------------------------------------------------------------------------
 * PARAMETER / EQUATION CHANGES RELATIVE TO docs/SPEC.md (v0.1 tuning log, kept)
 * ---------------------------------------------------------------------------
 * The spec's constants are order-of-magnitude placeholders. Put together as
 * written they cannot produce the scenario behaviour the spec describes;
 * everything below was changed deliberately and verified with
 * tools/run_headless.mjs + the tests. Reviewer items from docs/MODEL.md §4 are
 * marked [MODEL.md #n].
 *
 *  SECRETION  sAct 0.05 → 2.5, sBasal 0.004 → 0.005. Deposition goes into the ONE voxel the
 *    cell occupies, so the mean rate is (n/N³)·s ≈ 0.093·s at 160 cells; with the spec's
 *    s ≤ 0.054 the tissue cannot reach rho 0.6 in 60 d [MODEL.md #9]. α² (not α): collagen

 *    less [MODEL.md #10]. rhoCrowd 1.6, depCrowd 2 (new): crowding/feedback inhibition lets a
 *    loaded tissue SETTLE at rho ≈ 1 instead of running to the trace clamp.
 *  ACTIVATION  growth factor GATES activation and tension potentiates it (multiplicative,
 *    Hinz) instead of the spec's additive sum (no low state, no hysteresis otherwise). tanh
 *    instead of clamp (α settles at ≈ 0.85–0.9 instead of pinning at 1). Hill-2 on g
 *    (gHalf 0.3 → 0.5) [MODEL.md #8] and on tension (nHill 2) [MODEL.md #4]. The load

    // ECM

    kMat0: 1 / 14, kMatBase: 0.1, kLox: 12,
